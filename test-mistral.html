<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Clé API Mistral</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #0f0f13; color: #e8e8f0; padding: 1.5rem; max-width: 700px; margin: 0 auto; }
        h1 { font-size: 1.3rem; margin-bottom: 1rem; color: #ff7000; }
        .card { background: #1a1a22; border: 1px solid #2e2e3e; border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; }
        label { display: block; font-size: .7rem; text-transform: uppercase; color: #8888a0; font-weight: 700; margin-bottom: .4rem; }
        input, select, textarea { width: 100%; padding: .8rem 1rem; border-radius: 8px; border: 1px solid #2e2e3e; background: #0f0f13; color: #e8e8f0; font-family: inherit; font-size: .9rem; margin-bottom: .8rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ff7000; }
        textarea { min-height: 80px; resize: vertical; }
        button { width: 100%; padding: .9rem; border: none; border-radius: 8px; background: #ff7000; color: #fff; font-size: .95rem; font-weight: 700; cursor: pointer; }
        button:active { opacity: .7; }
        button:disabled { opacity: .3; cursor: not-allowed; }
        .status { padding: .8rem 1rem; border-radius: 8px; font-size: .85rem; margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; }
        .status.loading { background: #1a2a4a; color: #88aaff; }
        .status.success { background: #1a2e1a; color: #4ade80; }
        .status.error   { background: #2e1a1a; color: #ff6b6b; }
        .status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
        .response { background: #0a0a0e; border: 1px solid #2e2e3e; border-radius: 8px; padding: 1rem; font-family: monospace; font-size: .8rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 400px; overflow-y: auto; }
        .meta { font-size: .7rem; color: #8888a0; margin-top: .5rem; font-family: monospace; }
        .hidden { display: none; }
        .hint { font-size: .7rem; color: #55556a; margin-top: -.4rem; margin-bottom: .8rem; }
        .warning { background: #2e1a1a; border: 1px solid #c0392b; border-radius: 8px; padding: .8rem; font-size: .75rem; color: #ff6b6b; margin-bottom: 1rem; }
    </style>
</head>
<body>

<h1>🧪 Test Clé API Mistral</h1>

<div class="warning">
    ⚠️ Ce test utilise un proxy CORS public (corsproxy.io). Votre clé transite par un tiers. Utilisez uniquement une clé de test, pas votre clé de production.
</div>

<div class="card">
    <label for="apiKey">Clé API Mistral (sk-...)</label>
    <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
    <p class="hint">Obtenez-la sur console.mistral.ai → API Keys</p>

    <label for="model">Modèle</label>
    <select id="model">
        <option value="mistral-small-latest">mistral-small-latest (rapide, gratuit)</option>
        <option value="mistral-medium-latest">mistral-medium-latest (équilibré)</option>
        <option value="mistral-large-latest">mistral-large-latest (puissant)</option>
    </select>

    <label for="message">Message de test</label>
    <textarea id="message">Bonjour ! Réponds simplement : est-ce que tu fonctionnes ?</textarea>

    <button id="testBtn" type="button">🚀 Tester la clé</button>
</div>

<div class="status hidden" id="status">
    <span class="dot"></span>
    <span id="statusText"></span>
</div>

<div class="card hidden" id="resultCard">
    <label>Réponse de Mistral</label>
    <div class="response" id="responseText"></div>
    <div class="meta" id="metaText"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const apiKeyEl = $('apiKey'), modelEl = $('model'), messageEl = $('message');
const testBtn = $('testBtn'), statusEl = $('status'), statusText = $('statusText');
const resultCard = $('resultCard'), responseEl = $('responseText'), metaEl = $('metaText');

// Restaurer la clé
try { const saved = localStorage.getItem('mistral_test_key'); if (saved) apiKeyEl.value = saved; } catch(e) {}

function setStatus(type, text) {
    statusEl.className = 'status ' + type;
    statusEl.classList.remove('hidden');
    statusText.textContent = text;
}

async function testKey() {
    const key = apiKeyEl.value.trim();
    const model = modelEl.value;
    const message = messageEl.value.trim();

    if (!key) { setStatus('error', 'Veuillez entrer une clé API.'); return; }
    if (!key.startsWith('sk-')) { setStatus('error', 'La clé doit commencer par sk-.'); return; }
    if (!message) { setStatus('error', 'Veuillez entrer un message.'); return; }

    try { localStorage.setItem('mistral_test_key', key); } catch(e) {}

    testBtn.disabled = true;
    statusEl.classList.add('hidden');
    resultCard.classList.add('hidden');
    setStatus('loading', 'Envoi de la requête à Mistral…');

    const startTime = performance.now();

    try {
        // URL Mistral via proxy CORS public
        const mistralUrl = 'https://api.mistral.ai/v1/chat/completions';
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(mistralUrl);

        const response = await fetch(proxyUrl, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + key,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: model,
                messages: [{ role: 'user', content: message }],
                temperature: 0.3,
                max_tokens: 500
            })
        });

        const elapsed = Math.round(performance.now() - startTime);
        const rawText = await response.text();

        let data;
        try { data = JSON.parse(rawText); } catch(e) { data = null; }

        if (!response.ok) {
            let errMsg = 'Erreur HTTP ' + response.status;
            if (data?.message) errMsg += ' — ' + data.message;
            else if (data?.error?.message) errMsg += ' — ' + data.error.message;
            else errMsg += ' — ' + rawText.slice(0, 200);
            setStatus('error', errMsg);
            responseEl.textContent = rawText.slice(0, 2000);
            metaEl.textContent = 'Temps : ' + elapsed + ' ms · Status : ' + response.status;
            resultCard.classList.remove('hidden');
            return;
        }

        const content = data?.choices?.[0]?.message?.content || '(réponse vide)';
        const usage = data?.usage;
        const usageText = usage ? `Tokens : ${usage.prompt_tokens} + ${usage.completion_tokens} = ${usage.total_tokens}` : '';

        setStatus('success', '✓ La clé API fonctionne correctement !');
        responseEl.textContent = content;
        metaEl.textContent = 'Temps : ' + elapsed + ' ms · Modèle : ' + model + (usageText ? ' · ' + usageText : '');
        resultCard.classList.remove('hidden');

    } catch (err) {
        const elapsed = Math.round(performance.now() - startTime);
        let errMsg = 'Erreur : ' + err.message;
        if (err.message.includes('Failed to fetch')) {
            errMsg = 'Impossible de contacter l\'API via le proxy. Essayez un autre proxy ou vérifiez votre connexion.';
        }
        setStatus('error', errMsg);
        responseEl.textContent = 'Détail :\n' + err.stack;
        metaEl.textContent = 'Temps : ' + elapsed + ' ms';
        resultCard.classList.remove('hidden');
    } finally {
        testBtn.disabled = false;
    }
}

testBtn.addEventListener('click', testKey);
apiKeyEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); testKey(); } });
</script>

</body>
</html>
