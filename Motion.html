
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tunnel Infini — Neon Loop</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;color:#d9faff;
font:10px Arial,sans-serif;letter-spacing:4px}
.label{position:absolute;top:5%;width:100%;text-align:center;opacity:.8}
.label strong{color:#00f5ff;font-weight:400}
.bottom{position:absolute;bottom:7%;width:100%;text-align:center;
text-shadow:0 0 15px #00eaff}
#controls{position:fixed;bottom:2%;left:50%;transform:translateX(-50%);
display:flex;gap:8px;pointer-events:auto}
button{background:#080d1ddc;color:#b9faff;border:1px solid #00eaff66;
border-radius:30px;padding:9px 14px;letter-spacing:1px;cursor:pointer}
button:hover{background:#13213c}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="label"><strong>●</strong> INFINITE DIMENSION / 001</div>
  <div class="bottom">NO BEGINNING <strong> · </strong> NO END</div>
</div>
<div id="controls">
  <button id="toggle">Ⅱ PAUSE</button>
  <button id="speed">VITESSE ×1</button>
  <button id="full">PLEIN ÉCRAN</button>
</div>
<script>
const canvas=document.querySelector('#c');
const ctx=canvas.getContext('2d');
let w,h,dpr,depth=0,running=true,speed=1,last=0;
let stars=[];
const TAU=Math.PI*2;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 w=innerWidth;h=innerHeight;
 canvas.width=w*dpr;canvas.height=h*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:150},()=>({
   a:Math.random()*TAU,
   r:.3+Math.random()*.7,
   s:.5+Math.random()*1.8
 }));
}
addEventListener('resize',resize);resize();

function roundedRect(x,y,ww,hh,r){
 ctx.beginPath();
 ctx.roundRect(x,y,ww,hh,r);
}

function frame(t){
 if(!running)return;
 const dt=Math.min((t-last)/1000||0,.04);
 last=t;
 depth=(depth+dt*speed*.17)%1;

 ctx.fillStyle='#02030a';
 ctx.fillRect(0,0,w,h);

 const cx=w/2,cy=h*.49;
 const base=Math.min(w*.87,h*.48);
 const horizon=Math.min(w,h)*.94;

 // Halo au point de fuite
 let glow=ctx.createRadialGradient(cx,cy,0,cx,cy,horizon*.65);
 glow.addColorStop(0,'#24154a');
 glow.addColorStop(.22,'#10132d');
 glow.addColorStop(1,'#02030a');
 ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);

 // Les cadres se répètent sur une profondeur périodique.
 // Leur taille est calculée à partir de leur distance au point de fuite.
 const count=22;
 for(let i=count-1;i>=0;i--){
   const z=((i/count+depth)%1);
   const perspective=.035/Math.max(.035,1-z*.965);
   const scale=perspective;
   const rw=base*scale;
   const rh=base*1.18*scale;
   if(rw>w*1.8||rh>h*1.8)continue;

   const alpha=Math.min(1,.25+z*.9);
   const hue=(185+z*105)%360;
   const color=`hsla(${hue},100%,65%,${alpha})`;
   const line=Math.max(.6,2.2*scale);
   const x=cx-rw/2,y=cy-rh/2;
   const radius=Math.min(rw*.15,24*scale);

   ctx.save();
   ctx.shadowColor=color;
   ctx.shadowBlur=16*scale+3;
   ctx.strokeStyle=color;
   ctx.lineWidth=line;
   roundedRect(x,y,rw,rh,radius);
   ctx.stroke();

   // Deuxième contour intérieur pour la profondeur
   ctx.shadowBlur=8*scale;
   ctx.strokeStyle=`rgba(80,180,255,${alpha*.25})`;
   ctx.lineWidth=Math.max(.5,line*.55);
   roundedRect(x+rw*.055,y+rh*.045,rw*.89,rh*.91,radius*.75);
   ctx.stroke();

   // Barres lumineuses sur les côtés
   ctx.shadowColor='#ff31d9';
   ctx.shadowBlur=12*scale;
   ctx.strokeStyle=`rgba(255,49,217,${alpha*.8})`;
   ctx.lineWidth=Math.max(.6,line*.75);
   ctx.beginPath();
   ctx.moveTo(x,y+rh*.35);ctx.lineTo(x,y+rh*.55);
   ctx.moveTo(x+rw,y+rh*.65);ctx.lineTo(x+rw,y+rh*.45);
   ctx.stroke();
   ctx.restore();
 }

 // Particules qui filent vers les bords
 for(const p of stars){
   const z=((p.r+depth*p.s*.45)%1);
   const radius=2+z*z*Math.max(w,h)*.55;
   const x=cx+Math.cos(p.a)*radius;
   const y=cy+Math.sin(p.a)*radius;
   if(x<0||x>w||y<0||y>h)continue;
   const alpha=.15+z*.7;
   ctx.fillStyle=`rgba(0,230,255,${alpha})`;
   ctx.fillRect(x,y,1+z*2,1+z*2);
 }

 // Lignes de vitesse discrètes
 for(let i=0;i<32;i++){
   const a=i*TAU/32;
   const z=((i*.173+depth*1.8)%1);
   const r1=base*.15+z*base*1.5;
   const r2=r1+12*speed;
   ctx.beginPath();
   ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
   ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
   ctx.strokeStyle=`rgba(110,190,255,${(1-z)*.35})`;
   ctx.lineWidth=.8;ctx.stroke();
 }

 requestAnimationFrame(frame);
}

document.querySelector('#toggle').onclick=e=>{
 running=!running;
 e.target.textContent=running?'Ⅱ PAUSE':'▶ REPRENDRE';
 if(running){last=performance.now();requestAnimationFrame(frame)}
};
document.querySelector('#speed').onclick=e=>{
 speed=speed===1?2:speed===2?.5:1;
 e.target.textContent='VITESSE ×'+speed;
};
document.querySelector('#full').onclick=async()=>{
 if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();
 else await document.exitFullscreen?.();
};
requestAnimationFrame(frame);
</script>
</body>
</html>
