<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anima — Animez vos photos</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
        --bg: #0a0a0f;
        --panel: #16161d;
        --panel-2: #1e1e28;
        --border: #2a2a35;
        --ink: #f5f5f7;
        --ink-dim: #8888a0;
        --accent: #7c5cff;
        --accent-2: #b47cff;
        --success: #2d8a4e;
        --error: #c0392b;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        padding: 1.5rem 1rem 5rem;
        font-size: 15px;
        line-height: 1.5;
        max-width: 560px;
        margin: 0 auto;
        background-image:
            radial-gradient(circle at 20% 10%, rgba(124,92,255,0.12) 0%, transparent 40%),
            radial-gradient(circle at 80% 90%, rgba(180,124,255,0.08) 0%, transparent 40%);
        background-attachment: fixed;
    }
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #f5f5f7 0%, var(--accent-2) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.3rem;
    }
    .subtitle {
        font-size: 0.82rem;
        color: var(--ink-dim);
        letter-spacing: 0.02em;
    }

    /* ═══ ÉTAPE 1 : CLÉ API ═══ */
    .step {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.1rem;
        margin-bottom: 1rem;
        position: relative;
        overflow: hidden;
    }
    .step.complete { border-color: var(--success); }
    .step-num {
        position: absolute;
        top: -8px; left: 16px;
        background: var(--accent);
        color: #fff;
        font-size: 0.65rem;
        font-weight: 800;
        padding: 0.15rem 0.55rem;
        border-radius: 10px;
        letter-spacing: 0.08em;
    }
    .step-title {
        font-size: 0.95rem;
        font-weight: 600;
        margin-bottom: 0.7rem;
        color: var(--ink);
    }

    .api-input {
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--ink);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.82rem;
        margin-bottom: 0.55rem;
    }
    .api-input:focus { outline: none; border-color: var(--accent); }
    .api-btn {
        width: 100%;
        padding: 0.7rem;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-size: 0.85rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        letter-spacing: 0.03em;
    }
    .api-btn:active { transform: scale(0.98); }
    .api-status {
        font-size: 0.72rem;
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        margin-top: 0.6rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: var(--panel-2);
        color: var(--ink-dim);
    }
    .api-status.ok {
        background: rgba(45,138,78,0.18);
        color: #4ec97a;
        font-weight: 600;
    }
    .api-status .dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--ink-dim);
    }
    .api-status.ok .dot { background: #4ec97a; box-shadow: 0 0 8px #4ec97a; }
    .api-link {
        font-size: 0.7rem;
        color: var(--ink-dim);
        margin-top: 0.5rem;
        display: block;
    }
    .api-link a { color: var(--accent-2); text-decoration: none; }

    /* ═══ ÉTAPE 2 : PHOTO ═══ */
    .upload {
        border: 2px dashed var(--border);
        border-radius: 14px;
        padding: 2rem 1rem;
        text-align: center;
        cursor: pointer;
        background: var(--panel-2);
        transition: all 0.2s;
    }
    .upload:active { border-color: var(--accent); background: rgba(124,92,255,0.08); }
    .upload.loading { pointer-events: none; opacity: 0.6; }
    .upload input { display: none; }
    .upload-icon {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .upload-text { font-size: 0.95rem; font-weight: 500; }
    .upload-hint { font-size: 0.72rem; color: var(--ink-dim); margin-top: 0.2rem; }

    .photos-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 0.5rem;
        margin-top: 0.8rem;
    }
    .photo-card {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        aspect-ratio: 9/16;
        border: 1px solid var(--border);
    }
    .photo-card img {
        width: 100%; height: 100%;
        object-fit: cover; display: block;
    }
    .photo-card .x {
        position: absolute;
        top: 4px; right: 4px;
        background: rgba(0,0,0,0.75);
        color: #fff;
        border: none;
        width: 24px; height: 24px;
        border-radius: 50%;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* ═══ ÉTAPE 3 : AMBIANCE ═══ */
    .ambiances {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.4rem;
    }
    .ambiance {
        padding: 0.7rem 0.3rem;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        cursor: pointer;
        text-align: center;
        transition: all 0.15s;
        user-select: none;
    }
    .ambiance:active { transform: scale(0.95); }
    .ambiance.selected {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        border-color: transparent;
        box-shadow: 0 4px 20px rgba(124,92,255,0.35);
    }
    .ambiance-emoji { font-size: 1.4rem; display: block; margin-bottom: 0.25rem; }
    .ambiance-name {
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
    }

    /* ═══ BOUTON FINAL ═══ */
    .btn-go {
        width: 100%;
        padding: 1.15rem;
        border-radius: 16px;
        border: none;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        color: #fff;
        font-size: 1.05rem;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        letter-spacing: 0.03em;
        margin-top: 1.2rem;
        box-shadow: 0 8px 30px rgba(124,92,255,0.35);
        transition: all 0.15s;
    }
    .btn-go:active:not(:disabled) { transform: scale(0.98); }
    .btn-go:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow: none;
        filter: grayscale(0.6);
    }

    .btn-stop {
        width: 100%;
        padding: 0.75rem;
        border-radius: 12px;
        border: 1px solid var(--error);
        background: transparent;
        color: var(--error);
        font-size: 0.82rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        margin-top: 0.6rem;
        display: none;
    }
    .btn-stop.visible { display: block; }

    /* ═══ FILE D'ATTENTE ═══ */
    .queue { margin-top: 1rem; }
    .q-item {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.65rem 0.8rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        margin-bottom: 0.4rem;
        background: var(--panel);
        font-size: 0.8rem;
    }
    .q-item.done { border-color: var(--success); }
    .q-item.failed { border-color: var(--error); }
    .q-item.processing { border-color: var(--accent); }
    .q-icon { font-size: 1rem; width: 1.4rem; text-align: center; flex-shrink: 0; }
    .q-name {
        flex: 1; min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .q-status {
        font-size: 0.68rem;
        color: var(--ink-dim);
        text-align: right;
        flex-shrink: 0;
        max-width: 55%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ═══ GALERIE ═══ */
    .gallery {
        margin-top: 1.5rem;
        display: none;
    }
    .gallery.visible { display: block; }
    .gallery-title {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ink-dim);
        font-weight: 700;
        margin-bottom: 0.7rem;
    }
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 0.7rem;
    }
    .g-item {
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border);
        background: #000;
        animation: fadeIn 0.4s ease;
    }
    .g-item video {
        width: 100%;
        display: block;
        aspect-ratio: 9/16;
        object-fit: cover;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ═══ STATUS BAR ═══ */
    .status {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: var(--panel);
        border-top: 1px solid var(--border);
        color: var(--ink);
        padding: 0.75rem 1rem;
        font-size: 0.78rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        transform: translateY(100%);
        transition: transform 0.3s;
        z-index: 100;
    }
    .status.visible { transform: translateY(0); }
    .status .spin {
        width: 12px; height: 12px;
        border: 2px solid rgba(124,92,255,0.3);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══ TOAST ═══ */
    .toast {
        position: fixed;
        top: 1.2rem; left: 50%;
        transform: translateX(-50%) translateY(-80px);
        background: var(--accent);
        color: #fff;
        padding: 0.75rem 1.3rem;
        border-radius: 12px;
        font-size: 0.82rem;
        font-weight: 600;
        opacity: 0;
        transition: all 0.35s;
        z-index: 1000;
        max-width: 85vw;
        box-shadow: 0 6px 30px rgba(124,92,255,0.4);
    }
    .toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { background: var(--success); box-shadow: 0 6px 30px rgba(45,138,78,0.4); }
    .toast.error { background: var(--error); box-shadow: 0 6px 30px rgba(192,57,43,0.4); }

    #noSleepCanvas, #noSleepVideo {
        position: fixed;
        top: 0; left: 0;
        width: 1px; height: 1px;
        opacity: 0.01;
        pointer-events: none;
        z-index: -1;
    }
</style>
</head>
<body>

<header>
    <h1>Anima</h1>
    <p class="subtitle">Vos photos prennent vie</p>
</header>

<!-- ═══ ÉTAPE 1 : CLÉ API ═══ -->
<div class="step" id="step-api">
    <div class="step-num">1</div>
    <div class="step-title">🔑 Votre clé API</div>
    <input type="password" class="api-input" id="api-input"
           placeholder="sk-..." autocomplete="off" spellcheck="false">
    <button class="api-btn" id="api-btn">Enregistrer</button>
    <div class="api-status" id="api-status">
        <span class="dot"></span>
        <span id="api-status-text">Aucune clé enregistrée</span>
    </div>
    <span class="api-link">Clé gratuite sur <a href="https://platform.agnes-ai.com" target="_blank">platform.agnes-ai.com</a></span>
</div>

<!-- ═══ ÉTAPE 2 : PHOTOS ═══ -->
<div class="step" id="step-photos">
    <div class="step-num">2</div>
    <div class="step-title">📸 Vos photos</div>
    <div class="upload" id="upload">
        <input type="file" id="file-input" accept="image/*" multiple>
        <div class="upload-icon">＋</div>
        <div class="upload-text">Ajouter des photos</div>
        <div class="upload-hint">Autant que vous voulez</div>
    </div>
    <div class="photos-grid" id="photos-grid"></div>
</div>

<!-- ═══ ÉTAPE 3 : AMBIANCE ═══ -->
<div class="step" id="step-ambiance">
    <div class="step-num">3</div>
    <div class="step-title">🎨 Ambiance</div>
    <div class="ambiances" id="ambiances"></div>
</div>

<!-- ═══ BOUTON FINAL ═══ -->
<button class="btn-go" id="go-btn" disabled>Animer mes photos</button>
<button class="btn-stop" id="stop-btn">⏹ Arrêter</button>

<!-- ═══ FILE D'ATTENTE ═══ -->
<div class="queue" id="queue"></div>

<!-- ═══ GALERIE ═══ -->
<div class="gallery" id="gallery">
    <div class="gallery-title">✨ Vos vidéos</div>
    <div class="gallery-grid" id="gallery-grid"></div>
</div>

<div class="status" id="status">
    <div class="spin"></div>
    <span id="status-text">…</span>
</div>

<div class="toast" id="toast"></div>

<canvas id="noSleepCanvas" width="2" height="2"></canvas>
<video id="noSleepVideo" playsinline muted loop></video>

<script>
// ══════════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════════
const API_BASE = 'https://apihub.agnes-ai.com/v1';
const POLL_BASE = 'https://apihub.agnes-ai.com/agnesapi';
const MODEL = 'agnes-video-v2.0';
const FPS = 24;
const FRAMES = 153;
const CREATE_INTERVAL_MS = 62000;
const POLL_INTERVAL = 8;
const MAX_POLL = 100;
const API_KEY = 'anima_api_key';
const MAX_SIZE = 12 * 1024 * 1024;

// ══════════════════════════════════════════════════════════════════
// LES 5 AMBIANCES
// ══════════════════════════════════════════════════════════════════
const AMBIANCES = [
    {
        id: 'doux',
        emoji: '🌬️',
        name: 'Doux',
        prompt: 'Animate with very gentle, subtle motion. Soft breathing, light movements, peaceful atmosphere. Slow and calm.'
    },
    {
        id: 'cinema',
        emoji: '🎬',
        name: 'Cinéma',
        prompt: 'Cinematic film look with dramatic lighting, shallow depth of field, subtle film grain, professional color grading. Movie atmosphere.'
    },
    {
        id: 'magique',
        emoji: '✨',
        name: 'Magique',
        prompt: 'Enchanting magical atmosphere with soft glowing light, floating particles, dreamy sparkles. Whimsical and beautiful.'
    },
    {
        id: 'drame',
        emoji: '🌓',
        name: 'Drame',
        prompt: 'High contrast dramatic lighting with deep shadows, intense emotional atmosphere, chiaroscuro effect. Powerful and intense.'
    },
    {
        id: 'chaud',
        emoji: '🌅',
        name: 'Chaud',
        prompt: 'Warm golden hour sunlight with soft amber glow, long gentle shadows, cozy luminous atmosphere. Warm and inviting.'
    }
];

// ══════════════════════════════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════════════════════════════
const state = {
    photos: [],
    ambiance: 'doux',
    running: false,
    stop: false,
    completed: 0,
    failed: 0,
    loading: false
};

// ══════════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

let toastT;
function toast(msg, type = 'success') {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    void t.offsetWidth;
    t.classList.add('visible');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('visible'), 2600);
}

function setStatus(text) {
    const s = $('status'), st = $('status-text');
    if (text) { s.classList.add('visible'); st.textContent = text; }
    else s.classList.remove('visible');
}

// ══════════════════════════════════════════════════════════════════
// ANTI-VEILLE
// ══════════════════════════════════════════════════════════════════
let canvasStream = null, canvasInterval = null;
async function wakeLock() {
    try {
        if ('wakeLock' in navigator) {
            await navigator.wakeLock.request('screen');
            return;
        }
    } catch (e) {}
    try {
        const c = $('noSleepCanvas'), v = $('noSleepVideo');
        if (!c || !v || typeof c.captureStream !== 'function') return;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 2, 2);
        canvasStream = c.captureStream(1);
        let t = false;
        canvasInterval = setInterval(() => {
            t = !t;
            ctx.fillStyle = t ? '#000' : '#010101';
            ctx.fillRect(0, 0, 2, 2);
        }, 1000);
        v.srcObject = canvasStream;
        v.muted = true; v.playsInline = true;
        v.play().catch(() => {});
    } catch (e) {}
}

// ══════════════════════════════════════════════════════════════════
// CLÉ API
// ══════════════════════════════════════════════════════════════════
function getKey() {
    try { return (localStorage.getItem(API_KEY) || '').trim(); }
    catch (e) { return ''; }
}
function saveKey() {
    const v = $('api-input').value.trim();
    if (!v) {
        try { localStorage.removeItem(API_KEY); } catch (e) {}
        refresh();
        toast('Clé supprimée', 'error');
        return;
    }
    if (!v.startsWith('sk-') && !confirm('La clé ne commence pas par sk-. Sauvegarder ?')) return;
    try {
        localStorage.setItem(API_KEY, v);
        refresh();
        toast('Clé enregistrée ✓');
        $('api-input').blur();
    } catch (e) { toast('Erreur', 'error'); }
}

function refresh() {
    const k = getKey();
    const step = $('step-api'), s = $('api-status'), st = $('api-status-text');
    if (k) {
        step.classList.add('complete');
        s.classList.add('ok');
        st.textContent = 'Clé active · ' + k.slice(0, 8) + '…';
        $('api-input').value = k;
    } else {
        step.classList.remove('complete');
        s.classList.remove('ok');
        st.textContent = 'Aucune clé enregistrée';
        $('api-input').value = '';
    }
    updateGo();
}

function updateGo() {
    const b = $('go-btn');
    const ok = getKey() && state.photos.length > 0 && !state.running && !state.loading;
    b.disabled = !ok;
    if (state.running) {
        b.textContent = 'Production… (' + (state.completed + state.failed) + '/' + state.photos.length + ')';
    } else if (!getKey()) {
        b.textContent = 'Ajoutez votre clé API';
    } else if (!state.photos.length) {
        b.textContent = 'Ajoutez des photos';
    } else {
        const n = state.photos.length;
        b.textContent = '✨ Animer ' + n + ' photo' + (n > 1 ? 's' : '');
    }
}

// ══════════════════════════════════════════════════════════════════
// PHOTOS
// ══════════════════════════════════════════════════════════════════
function toDataUri(file) {
    return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.onerror = rej;
        r.readAsDataURL(file);
    });
}
function makeThumb(uri) {
    return new Promise(res => {
        const im = new Image();
        im.onload = () => {
            try {
                const c = document.createElement('canvas');
                c.width = 200;
                c.height = Math.round(200 * im.height / im.width);
                c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
                res(c.toDataURL('image/jpeg', 0.75));
            } catch (e) { res(uri); }
        };
        im.onerror = () => res(uri);
        im.src = uri;
    });
}

async function addFiles(files) {
    const imgs = Array.from(files).filter(f => f.type.startsWith('image/'));
    if (!imgs.length) return;
    state.loading = true;
    updateGo();
    setStatus('Chargement…');
    $('upload').classList.add('loading');

    for (const f of imgs) {
        if (f.size > MAX_SIZE) continue;
        try {
            const uri = await toDataUri(f);
            const thumb = await makeThumb(uri);
            state.photos.push({ id: Date.now() + Math.random(), uri, thumb });
            renderPhotos();
        } catch (e) {}
    }

    state.loading = false;
    $('upload').classList.remove('loading');
    setStatus(null);
    updateGo();
    toast(state.photos.length + ' photo' + (state.photos.length > 1 ? 's' : ''), 'success');
}

function removePhoto(id) {
    state.photos = state.photos.filter(p => p.id !== id);
    renderPhotos();
    updateGo();
}

function renderPhotos() {
    const g = $('photos-grid');
    g.innerHTML = state.photos.map(p =>
        '<div class="photo-card">' +
            '<img src="' + p.thumb + '">' +
            '<button class="x" data-id="' + p.id + '">✕</button>' +
        '</div>'
    ).join('');
    g.querySelectorAll('[data-id]').forEach(b => {
        b.addEventListener('click', e => {
            e.stopPropagation();
            removePhoto(parseFloat(b.dataset.id));
        });
    });
}

// ══════════════════════════════════════════════════════════════════
// AMBIANCES
// ══════════════════════════════════════════════════════════════════
function renderAmbiances() {
    const c = $('ambiances');
    c.innerHTML = AMBIANCES.map(a =>
        '<div class="ambiance ' + (state.ambiance === a.id ? 'selected' : '') + '" data-id="' + a.id + '">' +
            '<span class="ambiance-emoji">' + a.emoji + '</span>' +
            '<span class="ambiance-name">' + a.name + '</span>' +
        '</div>'
    ).join('');
    c.querySelectorAll('.ambiance').forEach(el => {
        el.addEventListener('click', () => {
            state.ambiance = el.dataset.id;
            renderAmbiances();
        });
    });
}

// ══════════════════════════════════════════════════════════════════
// PROMPT
// ══════════════════════════════════════════════════════════════════
function buildPrompt() {
    const amb = AMBIANCES.find(a => a.id === state.ambiance) || AMBIANCES[0];
    return [
        'Animate this exact image as the starting frame.',
        'The subject must remain IDENTICAL to the input: same face, same identity, same composition, same framing.',
        'This is a CONTINUATION of the source image, not a re-imagination.',
        'Only subtle motion, breathing, light and atmosphere are animated.',
        amb.prompt,
        'Subtle natural motion, breathing, gentle micro-movements.',
        'Sound design: soft ambient, no music, no dialogue.',
        'Portrait 9:16 vertical, 24fps, no text, no watermarks.'
    ].join(' ');
}

// ══════════════════════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════════════════════
async function apiFetch(url, opts = {}) {
    for (let i = 0; i < 7; i++) {
        if (state.stop) throw new Error('stop');
        try {
            const r = await fetch(url, opts);
            if (r.status === 429) {
                const w = [15, 30, 45, 60, 90, 120, 180][Math.min(i, 6)];
                setStatus('L\'IA se prépare… (' + w + 's)');
                await sleep(w * 1000);
                continue;
            }
            if (r.status === 503) {
                const w = [5, 10, 15, 20, 30, 45][Math.min(i, 5)];
                setStatus('Préparation… (' + w + 's)');
                await sleep(w * 1000);
                continue;
            }
            return r;
        } catch (e) {
            if (e.message === 'stop') throw e;
            const w = [3, 5, 8, 12, 20, 30][Math.min(i, 5)];
            setStatus('Connexion… (' + w + 's)');
            await sleep(w * 1000);
        }
    }
    return fetch(url, opts);
}

async function createTask(uri) {
    const r = await apiFetch(API_BASE + '/videos', {
        method: 'POST',
        headers: {
            'Authorization': 'Bearer ' + getKey(),
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            model: MODEL,
            prompt: buildPrompt(),
            image: uri,
            num_frames: FRAMES,
            frame_rate: FPS
        })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const id = d.video_id || d.id || d.task_id;
    if (!id) throw new Error('Pas de video_id');
    return id;
}

async function pollTask(id, onP) {
    let wait = 25;
    while (wait > 0) {
        if (state.stop) throw new Error('stop');
        onP('Préparation… — ' + wait + 's');
        await sleep(1000);
        wait--;
    }
    for (let i = 0; i < MAX_POLL; i++) {
        if (state.stop) throw new Error('stop');
        if (i > 0) {
            let r = POLL_INTERVAL;
            while (r > 0) {
                if (state.stop) throw new Error('stop');
                onP('Création… — ' + r + 's');
                await sleep(1000);
                r--;
            }
        }
        const u = POLL_BASE + '?video_id=' + encodeURIComponent(id) + '&model_name=' + encodeURIComponent(MODEL);
        const r = await apiFetch(u, {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + getKey() }
        });
        const d = await r.json();
        const s = d.status || 'unknown';
        onP('Création… ' + (d.progress || 0) + '%');
        if (s === 'completed' || s === 'succeeded' || s === 'done') {
            const url = (d.metadata && d.metadata.url) || d.url || (d.output && d.output.url);
            if (!url) throw new Error('Pas d\'URL');
            return url;
        }
        if (s === 'failed' || s === 'error' || s === 'cancelled') {
            throw new Error('Échec');
        }
    }
    throw new Error('Timeout');
}

// ══════════════════════════════════════════════════════════════════
// FILE
// ══════════════════════════════════════════════════════════════════
const queue = [];

function renderQueue() {
    const q = $('queue');
    if (!queue.length) { q.innerHTML = ''; return; }
    q.innerHTML = queue.map(it => {
        let icon = '○', txt = 'En attente', cls = '';
        if (it.s === 'creating') { icon = '◐'; txt = 'Préparation…'; cls = 'processing'; }
        else if (it.s === 'processing') { icon = '◐'; txt = it.p || '…'; cls = 'processing'; }
        else if (it.s === 'done') { icon = '●'; txt = 'Terminé'; cls = 'done'; }
        else if (it.s === 'failed') { icon = '✕'; txt = 'Échec'; cls = 'failed'; }
        return '<div class="q-item ' + cls + '">' +
            '<span class="q-icon">' + icon + '</span>' +
            '<span class="q-name">Photo ' + (it.i + 1) + '</span>' +
            '<span class="q-status">' + esc(txt) + '</span>' +
        '</div>';
    }).join('');
}

// ══════════════════════════════════════════════════════════════════
// GALERIE
// ══════════════════════════════════════════════════════════════════
function addGallery(url, i) {
    $('gallery').classList.add('visible');
    const el = document.createElement('div');
    el.className = 'g-item';
    el.innerHTML = '<video controls preload="metadata" muted playsinline>' +
        '<source src="' + url + '" type="video/mp4">' +
        '</video>';
    $('gallery-grid').appendChild(el);
}

// ══════════════════════════════════════════════════════════════════
// PIPELINE
// ══════════════════════════════════════════════════════════════════
async function processOne(item) {
    try {
        item.s = 'creating';
        renderQueue();
        const id = await createTask(item.photo.uri);
        item.s = 'processing';
        renderQueue();
        const url = await pollTask(id, p => { item.p = p; renderQueue(); });
        item.s = 'done';
        state.completed++;
        renderQueue();
        updateGo();
        addGallery(url, item.i);
    } catch (e) {
        if (e.message !== 'stop') {
            item.s = 'failed';
            item.p = 'Échec';
            state.failed++;
        } else {
            item.s = 'failed';
            item.p = 'Arrêté';
        }
        renderQueue();
        updateGo();
    }
}

async function start() {
    if (state.running || !state.photos.length) return;
    if (!getKey()) { toast('Ajoutez votre clé API', 'error'); return; }

    state.running = true;
    state.stop = false;
    state.completed = 0;
    state.failed = 0;

    queue.length = 0;
    state.photos.forEach((p, i) => {
        queue.push({ photo: p, i, s: 'pending', p: null });
    });

    $('gallery-grid').innerHTML = '';
    $('gallery').classList.remove('visible');
    $('stop-btn').classList.add('visible');
    $('go-btn').disabled = true;

    await wakeLock();
    renderQueue();

    for (let i = 0; i < queue.length; i++) {
        if (state.stop) break;
        processOne(queue[i]);
        if (i < queue.length - 1 && !state.stop) {
            const w = Math.ceil(CREATE_INTERVAL_MS / 1000);
            for (let r = w; r > 0; r--) {
                if (state.stop) break;
                setStatus('Préparation photo ' + (i + 2) + '/' + queue.length + ' — ' + r + 's');
                await sleep(1000);
            }
        }
    }

    while (queue.some(q => q.s === 'creating' || q.s === 'processing') && !state.stop) {
        await sleep(1000);
    }

    setStatus('✨ ' + state.completed + '/' + queue.length + ' photo' + (queue.length > 1 ? 's' : '') + ' animée' + (state.completed > 1 ? 's' : ''));
    await sleep(3500);
    setStatus(null);

    state.running = false;
    state.stop = false;
    $('stop-btn').classList.remove('visible');
    updateGo();

    if (state.completed > 0) toast(state.completed + ' vidéo' + (state.completed > 1 ? 's' : '') + ' ✓', 'success');
}

function stopAll() {
    if (!state.running) return;
    state.stop = true;
    setStatus('Arrêt…');
}

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
(function init() {
    $('api-btn').addEventListener('click', saveKey);
    $('api-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); saveKey(); }
    });
    $('go-btn').addEventListener('click', start);
    $('stop-btn').addEventListener('click', stopAll);

    const up = $('upload'), fi = $('file-input');
    up.addEventListener('click', () => fi.click());
    fi.addEventListener('change', e => {
        addFiles(e.target.files);
        fi.value = '';
    });

    refresh();
    renderPhotos();
    renderAmbiances();
    updateGo();
})();
</script>
