<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Roman Studio · Romans illustrés & BD animées</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e0c0a; --bg2:#16130f; --panel:#1a1712; --panel2:#211d16;
  --border:#2e2820; --border2:#3a3428;
  --ink:#e6dcc6; --dim:#9a9080; --faint:#5a5448;
  --gold:#d4a94a; --gold2:#f0d78a; --gold3:#8a6f2e;
  --crimson:#c84a5a; --crimson2:#e07a8a;
  --sage:#7a9a6a; --sage2:#a8c898;
  --blue:#5a7aa8; --blue2:#88a8d4;
  --ok:#6a9a5a; --err:#b84a4a; --warn:#d4984a;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:Rajdhani,system-ui,sans-serif;
  --mono:'Share Tech Mono',ui-monospace,monospace;
}
html,body{background:var(--bg);color:var(--ink);min-height:100vh}
body{
  font:15px/1.6 var(--sans);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(212,169,74,.05) 0%, transparent 45%),
    radial-gradient(circle at 85% 100%, rgba(200,74,90,.04) 0%, transparent 45%);
  background-attachment:fixed;
  padding:0 0 6rem;
}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(14,12,10,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:.9rem 1.2rem;
  display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;
}
.logo{
  font:700 1.15rem var(--serif);letter-spacing:.08em;
  display:flex;flex-direction:column;line-height:1.1;
}
.logo b{color:var(--gold)}
.logo i{
  font:9px var(--mono);letter-spacing:.3em;color:var(--dim);
  font-style:normal;text-transform:uppercase;margin-top:2px;
}
.hb{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

main{max-width:1120px;margin:0 auto;padding:1.5rem 1rem}

/* Sections / Panels */
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:4px;
  padding:1.2rem 1.3rem;margin-bottom:1rem;position:relative;
  transition:border-color .2s;
}
.panel.ok{border-color:rgba(106,154,90,.4);box-shadow:inset 3px 0 0 var(--ok)}
.panel.warn{border-color:rgba(212,152,74,.4)}
.panel.bd{border-left:3px solid var(--crimson)}
.panel.roman{border-left:3px solid var(--gold)}
.label{
  display:block;font:600 10px var(--mono);letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.5rem;
}
.label b{color:var(--gold);margin-right:.4rem}

h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.02em}
h2{font-size:1.65rem;margin:.3rem 0 .5rem;line-height:1.15}
h2 b{color:var(--gold);font-weight:700}
h3{font-size:1.05rem;margin:1rem 0 .3rem;color:var(--gold2)}
p.sub{color:var(--dim);margin-bottom:.8rem;font-size:14px;max-width:800px}

/* Inputs */
textarea,input[type=text],input[type=password],select{
  width:100%;padding:.75rem .9rem;
  border:1px solid var(--border);border-radius:3px;
  background:var(--bg2);color:var(--ink);
  font:14px var(--sans);outline:none;transition:border-color .15s;
  font-family:inherit;
}
textarea{
  font-family:var(--serif);font-size:15px;line-height:1.6;
  min-height:90px;resize:vertical;
}
textarea:focus,input:focus,select:focus{border-color:var(--gold);background:var(--bg)}
label.f{display:block;margin:.6rem 0}
label.f>span{display:block;margin-bottom:.3rem}

/* Buttons */
button,.btn{
  font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;
  padding:.7rem 1.1rem;border:1px solid var(--border2);border-radius:3px;
  background:transparent;color:var(--ink);cursor:pointer;
  transition:all .15s;font-family:var(--mono);
  display:inline-flex;align-items:center;gap:.4rem;
}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold2);background:rgba(212,169,74,.05)}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{
  background:linear-gradient(135deg,rgba(212,169,74,.22),rgba(212,169,74,.08));
  border-color:var(--gold);color:var(--gold2);
  font-family:var(--serif);font-size:14px;letter-spacing:.14em;
  padding:.85rem 1.4rem;font-weight:600;
}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,rgba(212,169,74,.35),rgba(212,169,74,.15))}
.btn-bd{
  background:linear-gradient(135deg,rgba(200,74,90,.22),rgba(200,74,90,.08));
  border-color:var(--crimson);color:var(--crimson2);
}
.btn-bd:hover:not(:disabled){background:linear-gradient(135deg,rgba(200,74,90,.35),rgba(200,74,90,.15))}
.btn-danger{border-color:var(--err);color:var(--err)}
.btn-danger:hover:not(:disabled){background:rgba(184,74,74,.1)}
.btn-sm{padding:.4rem .7rem;font-size:10px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1rem}

/* Chips */
.chip{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.25rem .6rem;border:1px solid var(--border);border-radius:20px;
  font:11px var(--mono);color:var(--dim);letter-spacing:.05em;
}
.chip.ok{border-color:var(--sage);color:var(--sage2)}
.chip.err{border-color:var(--err);color:var(--err)}
.chip.dot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}

/* Drawer grid */
.drawers{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:720px){.drawers{grid-template-columns:1fr}}
.drawer-group{
  background:var(--panel);border:1px solid var(--border);border-radius:4px;
  padding:1.2rem;
}
.drawer-group h3{margin:0 0 1rem;font-size:1.1rem;letter-spacing:.06em}
.drawer-group.roman h3{color:var(--gold)}
.drawer-group.bd h3{color:var(--crimson2)}
.dg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.dg-item{
  padding:.85rem .8rem;border:1px solid var(--border);border-radius:3px;
  cursor:pointer;transition:all .15s;background:var(--bg2);
  position:relative;
}
.dg-item:hover{border-color:var(--gold);background:var(--panel2);transform:translateY(-1px)}
.dg-item.active{
  border-color:var(--gold);
  background:linear-gradient(135deg,rgba(212,169,74,.12),rgba(212,169,74,.02));
}
.drawer-group.bd .dg-item.active{
  border-color:var(--crimson);
  background:linear-gradient(135deg,rgba(200,74,90,.12),rgba(200,74,90,.02));
}
.dg-item .emoji{font-size:1.5rem;display:block;margin-bottom:.3rem}
.dg-item .nm{font:600 13px var(--sans);color:var(--ink);line-height:1.2;margin-bottom:.2rem}
.dg-item .stt{
  font:10px var(--mono);color:var(--faint);
  text-transform:uppercase;letter-spacing:.08em;
}
.dg-item.active .stt{color:var(--gold2)}
.drawer-group.bd .dg-item.active .stt{color:var(--crimson2)}

/* Grid cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.9rem;margin-top:.8rem}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:3px;
  overflow:hidden;transition:border-color .2s;
}
.card.done{border-color:rgba(122,154,106,.5)}
.card.busy{border-color:var(--gold)}
.card.err{border-color:var(--err)}
.card-img{
  width:100%;background:#000;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:.7rem .8rem}

/* Placeholder shimmer */
.placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:.5rem;color:var(--faint);font:11px var(--mono);
  text-align:center;padding:.8rem;
}
.placeholder::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(212,169,74,.08) 50%,transparent 70%);
  animation:shimmer 2s linear infinite;
}
.spinner{
  width:20px;height:20px;border:2px solid rgba(212,169,74,.2);
  border-top-color:var(--gold);border-radius:50%;
  animation:spin .8s linear infinite;z-index:2;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* Chapter/Page */
.chapter{
  background:var(--bg2);border:1px solid var(--border);border-radius:3px;
  margin-bottom:1rem;overflow:hidden;
}
.chapter-head{
  padding:.8rem 1rem;border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,rgba(212,169,74,.05),transparent);
  display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;
}
.chapter-num{font:600 10px var(--mono);letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.chapter-title{font-family:var(--serif);font-size:1.05rem;color:var(--ink);flex:1;line-height:1.3}
.chapter-status{font:10px var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.chapter-body{padding:1rem 1.1rem}
.narrative{
  font-family:var(--serif);font-size:15px;line-height:1.75;color:var(--ink);
  white-space:pre-wrap;margin-bottom:.8rem;
  padding:.8rem 1rem;background:rgba(0,0,0,.2);
  border-left:2px solid var(--gold);
}
.dialogue{
  font-family:var(--serif);font-size:14px;font-style:italic;
  padding:.6rem .9rem;margin:.5rem 0 1rem;
  border-left:2px solid var(--crimson);
  background:rgba(200,74,90,.04);
}
.dialogue b{font-style:normal;color:var(--crimson2);font-family:var(--sans);font-weight:600}

/* BD case with bubble */
.bd-case{
  position:relative;background:#000;border:2px solid var(--ink);
  border-radius:2px;overflow:hidden;margin-bottom:.5rem;
}
.bd-case img{display:block;width:100%;height:auto}
.bubble{
  position:absolute;background:#fff;border:2px solid #000;
  padding:5px 9px;font:600 12px var(--sans);color:#000;
  max-width:42%;box-shadow:2px 2px 0 rgba(0,0,0,.85);
  line-height:1.2;z-index:3;border-radius:8px;
}
.bubble .who{
  display:block;font:700 9px var(--mono);letter-spacing:.06em;
  text-transform:uppercase;color:#c84a5a;margin-bottom:2px;
}
.bubble::after{
  content:'';position:absolute;bottom:-10px;left:14px;
  width:0;height:0;border-left:7px solid transparent;
  border-right:7px solid transparent;border-top:9px solid #000;
}
.bubble.br::after{left:auto;right:14px}
.bd-meta{
  padding:.4rem .6rem;background:rgba(0,0,0,.3);
  font:10px var(--mono);color:var(--dim);
  display:flex;justify-content:space-between;
}

/* Log */
#console{
  position:fixed;left:0;right:0;bottom:0;height:38vh;
  background:#050504;color:#c9c0a8;
  border-top:1px solid var(--border);
  z-index:50;transform:translateY(100%);
  transition:transform .3s ease;display:flex;flex-direction:column;
}
#console.on{transform:none}
#console-head{
  padding:.4rem .8rem;border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,#0a0908,#16130f);
  display:flex;justify-content:space-between;align-items:center;
  font:10px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--gold);
}
#log{
  flex:1;overflow-y:auto;padding:.5rem .8rem;
  font:11px/1.5 var(--mono);
}
.lg{padding:.1rem 0}
.lg.ok{color:#8ac89a}
.lg.er{color:#e08a8a}
.lg.wr{color:#e0c88a}
.lg.in{color:#c9c0a8}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);
  z-index:90;display:flex;flex-direction:column;gap:.4rem;align-items:center;
  pointer-events:none;
}
#toast>div{
  background:var(--ink);color:var(--bg);
  font:600 12px var(--sans);padding:.6rem 1rem;border-radius:3px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  animation:toastIn .3s ease;
  max-width:90vw;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Player */
#player{
  position:fixed;inset:0;background:#000;z-index:100;
  display:none;align-items:center;justify-content:center;flex-direction:column;
}
#player.on{display:flex}
#player img{max-width:100vw;max-height:100vh;object-fit:contain}
#player .close{
  position:absolute;top:1rem;right:1rem;
  background:rgba(255,255,255,.15);color:#fff;
  border-color:rgba(255,255,255,.3);
}
#player .caption{
  position:absolute;left:5%;right:5%;bottom:6%;
  text-align:center;color:#fff;
  font:600 20px/1.4 var(--serif);
  text-shadow:0 2px 12px #000;
  background:linear-gradient(transparent,rgba(0,0,0,.7),transparent);
  padding:1rem;border-radius:8px;
}
#player .caption b{color:var(--gold2)}
#player .caption small{display:block;font:400 14px var(--sans);opacity:.85;margin-top:.4rem}

/* Modal */
#modal{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  z-index:70;display:none;align-items:center;justify-content:center;padding:1rem;
}
#modal.on{display:flex}
#modal-inner{
  background:var(--panel);border:1px solid var(--border);
  max-width:720px;width:100%;max-height:85vh;overflow-y:auto;
  padding:1.5rem;border-radius:4px;
}

/* Guide boxes */
.guide{
  display:flex;gap:.7rem;align-items:flex-start;
  border:1px solid var(--border);border-left:3px solid var(--blue);
  background:rgba(90,122,168,.05);
  padding:.8rem 1rem;margin:.8rem 0;border-radius:2px;
  font-size:13px;line-height:1.5;
}
.guide.ok{border-left-color:var(--ok);background:rgba(106,154,90,.06)}
.guide.err{border-left-color:var(--err);background:rgba(184,74,74,.06)}
.guide.warn{border-left-color:var(--warn);background:rgba(212,152,74,.06)}
.guide b{color:var(--ink);font-weight:600}

/* Footer actions */
.actions{
  display:flex;justify-content:space-between;align-items:center;
  gap:.8rem;flex-wrap:wrap;margin-top:1.2rem;
  padding-top:1rem;border-top:1px solid var(--border);
}

/* Progress bar */
.progress{
  height:3px;background:var(--border);border-radius:2px;
  overflow:hidden;margin:.6rem 0;
}
.progress i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  transition:width .3s ease;
}

/* Responsive */
@media(max-width:600px){
  main{padding:1rem .6rem}
  .panel{padding:1rem .9rem}
  h2{font-size:1.4rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
  .dg-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.5rem}
  .dg-item{padding:.7rem .6rem}
  .bubble{font-size:11px;padding:4px 7px;max-width:50%}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span>Roman<b>·</b>Studio</span>
    <i>Romans illustrés & BD animées</i>
  </div>
  <div class="hb">
    <span class="chip dot" id="key-chip">Aucune clé</span>
    <button class="btn-sm" data-a="modal">Mes projets</button>
    <button class="btn-sm" data-a="console">Journal</button>
  </div>
</header>

<main id="main"></main>

<div id="console">
  <div id="console-head">
    <span>◆ Journal technique</span>
    <div style="display:flex;gap:.3rem">
      <button class="btn-sm" data-a="clear-log">Effacer</button>
      <button class="btn-sm" data-a="console">✕</button>
    </div>
  </div>
  <div id="log"></div>
</div>

<div id="toast"></div>
<div id="player"><img id="player-img" alt=""><div class="caption" id="player-cap"></div><button class="btn-sm close" data-a="stop-play">✕ Quitter</button></div>
<div id="modal"><div id="modal-inner"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════ */
const API = 'https://apihub.agnes-ai.com/v1';
const MODEL_TXT = 'agnes-2.5-flash';
const MODEL_IMG = 'agnes-image-2.5-flash';
const KEY_STORAGE = 'rs3_key';
const PROJECT_PREFIX = 'rs3_project_';
const PROJECT_VERSION = 3;

// Ratios pixels validés par Agnès
const SIZES = {
  portrait: '1024x1792',   // 9:16 vertical
  landscape: '1792x1024',  // 16:9 horizontal
  square: '1024x1024'      // 1:1
};

// ═══════════════════════════════════════════════════════════════
   GENRES
   ═══════════════════════════════════════════════════════════════ */
const GENRES_ROMAN = [
  {id:'fantasy',   emoji:'🐉', name:'Fantasy',        style:'cinematic high fantasy, painterly oil-painting aesthetic, golden light, epic scale', palette:'deep emerald, gold, aged parchment, stormy sky'},
  {id:'sf',        emoji:'🚀', name:'Science-Fiction',style:'cinematic sci-fi, photorealistic concept art, vast futuristic scale, cold clean light', palette:'electric blue, chrome silver, deep space black, cyan'},
  {id:'polar',     emoji:'🔍', name:'Polar',          style:'noir crime photography, dramatic chiaroscuro, rain-soaked streets, moody atmosphere', palette:'charcoal grey, blood red, sodium amber, cold blue'},
  {id:'romance',   emoji:'🌹', name:'Romance',        style:'soft cinematic photography, warm bokeh, golden hour light, tender tones', palette:'dusty rose, warm cream, lavender, pale gold'},
  {id:'historique',emoji:'📜', name:'Historique',     style:'period drama cinematography, authentic costumes, candlelight, painterly realism', palette:'sepia, faded gold, oxblood leather, aged ivory'},
  {id:'aventure',  emoji:'🗺️', name:'Aventure',       style:'pulp adventure cinema, exotic locales, saturated colors, dramatic vistas', palette:'jungle green, saffron orange, sun-bleached bone, turquoise'}
];

const GENRES_BD = [
  {id:'shonen',   emoji:'⚔️', name:'Shonen',         style:'japanese shonen manga, dynamic lines, cel shading, ink outlines, energetic action poses', palette:'bright saturated colors, ink black outlines'},
  {id:'shojo',    emoji:'🌸', name:'Shojo',          style:'japanese shojo manga, delicate line art, soft watercolor washes, expressive large eyes, sparkling details', palette:'pastel pink, lavender, mint, cream'},
  {id:'seinen',   emoji:'🗡️', name:'Seinen',         style:'japanese seinen manga, realistic anatomies, detailed backgrounds, mature dark tone, precise ink work', palette:'muted earth tones, deep blacks, desaturated'},
  {id:'comics',   emoji:'🦸', name:'Comics US',      style:'american superhero comics, bold ink outlines, flat saturated colors, dynamic angles, halftone dots', palette:'primary red/blue/yellow, ink black'},
  {id:'franco',   emoji:'📔', name:'Franco-belge',   style:'franco-belgian bande dessinée, ligne claire, clean uniform lines, flat vivid colors', palette:'flat primaries, warm secondaries'},
  {id:'webtoon',  emoji:'📱', name:'Webtoon',        style:'korean webtoon manhwa, clean digital line art, soft cel shading, glossy highlights', palette:'pastel gradients, muted jewel tones'}
];

const IDEA_CHIPS = {
  fantasy:   ['Un roi qui ne peut plus mentir depuis un sort mal lancé.','Deux enfants gardent la dernière forêt magique.','Un château dont les couloirs changent chaque nuit.'],
  sf:        ['Un androïde qui rêve de la mer.','Le dernier humain dans une bibliothèque orbitale.','Une IA qui tombe amoureuse de son opérateur.'],
  polar:     ['Un flic qui ne dort plus à cause d\'une affaire non résolue.','Une lettre anonyme arrive 30 ans trop tard.','Une disparition dans un village silencieux.'],
  romance:   ['Deux inconnus se croisent au même banc chaque matin.','Elle écrit des lettres qu\'elle n\'envoie jamais.','Un amour qui reprend vingt ans après.'],
  historique:['Le carnet oublié d\'un soldat de 1916.','Une apothicaire au temps de la peste.','La dernière librairie avant la guerre.'],
  aventure:  ['Une carte incomplète vers une cité perdue.','Trois explorateurs et un désert qui n\'existe sur aucune carte.','Un équipage cherche une île qui se déplace.'],
  shonen:    ['Un jeune garçon découvre un pouvoir interdit.','Un tournoi entre les meilleurs combattants du monde.','Un élève dépasse son maître dans une école de sabre.'],
  shojo:     ['Une lycéenne découvre que son correspondant secret est son voisin.','Un club de manga réunit des destins croisés.','Une rencontre sous les cerisiers change tout.'],
  seinen:    ['Un tueur à gages veut raccrocher, mais on ne le laisse pas.','Une enquête dans un Tokyo pluvieux.','Un ancien samouraï devenu garde du corps.'],
  comics:    ['Un super-héros refuse de sauver le monde une dernière fois.','Le méchant gagne. Le monde s\'adapte.','Un vigilante masqué dans une ville corrompue.'],
  franco:    ['Un détective et son chien dans les années 1950.','Un journaliste découvre un scandale d\'État.','Un jeune roi capricieux et son conseiller loyal.'],
  webtoon:   ['Une idol qui cache un secret.','Un étudiant timide est en réalité un génie.','Une tueuse professionnelle tombe amoureuse de sa cible.']
};

// ═══════════════════════════════════════════════════════════════
   UTILS
   ═══════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const san = t => String(t == null ? '' : t)
  .replace(/[‘’]/g, "'").replace(/[“”«»]/g, '"')
  .replace(/[–—]/g, '-').replace(/…/g, '...')
  .replace(/[\u00a0\u202f]/g, ' ');

function log(level, msg) {
  const el = $('#log');

  const d = document.createElement('div');
  d.className = 'lg ' + level;

  el.appendChild(d);

}

// ═══════════════════════════════════════════════════════════════
   JSON PARSER ROBUSTE
   ═══════════════════════════════════════════════════════════════ */
function parseJSON(text) {
  if (!text) return null;
  let c = String(text).replace(/```json|```/g, '');
  const a = c.indexOf('{'), b = c.lastIndexOf('}');
  if (a < 0 || b < 0) return null;
  c = c.slice(a, b + 1);
  try { return JSON.parse(c); } catch(e) {}
  // Fix newlines dans chaînes
  let o = '', inStr = false, escape = false;
  for (let i = 0; i < c.length; i++) {
    const ch = c[i];
    if (escape) { o += ch; escape = false; continue; }
    if (ch === '\\') { o += ch; escape = true; continue; }
    if (ch === '"') { inStr = !inStr; o += ch; continue; }
    if (inStr && ch === '\n') { o += '\\n'; continue; }
    if (inStr && ch === '\r') continue;
    if (inStr && ch.charCodeAt(0) < 32) { o += ' '; continue; }
    o += ch;
  }
  try { return JSON.parse(o.replace(/,\s*([}\]])/g, '$1')); } catch(e) { return null; }
}

// ═══════════════════════════════════════════════════════════════
   API CALLS
   ═══════════════════════════════════════════════════════════════ */
async function apiCall(endpoint, body, retries = 3) {
  if (!state.apiKey) throw new Error('Clé API manquante');
  for (let i = 0; i < retries; i++) {
    if (state.stop) throw new Error('stop');
    try {
      log('in', '→ POST ' + endpoint);
      const r = await fetch(API + endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + state.apiKey
        },
        body: JSON.stringify(body)
      });
      if (r.ok) {
        log('ok', '← HTTP ' + r.status);
        return r;
      }
      const txt = await r.text().catch(() => '');
      log('er', '← HTTP ' + r.status + ' : ' + txt.slice(0, 200));
      if (r.status === 429) {
        const wait = parseInt(r.headers.get('Retry-After') || '20');
        log('wr', 'Rate limit — attente ' + wait + 's');
        await sleep(wait * 1000);
        continue;
      }
      if ([401, 402, 403].includes(r.status)) {
        throw new Error('Clé API invalide ou expirée (HTTP ' + r.status + ')');
      }
      if (r.status >= 500 || r.status === 408) {
        log('wr', 'Erreur serveur — retry dans ' + (2 * (i + 1)) + 's');
        await sleep(2000 * (i + 1));
        continue;
      }
      throw new Error('HTTP ' + r.status + ' : ' + txt.slice(0, 200));
    } catch (e) {
      if (e.message === 'stop' || e.message.includes('Clé API')) throw e;
      if (i === retries - 1) throw e;
      log('wr', 'Retry : ' + e.message);
      await sleep(1500 * (i + 1));
    }
  }
  throw new Error('Échec après plusieurs tentatives');
}

async function callChat(system, user, maxTokens = 4000, temp = 0.8) {
  const r = await apiCall('/chat/completions', {
    model: MODEL_TXT,
    messages: [
      { role: 'system', content: san(system) },
      { role: 'user', content: san(user) }
    ],
    temperature: temp,
    max_tokens: maxTokens,
    chat_template_kwargs: { enable_thinking: false }
  });
  const data = await r.json();
  const txt = data?.choices?.[0]?.message?.content;
  if (!txt) throw new Error('Réponse texte vide');
  return txt;
}

async function callImage(prompt, options = {}) {
  const { size = SIZES.portrait, refs = [], label = '' } = options;
  
  // Rate limit : 6s entre images (10 img/min Agnès)
  const now = Date.now();
  const wait = Math.max(0, 6000 - (now - state.lastImageCall));
  if (wait > 0) await sleep(wait);
  state.lastImageCall = Date.now();
  
  // Body SANS références
  const buildBody = (withRefs) => {
    const body = {
      model: MODEL_IMG,
      prompt: san(prompt),
      n: 1,
      size: size,
      response_format: 'url'
    };
    if (withRefs && refs.length) {
      body.extra_body = { image: refs.slice(0, 4) };
    }
    return body;
  };
  
  log('in', '🎨 Image ' + (label || '') + ' (' + size + ')' + (refs.length ? ' +' + refs.length + ' ref' : ''));
  
  let r;
  try {
    r = await apiCall('/images/generations', buildBody(refs.length > 0));
  } catch (e) {
    // Fallback : si l'API refuse les références, on retente sans
    if (refs.length > 0) {
      log('wr', 'Échec avec références, tentative sans…');
      r = await apiCall('/images/generations', buildBody(false));
    } else {
      throw e;
    }
  }
  
  const data = await r.json();
  const item = data?.data?.[0];
  if (!item) throw new Error('Réponse sans image');
  const url = item.url || (item.b64_json ? 'data:image/png;base64,' + item.b64_json : null);
  if (!url) throw new Error('Format image inconnu');
  log('ok', '🎨 Image générée');
  return { u: url, d: url.startsWith('data:') ? url : null };
}

// Convertit une URL en data URI (pour références)
async function toDataURI(url) {
  if (!url) return null;
  if (url.startsWith('data:')) return url;
  try {
    const r = await fetch(url);
    const blob = await r.blob();
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
  } catch (e) {
    log('wr', 'Conversion dataURI échouée : ' + e.message);
    return null;
  }
}

// ═══════════════════════════════════════════════════════════════
   STORAGE — Projets (par genre)
   ═══════════════════════════════════════════════════════════════ */
function storageKey(mode, genreId) {
  return PROJECT_PREFIX + mode + '_' + genreId;
}
function saveProject() {
  if (!state.project) return;
  state.project.updated = Date.now();
  try {
    localStorage.setItem(storageKey(state.project.mode, state.project.genreId), JSON.stringify(state.project));
  } catch (e) { log('er', 'Sauvegarde : ' + e.message); }
}
function loadProject(mode, genreId) {
  try {
    const raw = localStorage.getItem(storageKey(mode, genreId));
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (p.version !== PROJECT_VERSION) {
      log('wr', 'Version de projet obsolète — réinitialisé');
      return null;
    }
    return p;
  } catch (e) { return null; }
}
function newProject(mode, genreId) {
  return {
    version: PROJECT_VERSION,
    mode: mode,
    genreId: genreId,
    idea: '',
    title: '',
    logline: '',
    universe: '',
    protagonists: [],
    chapters: [],  // ou pages si mode bd
    createdAt: Date.now(),
    updated: Date.now()
  };
}
function listProjects() {
  const out = [];
  ['roman', 'bd'].forEach(mode => {
    const genres = mode === 'bd' ? GENRES_BD : GENRES_ROMAN;
    genres.forEach(g => {
      const p = loadProject(mode, g.id);
      if (p) out.push(p);
    });
  });
  return out.sort((a, b) => b.updated - a.updated);
}
function deleteProject(mode, genreId) {
  try { localStorage.removeItem(storageKey(mode, genreId)); } catch (e) {}
}
function genreOf(p) {
  const list = p.mode === 'bd' ? GENRES_BD : GENRES_ROMAN;
  return list.find(g => g.id === p.genreId) || list[0];
}

async function generatePlan() {
  const p = state.project;
  if (!p.idea || p.idea.trim().length < 10) throw new Error('Idée trop courte');
  const genre = genreOf(p);
  log('in', '📋 Génération du plan…');
  toast('Plan en cours…');
  
  const raw = await callChat(
    'Tu es scénariste. Réponds UNIQUEMENT en JSON valide strict, sans texte autour.',
    buildPlanPrompt(p.idea, genre, p.mode),
    6000, 0.8
  );
  const plan = parseJSON(raw);
  if (!plan || !plan.protagonists || !plan.protagonists.length) {
    throw new Error('Plan invalide');
  }
  
  p.title = plan.title || 'Sans titre';
  p.logline = plan.logline || '';
  p.universe = plan.universe || '';
  p.protagonists = plan.protagonists.slice(0, 4).map(pt => ({
    id: pt.id || uid(),
    name: pt.name || '?',
    role: pt.role || 'protagoniste',
    personality: pt.personality || '',
    appearance: pt.appearance || { face:'', hair:'', eyes:'', build:'', outfit:'', accessories:'', signature_colors:[] },
    sheet: null,
    sheetStatus: 'pending'
  }));
  
  const chapters = (plan.chapters || []).slice(0, 4);
  p.chapters = chapters.map((c, i) => ({
    id: uid(),
    number: c.number || (i + 1),
    title: c.title || '',
    summary: c.summary || '',
    key_emotional_beat: c.key_emotional_beat || '',
    narrative: '',
    dialogue: [],
    illustrations: [],  // ou cases si BD
    status: 'pending'
  }));
  
  saveProject();
  log('ok', '✦ Plan prêt : ' + p.title + ' · ' + p.protagonists.length + ' persos · ' + p.chapters.length + (p.mode === 'bd' ? ' planches' : ' chapitres'));
}

async function generateCharacterSheets() {
  const p = state.project;
  const genre = genreOf(p);
  for (let i = 0; i < p.protagonists.length; i++) {
    if (state.stop) break;
    const pr = p.protagonists[i];
    if (pr.sheet && pr.sheet.u) continue;
    pr.sheetStatus = 'generating';
    renderMain();
    try {
      log('in', '🎭 Character sheet ' + pr.name + '…');
      const img = await callImage(buildSheetPrompt(pr, genre, p.mode), {
        size: SIZES.landscape,
        label: 'sheet ' + pr.name
      });
      pr.sheet = img;
      pr.sheetStatus = 'done';
      log('ok', '✓ Character sheet ' + pr.name);
    } catch (e) {
      if (e.message === 'stop') break;
      pr.sheetStatus = 'error';
      log('er', 'Character sheet ' + pr.name + ' : ' + e.message);
    }
    saveProject();
    renderMain();
  }
}

async function generateChapters() {
  const p = state.project;
  const genre = genreOf(p);
  const listKey = p.mode === 'bd' ? 'cases' : 'illustrations';
  for (let ci = 0; ci < p.chapters.length; ci++) {
    if (state.stop) break;
    const ch = p.chapters[ci];
    if (ch.status === 'done' && (ch[listKey] || []).length) continue;
    ch.status = 'writing';
    renderMain();
    try {
      log('in', (p.mode === 'bd' ? '📄 Planche ' : '📖 Chapitre ') + (ci + 1) + '…');
      const raw = await callChat(
        'Tu es scénariste. Réponds UNIQUEMENT en JSON valide strict.',
        buildChapterPrompt(p, ch, ci + 1, p.chapters.slice(0, ci), genre),
        4000, 0.8
      );
      const data = parseJSON(raw);
      if (!data) throw new Error('JSON invalide');
      
      if (p.mode === 'bd') {
        if (!Array.isArray(data.cases)) throw new Error('Pas de cases');
        ch.cases = data.cases.slice(0, 4).map((c, ii) => ({
          id: uid(),
          index: c.index || (ii + 1),
          framing: c.framing || 'medium',
          action: c.action || '',
          characters_present: Array.isArray(c.characters_present) ? c.characters_present : [],
          dialogue: Array.isArray(c.dialogue) ? c.dialogue : [],
          prompt: c.prompt || '',
          image: null,
          status: 'pending'
        }));
      } else {
        if (!data.narrative) throw new Error('Pas de narrative');
        ch.narrative = data.narrative;
        ch.dialogue = Array.isArray(data.dialogue) ? data.dialogue : [];
        ch.illustrations = (data.illustrations || []).slice(0, 3).map((ill, ii) => ({
          id: uid(),
          index: ii,
          prompt: ill.prompt || '',
          characters_present: Array.isArray(ill.characters_present) ? ill.characters_present : [],
          image: null,
          status: 'pending'
        }));
      }
      ch.status = 'done';
      log('ok', '✓ ' + (p.mode === 'bd' ? 'Planche' : 'Chapitre') + ' ' + (ci + 1) + ' écrit');
    } catch (e) {
      if (e.message === 'stop') break;
      ch.status = 'error';
      log('er', 'Chapitre ' + (ci + 1) + ' : ' + e.message);
    }
    saveProject();
    renderMain();
  }
}

async function generateIllustrations() {
  const p = state.project;
  const genre = genreOf(p);
  const listKey = p.mode === 'bd' ? 'cases' : 'illustrations';
  
  // Convertit les character sheets en data URI (une fois)
  const refs = {};
  for (const pr of p.protagonists) {
    if (pr.sheet && pr.sheet.u) {
      refs[pr.id] = pr.sheet.d || await toDataURI(pr.sheet.u);
    }
  }
  
  for (const ch of p.chapters) {
    const items = ch[listKey] || [];
    for (const item of items) {
      if (state.stop) return;
      if (item.image && item.image.u) continue;
      item.status = 'loading';
      renderMain();
      try {
        // Refs : personnages présents (ordre), scène en dernier si BD
        const itemRefs = [];
        (item.characters_present || []).forEach(id => {
          if (refs[id]) itemRefs.push(refs[id]);
        });
        
        const prompt = buildIllustrationPrompt(item, ch, p, genre);
        const size = p.mode === 'bd' ? SIZES.square : SIZES.portrait;
        
        log('in', '🎨 ' + (p.mode === 'bd' ? 'Case' : 'Illustration') + ' ' + ch.number + '.' + (item.index + 1) + '…');
        const img = await callImage(prompt, { size, refs: itemRefs, label: ch.number + '.' + (item.index + 1) });
        item.image = img;
        item.status = 'done';
        log('ok', '✓ Image ' + ch.number + '.' + (item.index + 1) + ' (' + itemRefs.length + ' refs)');
      } catch (e) {
        if (e.message === 'stop') return;
        item.status = 'error';
        item.error = e.message;
        log('er', 'Image ' + ch.number + '.' + (item.index + 1) + ' : ' + e.message);
      }
      saveProject();
      renderMain();
    }
  }
}

async function runPipeline() {
  if (state.busy) return;
  if (!state.apiKey) { toast('Ajoutez votre clé API'); return; }
  const p = state.project;
  if (!p || !p.idea || p.idea.trim().length < 10) { toast('Décrivez votre idée (10 caractères min)'); return; }
  
  state.busy = true;
  state.stop = false;
  renderMain();
  
  try {
    log('in', '════════ Démarrage ' + (p.mode === 'bd' ? 'BD' : 'roman') + ' ════════');
    
    if (!p.protagonists.length) await generatePlan();
    else log('in', 'Plan déjà existant');
    
    await generateCharacterSheets();
    await generateChapters();
    await generateIllustrations();
    
    log('ok', '✦ Génération terminée ✦');
    toast('✦ Terminé !');
  } catch (e) {
    if (e.message === 'stop') { log('wr', 'Arrêté'); toast('Arrêté'); }
    else { log('er', 'Erreur : ' + e.message); toast('Erreur : ' + e.message.slice(0, 60)); }
  }
  
  state.busy = false;
  state.stop = false;
  saveProject();
  renderMain();
}

// ═══════════════════════════════════════════════════════════════
   PLAYER
   ═══════════════════════════════════════════════════════════════ */
function speak(text) {
  if (!state.voiceOn || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function stopSpeech() {
  try { speechSynthesis.cancel(); } catch (e) {}
}

async function playProject() {
  const p = state.project;
  if (!p || !p.chapters.length) return;
  const listKey = p.mode === 'bd' ? 'cases' : 'illustrations';
  const ready = p.chapters.filter(c => c.status === 'done' && (c[listKey] || []).some(x => x.image));
  if (!ready.length) { toast('Aucune image prête'); return; }
  
  state.playing = true;
  $('#player').classList.add('on');
  const img = $('#player-img');
  const cap = $('#player-cap');
  
  for (const ch of ready) {
    if (!state.playing) break;
    const items = (ch[listKey] || []).filter(x => x.image && x.image.u);
    
    if (p.mode === 'roman') {
      const text = (ch.narrative || '') + ' ' + (ch.dialogue || []).map(d => d.line).join('. ');
      speak(text);
      for (const ill of items) {
        if (!state.playing) break;
        img.src = ill.image.u;
        cap.innerHTML = '<b>Chapitre ' + ch.number + '</b> — ' + esc(ch.title) + 
          '<small>' + esc((ch.narrative || '').slice(0, 140)) + '…</small>';
        await sleep(Math.max(4000, Math.min(9000, (ch.narrative || '').split(/\s+/).length * 80 / Math.max(1, items.length))));
      }
    } else {
      for (const c of items) {
        if (!state.playing) break;
        img.src = c.image.u;
        const dialogue = (c.dialogue || []).map(d => d.speaker + ' dit : ' + d.line).join('. ');
        if (dialogue) speak(dialogue);
        cap.innerHTML = '<b>Planche ' + ch.number + '</b> — Case ' + c.index +
          (dialogue ? '<small>' + esc(dialogue) + '</small>' : '');
        await sleep(Math.max(3500, dialogue.length * 60 + 2000));
      }
    }
  }
  stopPlay();
}
function stopPlay() {
  state.playing = false;
  stopSpeech();
  $('#player').classList.remove('on');
  renderMain();
}

// ═══════════════════════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a;
  
  if (a === 'console') { $('#console').classList.toggle('on'); return; }
  if (a === 'clear-log') { $('#log').innerHTML = ''; return; }
  if (a === 'modal') { showModal(); return; }
  if (a === 'close-modal') { $('#modal').classList.remove('on'); return; }
  if (a === 'stop-play') { stopPlay(); return; }
  
  if (a === 'save-key') {
    const v = $('#api-input').value.trim();
    if (!v) { toast('Collez une clé'); return; }
    if (!v.startsWith('sk-') && !confirm('La clé ne commence pas par "sk-". Continuer ?')) return;
    state.apiKey = v;
    try { localStorage.setItem(KEY_STORAGE, v); } catch (e) {}
    toast('✓ Clé enregistrée');
    log('ok', 'Clé enregistrée');
    renderMain();
    return;
  }
  
  if (a === 'test-key') {
    if (!state.apiKey) { toast('Pas de clé'); return; }
    toast('Test en cours…');
    try {
      log('in', '🧪 Test de la clé API…');
      const img = await callImage('A single red apple on a wooden table, studio lighting, simple composition', {
        size: SIZES.square,
        label: 'test'
      });
      log('ok', '✓ Clé fonctionne — image générée');
      toast('✓ Clé valide !');
      // Affiche l'image test
      $('#player-img').src = img.u;
      $('#player-cap').innerHTML = '<b>Test réussi</b><small>La clé API fonctionne correctement.</small>';
      $('#player').classList.add('on');
      setTimeout(() => {
        if (!state.playing) $('#player').classList.remove('on');
      }, 3500);
    } catch (e) {
      log('er', 'Test échoué : ' + e.message);
      toast('✕ ' + e.message.slice(0, 60));
    }
    return;
  }
  
  if (a === 'open-drawer') {
    const mode = b.dataset.mode;
    const genreId = b.dataset.genre;
    let p = loadProject(mode, genreId);
    if (!p) {
      p = newProject(mode, genreId);
      log('in', 'Nouveau projet ' + mode + ' / ' + genreId);
    } else {
      log('in', 'Projet chargé ' + mode + ' / ' + genreId);
    }
    state.project = p;
    renderMain();
    return;
  }
  
  if (a === 'use-chip') {
    const text = b.dataset.text;
    if (state.project) {
      state.project.idea = text;
      saveProject();
      renderMain();
    }
    return;
  }
  
  if (a === 'run') { runPipeline(); return; }
  if (a === 'stop') { state.stop = true; toast('Arrêt en cours…'); return; }
  if (a === 'play') { playProject(); return; }
  
  if (a === 'delete-drawer') {
    if (!confirm('Vider complètement ce tiroir ?')) return;
    deleteProject(b.dataset.mode, b.dataset.genre);
    if (state.project && state.project.genreId === b.dataset.genre) state.project = null;
    toast('Tiroir vidé');
    renderMain();
    return;
  }
  
  if (a === 'load-project') {
    const mode = b.dataset.mode;
    const genreId = b.dataset.genre;
    const p = loadProject(mode, genreId);
    if (p) {
      state.project = p;
      $('#modal').classList.remove('on');
      renderMain();
      log('in', 'Projet rechargé : ' + (p.title || genreId));
    }
    return;
  }
  
  if (a === 'delete-from-modal') {
    if (!confirm('Supprimer ce projet ?')) return;
    deleteProject(b.dataset.mode, b.dataset.genre);
    if (state.project && state.project.genreId === b.dataset.genre) state.project = null;
    showModal();
    renderMain();
    return;
  }
});

      html += '<div style="font-family:var(--serif);font-size:1.1rem;color:var(--gold2)">' + g.emoji + ' ' + esc(p.title || g.name) + '</div>';
      html += '<div class="label" style="margin-top:4px">' + (p.mode === 'bd' ? 'BD' : 'Roman') + ' · ' + new Date(p.updated).toLocaleString('fr-FR') + '</div>';
      html += '<div style="font-size:12px;color:var(--dim);margin-top:4px">' + (p.protagonists?.length || 0) + ' persos · ' + imgs + ' ' + (p.mode === 'bd' ? 'planches' : 'chap') + ' · ' + total + ' images</div>';
      html += '</div>';
      html += '<div style="display:flex;gap:.3rem;flex-wrap:wrap">';
      html += '<button class="btn-sm" data-a="load-project" data-mode="' + p.mode + '" data-genre="' + p.genreId + '">Ouvrir</button>';
      html += '<button class="btn-sm btn-danger" data-a="delete-from-modal" data-mode="' + p.mode + '" data-genre="' + p.genreId + '">🗑</button>';
      html += '</div></div>';
      html += '</div></div>';
    });
  }
  
  $('#modal-inner').innerHTML = html;
  $('#modal').classList.add('on');
}

   INIT
   ═══════════════════════════════════════════════════════════════ */
(function init() {
  try {
    const k = localStorage.getItem(KEY_STORAGE);
    if (k) state.apiKey = k;
  } catch (e) {}
  
  renderMain();
  log('ok', 'Roman Studio V3 prêt');
  log('in', state.apiKey ? 'Clé API chargée' : 'Aucune clé API — collez-en une');
  log('in', '6 genres Roman + 6 genres BD');
  log('in', 'Character sheets 4 vues · Signature features · Ratio pixel-direct');
})();
</script>
