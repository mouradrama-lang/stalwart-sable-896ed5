<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roman Studio · Romans illustrés & BD animées</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f8f9fb;
  --bg2:#ffffff;
  --bg3:#f1f3f7;
  --ink:#0f1720;
  --ink2:#2a3441;
  --dim:#6b7280;
  --faint:#9ca3af;
  --line:#e5e7eb;
  --line2:#d1d5db;
  --gold:#b8860b;
  --gold2:#d4a017;
  --gold-bg:#fef9e7;
  --blue:#2563eb;
  --blue-bg:#eff6ff;
  --crimson:#dc2626;
  --crimson-bg:#fef2f2;
  --sage:#059669;
  --sage-bg:#f0fdf4;
  --amber:#d97706;
  --amber-bg:#fffbeb;
  --radius:8px;
  --radius2:12px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
  --shadow2:0 2px 8px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.06);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
html,body{background:var(--bg);color:var(--ink);min-height:100vh}
body{
  font:15px/1.6 var(--sans);
  padding:0 0 6rem;
  -webkit-font-smoothing:antialiased;
}

/* ═══ HEADER ═══ */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:.9rem 1.5rem;
  display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;
}
.logo{
  font-family:var(--serif);font-size:1.35rem;font-weight:700;
  letter-spacing:.02em;line-height:1.1;
  display:flex;flex-direction:column;
}
.logo b{color:var(--gold);font-weight:700}
.logo i{
  font:500 9.5px var(--sans);letter-spacing:.24em;color:var(--dim);
  font-style:normal;text-transform:uppercase;margin-top:3px;font-weight:600;
}
.hb{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

main{max-width:1120px;margin:0 auto;padding:1.5rem 1.2rem}

/* ═══ CARDS / PANELS ═══ */
.panel{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:var(--radius2);
  padding:1.4rem 1.5rem;
  margin-bottom:1rem;
  box-shadow:var(--shadow);
  transition:border-color .2s,box-shadow .2s;
}
.panel:hover{box-shadow:var(--shadow2)}
.panel.ok{border-color:rgba(5,150,105,.35);border-left:3px solid var(--sage)}
.panel.bd{border-left:3px solid var(--crimson)}
.panel.roman{border-left:3px solid var(--gold)}
.panel.dark{border-left:3px solid var(--ink)}

.label{
  display:block;font:600 10.5px var(--sans);
  letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);margin-bottom:.5rem;
}
.label b{color:var(--gold);margin-right:.35rem;font-weight:700}

h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;color:var(--ink)}
h2{font-size:1.7rem;margin:.3rem 0 .5rem;line-height:1.15}
h2 b{color:var(--gold);font-weight:700}
h3{font-size:1.15rem;margin:1rem 0 .4rem}
p.sub{color:var(--dim);margin-bottom:1rem;font-size:14px;max-width:780px;line-height:1.55}

/* ═══ INPUTS ═══ */
textarea,input[type=text],input[type=password],select{
  width:100%;padding:.8rem .95rem;
  border:1px solid var(--line2);border-radius:var(--radius);
  background:var(--bg2);color:var(--ink);
  font:14px var(--sans);outline:none;
  transition:border-color .15s,box-shadow .15s;
  font-family:inherit;
}
textarea{
  font-family:var(--serif);font-size:16px;line-height:1.6;
  min-height:100px;resize:vertical;
}
textarea:focus,input:focus,select:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(184,134,11,.1);
}
label.f{display:block;margin:.7rem 0}
label.f>span{display:block;margin-bottom:.35rem}

/* ═══ BUTTONS ═══ */
button,.btn{
  font:600 12px var(--sans);
  letter-spacing:.06em;
  padding:.75rem 1.2rem;
  border:1px solid var(--line2);
  border-radius:var(--radius);
  background:var(--bg2);color:var(--ink);
  cursor:pointer;
  transition:all .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--sans);
}
button:hover:not(:disabled){
  border-color:var(--ink);
  background:var(--bg3);
  transform:translateY(-1px);
}
button:active:not(:disabled){transform:translateY(0) scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed}

.btn-primary{
  background:var(--ink);color:#fff;border-color:var(--ink);
  font-size:14px;letter-spacing:.08em;
  padding:.9rem 1.6rem;
  box-shadow:0 2px 6px rgba(15,23,32,.15);
}
.btn-primary:hover:not(:disabled){
  background:#000;border-color:#000;
  box-shadow:0 4px 12px rgba(15,23,32,.25);
}
.btn-bd{
  background:var(--crimson);border-color:var(--crimson);color:#fff;
}
.btn-bd:hover:not(:disabled){
  background:#b91c1c;border-color:#b91c1c;
}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border-color:var(--gold);color:#fff;
}
.btn-gold:hover:not(:disabled){
  filter:brightness(1.05);
}
.btn-danger{
  border-color:var(--crimson);color:var(--crimson);
}
.btn-danger:hover:not(:disabled){
  background:var(--crimson-bg);
  border-color:var(--crimson);
  color:var(--crimson);
}
.btn-sm{padding:.45rem .8rem;font-size:11px;letter-spacing:.04em}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1rem}

/* ═══ CHIPS ═══ */
.chip{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.35rem .75rem;
  border:1px solid var(--line2);
  border-radius:20px;
  font:600 11px var(--sans);
  color:var(--ink2);
  letter-spacing:.02em;
  background:var(--bg2);
  transition:all .15s;
}
.chip.ok{border-color:var(--sage);color:var(--sage);background:var(--sage-bg)}
.chip.err{border-color:var(--crimson);color:var(--crimson);background:var(--crimson-bg)}
.chip.dot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.chip.clickable{cursor:pointer}
.chip.clickable:hover{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}

/* ═══ DRAWERS ═══ */
.drawers{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:760px){.drawers{grid-template-columns:1fr}}
.drawer-group{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:var(--radius2);
  padding:1.3rem;
  box-shadow:var(--shadow);
}
.drawer-group h3{
  margin:0 0 1rem;font-size:1.15rem;
  display:flex;align-items:center;gap:.5rem;
}
.drawer-group.roman h3{color:var(--gold)}
.drawer-group.bd h3{color:var(--crimson)}
.dg-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:.6rem;
}
.dg-item{
  padding:.9rem .8rem;
  border:1px solid var(--line2);
  border-radius:var(--radius);
  cursor:pointer;
  transition:all .15s;
  background:var(--bg2);
  position:relative;
  text-align:center;
}
.dg-item:hover{
  border-color:var(--gold);
  background:var(--gold-bg);
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}
.dg-item.active{
  border-color:var(--gold);
  background:linear-gradient(135deg,rgba(184,134,11,.08),rgba(212,160,23,.03));
  box-shadow:0 0 0 2px rgba(184,134,11,.2);
}
.drawer-group.bd .dg-item.active{
  border-color:var(--crimson);
  background:linear-gradient(135deg,rgba(220,38,38,.06),rgba(220,38,38,.02));
  box-shadow:0 0 0 2px rgba(220,38,38,.15);
}
.dg-item .emoji{font-size:1.7rem;display:block;margin-bottom:.35rem;line-height:1}
.dg-item .nm{font:600 13.5px var(--sans);color:var(--ink);line-height:1.2;margin-bottom:.15rem}
.dg-item .stt{
  font:500 10px var(--sans);color:var(--faint);
  text-transform:uppercase;letter-spacing:.06em;
}
.dg-item.active .stt{color:var(--gold);font-weight:600}
.drawer-group.bd .dg-item.active .stt{color:var(--crimson)}

/* ═══ GRID CARDS ═══ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:1rem;margin-top:1rem;
}
.card{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  transition:all .2s;
  box-shadow:var(--shadow);
}
.card:hover{box-shadow:var(--shadow2);transform:translateY(-2px)}
.card.done{border-color:rgba(5,150,105,.4)}
.card.busy{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,134,11,.15)}
.card.err{border-color:var(--crimson)}
.card-img{
  width:100%;background:var(--bg3);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:.8rem .9rem}

/* ═══ PLACEHOLDER ═══ */
.placeholder{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  gap:.5rem;color:var(--faint);
  font:500 11px var(--sans);text-align:center;padding:1rem;
  background:var(--bg3);
}
.placeholder.shimmer::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(184,134,11,.08) 50%,transparent 70%);
  animation:shimmer 2s linear infinite;
}
.spinner{
  width:22px;height:22px;border:2px solid rgba(184,134,11,.2);
  border-top-color:var(--gold);border-radius:50%;
  animation:spin .8s linear infinite;z-index:2;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ═══ CHAPTER / PAGE ═══ */
.chapter{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:var(--radius2);
  margin-bottom:1rem;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.chapter-head{
  padding:.9rem 1.1rem;
  border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(184,134,11,.04),transparent);
  display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;
}
.chapter-num{
  font:600 10.5px var(--sans);letter-spacing:.18em;
  color:var(--gold);text-transform:uppercase;
}
.chapter-title{font-family:var(--serif);font-size:1.1rem;color:var(--ink);flex:1;line-height:1.3}
.chapter-status{font:500 10.5px var(--sans);color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.chapter-body{padding:1.1rem 1.2rem}
.narrative{
  font-family:var(--serif);font-size:16px;line-height:1.75;color:var(--ink);
  white-space:pre-wrap;margin-bottom:1rem;
  padding:1rem 1.2rem;background:var(--bg3);
  border-left:3px solid var(--gold);
  border-radius:4px;
}
.dialogue{
  font-family:var(--serif);font-size:15px;font-style:italic;
  padding:.7rem 1rem;margin:.5rem 0 1rem;
  border-left:3px solid var(--crimson);
  background:var(--crimson-bg);
  border-radius:4px;
}
.dialogue b{font-style:normal;color:var(--crimson);font-family:var(--sans);font-weight:600}

/* ═══ BD CASE WITH BUBBLE ═══ */
.bd-case{
  position:relative;background:#111;
  border:2px solid var(--ink);
  border-radius:4px;overflow:hidden;margin-bottom:.5rem;
}
.bd-case img{display:block;width:100%;height:auto}
.bubble{
  position:absolute;background:#fff;border:2px solid #000;
  padding:6px 11px;font:600 12.5px var(--sans);color:#000;
  max-width:44%;box-shadow:3px 3px 0 rgba(0,0,0,.85);
  line-height:1.25;z-index:3;border-radius:10px;
}
.bubble .who{
  display:block;font:700 9.5px var(--sans);letter-spacing:.06em;
  text-transform:uppercase;color:var(--crimson);margin-bottom:3px;
}
.bubble::after{
  content:'';position:absolute;bottom:-11px;left:14px;
  width:0;height:0;border-left:8px solid transparent;
  border-right:8px solid transparent;border-top:10px solid #000;
}
.bubble.br::after{left:auto;right:14px}
.bd-meta{
  padding:.5rem .7rem;background:var(--bg3);
  font:500 10.5px var(--mono);color:var(--dim);
  display:flex;justify-content:space-between;
  border-radius:4px;margin-bottom:.8rem;
}

/* ═══ CONSOLE ═══ */
#console{
  position:fixed;left:0;right:0;bottom:0;height:40vh;
  background:#0b1220;color:#c8d1de;
  border-top:1px solid var(--line);
  z-index:50;transform:translateY(100%);
  transition:transform .3s ease;
  display:flex;flex-direction:column;
  box-shadow:0 -8px 32px rgba(0,0,0,.2);
}
#console.on{transform:none}
#console-head{
  padding:.55rem 1rem;border-bottom:1px solid #1e293b;
  background:linear-gradient(90deg,#0b1220,#111c30);
  display:flex;justify-content:space-between;align-items:center;
  font:600 10px var(--sans);letter-spacing:.15em;
  text-transform:uppercase;color:#eab308;
}
#console-head button{
  background:transparent;border:1px solid #334155;color:#94a3b8;
  padding:3px 8px;font-size:10px;
}
#console-head button:hover{background:#1e293b;color:#fff}
#log{
  flex:1;overflow-y:auto;padding:.6rem 1rem;
  font:11.5px/1.55 var(--mono);
}
.lg{padding:.15rem 0;border-bottom:1px solid rgba(255,255,255,.03)}
.lg.ok{color:#6ee7b7}
.lg.er{color:#fca5a5}
.lg.wr{color:#fcd34d}
.lg.in{color:#c8d1de}

/* ═══ TOAST ═══ */
#toast{
  position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);
  z-index:90;display:flex;flex-direction:column;gap:.5rem;align-items:center;
  pointer-events:none;
}
#toast>div{
  background:var(--ink);color:#fff;
  font:600 13px var(--sans);padding:.8rem 1.3rem;border-radius:var(--radius);
  box-shadow:0 8px 32px rgba(0,0,0,.25);
  animation:toastIn .3s ease;
  max-width:90vw;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ═══ PLAYER ═══ */
#player{
  position:fixed;inset:0;background:#000;z-index:100;
  display:none;align-items:center;justify-content:center;flex-direction:column;
}
#player.on{display:flex}
#player img{max-width:100vw;max-height:100vh;object-fit:contain}
#player .close{
  position:absolute;top:1rem;right:1rem;
  background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);
  z-index:2;
}
#player .close:hover{background:rgba(255,255,255,.3)}
#player .caption{
  position:absolute;left:5%;right:5%;bottom:5%;
  text-align:center;color:#fff;
  font:600 20px/1.35 var(--serif);
  text-shadow:0 2px 14px #000;
  padding:1.2rem;pointer-events:none;
}
#player .caption b{color:#fbbf24}
#player .caption small{
  display:block;font:400 14px var(--sans);
  opacity:.85;margin-top:.5rem;line-height:1.4;
}

/* ═══ MODAL ═══ */
#modal{
  position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  z-index:70;display:none;align-items:center;justify-content:center;padding:1rem;
}
#modal.on{display:flex}
#modal-inner{
  background:var(--bg2);border-radius:var(--radius2);
  max-width:720px;width:100%;max-height:85vh;overflow-y:auto;
  padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.3);
}

/* ═══ GUIDE BOXES ═══ */
.guide{
  display:flex;gap:.7rem;align-items:flex-start;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  background:var(--blue-bg);
  padding:.85rem 1.1rem;margin:.8rem 0;
  border-radius:4px;font-size:13.5px;line-height:1.5;
  color:var(--ink2);
}
.guide.ok{border-left-color:var(--sage);background:var(--sage-bg)}
.guide.err{border-left-color:var(--crimson);background:var(--crimson-bg)}
.guide.warn{border-left-color:var(--amber);background:var(--amber-bg)}
.guide b{color:var(--ink);font-weight:600}

/* ═══ PROGRESS ═══ */
.progress{
  height:4px;background:var(--line);border-radius:2px;
  overflow:hidden;margin:.8rem 0;
}
.progress i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  transition:width .3s ease;
}

/* ═══ RESPONSIVE ═══ */
@media(max-width:600px){
  main{padding:1rem .8rem}
  .panel{padding:1.1rem 1rem;border-radius:var(--radius)}
  header{padding:.8rem 1rem}
  .logo{font-size:1.2rem}
  h2{font-size:1.45rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
  .dg-grid{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:.5rem}
  .dg-item{padding:.75rem .55rem}
  .dg-item .emoji{font-size:1.4rem}
  .dg-item .nm{font-size:12px}
  .bubble{font-size:11.5px;padding:5px 8px;max-width:50%}
  .chapter-title{font-size:1rem}
  .narrative{font-size:15px;padding:.85rem 1rem}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span>Roman<b>·</b>Studio</span>
    <i>Romans illustrés & BD animées</i>
  </div>
  <div class="hb">
    <span class="chip dot" id="key-chip">Aucune clé</span>
    <button class="btn-sm" data-a="modal">📚 Mes projets</button>
    <button class="btn-sm" data-a="console">🖥️ Journal</button>
  </div>
</header>

<main id="main"></main>

<div id="console">
  <div id="console-head">
    <span>◆ Journal technique</span>
    <div style="display:flex;gap:.4rem">
      <button data-a="clear-log">Effacer</button>
      <button data-a="console">✕</button>
    </div>
  </div>
  <div id="log"></div>
</div>

<div id="toast"></div>

<div id="player">
  <img id="player-img" alt="">
  <div class="caption" id="player-cap"></div>
  <button class="btn-sm close" data-a="stop-play">✕ Quitter</button>
</div>

<div id="modal"><div id="modal-inner"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════ */
const API = 'https://apihub.agnes-ai.com/v1';
const MODEL_TXT = 'agnes-2.5-flash';
const MODEL_IMG = 'agnes-image-2.5-flash';
const KEY_STORAGE = 'rs3_key';
const PROJECT_PREFIX = 'rs3_project_';
const PROJECT_VERSION = 3;

// Ratios en pixels (validés par l'API Agnès)
const SIZE_PORTRAIT = '1024x1792';    // 9:16
const SIZE_LANDSCAPE = '1792x1024';   // 16:9
const SIZE_SQUARE = '1024x1024';      // 1:1

/* ═══════════════════════════════════════════════════════════════
   GENRES
   ═══════════════════════════════════════════════════════════════ */
const GENRES_ROMAN = [
  {id:'fantasy',    emoji:'🐉', name:'Fantasy',         style:'cinematic high fantasy, painterly oil-painting aesthetic, golden light, epic scale', palette:'deep emerald, gold, aged parchment, stormy sky'},
  {id:'sf',         emoji:'🚀', name:'Science-Fiction', style:'cinematic sci-fi, photorealistic concept art, vast futuristic scale, cold clean light', palette:'electric blue, chrome silver, deep space black, cyan'},
  {id:'polar',      emoji:'🔍', name:'Polar',           style:'noir crime photography, dramatic chiaroscuro, rain-soaked streets, moody atmosphere', palette:'charcoal grey, blood red, sodium amber, cold blue'},
  {id:'romance',    emoji:'🌹', name:'Romance',         style:'soft cinematic photography, warm bokeh, golden hour light, tender tones', palette:'dusty rose, warm cream, lavender, pale gold'},
  {id:'historique', emoji:'📜', name:'Historique',      style:'period drama cinematography, authentic costumes, candlelight, painterly realism', palette:'sepia, faded gold, oxblood leather, aged ivory'},
  {id:'aventure',   emoji:'🗺️', name:'Aventure',        style:'pulp adventure cinema, exotic locales, saturated colors, dramatic vistas', palette:'jungle green, saffron orange, sun-bleached bone, turquoise'}

/* ═══════════════════════════════════════════════════════════════
   JSON PARSER ROBUSTE
   ═══════════════════════════════════════════════════════════════ */
function parseJSON(text) {
  if (!text) return null;
  let c = String(text).replace(/```json|```/g, '');
  const a = c.indexOf('{'), b = c.lastIndexOf('}');
  if (a < 0 || b < 0) return null;
  c = c.slice(a, b + 1);
  try { return JSON.parse(c); } catch(e) {}
  let o = '', inStr = false, escape = false;
  for (let i = 0; i < c.length; i++) {
    const ch = c[i];
    if (escape) { o += ch; escape = false; continue; }
    if (ch === '\\') { o += ch; escape = true; continue; }
    if (ch === '"') { inStr = !inStr; o += ch; continue; }
    if (inStr && ch === '\n') { o += '\\n'; continue; }
    if (inStr && ch === '\r') continue;
    if (inStr && ch.charCodeAt(0) < 32) { o += ' '; continue; }
    o += ch;
  }
  try { return JSON.parse(o.replace(/,\s*([}\]])/g, '$1')); } catch(e) { return null; }
}

/* ═══════════════════════════════════════════════════════════════
   API CALLS
   ═══════════════════════════════════════════════════════════════ */
async function apiCall(endpoint, body, retries = 3) {
  if (!state.apiKey) throw new Error('Clé API manquante');
  for (let i = 0; i < retries; i++) {
    if (state.stop) throw new Error('stop');
    try {
      log('in', '→ POST ' + endpoint);
      const r = await fetch(API + endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + state.apiKey
        },
        body: JSON.stringify(body)
      });
      if (r.ok) {
        log('ok', '← HTTP ' + r.status);
        return r;
      }
      const txt = await r.text().catch(() => '');
      log('er', '← HTTP ' + r.status + ' : ' + txt.slice(0, 200));
      if (r.status === 429) {
        const wait = parseInt(r.headers.get('Retry-After') || '20');
        log('wr', 'Rate limit — attente ' + wait + 's');
        await sleep(wait * 1000);
        continue;
      }
      if ([401, 402, 403].includes(r.status)) {
        throw new Error('Clé API invalide ou expirée (HTTP ' + r.status + ')');
      }
      if (r.status >= 500 || r.status === 408) {
        log('wr', 'Erreur serveur — retry dans ' + (2 * (i + 1)) + 's');
        await sleep(2000 * (i + 1));
        continue;
      }
      throw new Error('HTTP ' + r.status + ' : ' + txt.slice(0, 200));
    } catch (e) {
      if (e.message === 'stop' || e.message.includes('Clé API')) throw e;
      if (i === retries - 1) throw e;
      log('wr', 'Retry : ' + e.message);
      await sleep(1500 * (i + 1));
    }
  }
  throw new Error('Échec après plusieurs tentatives');
}

async function callChat(system, user, maxTokens = 4000, temp = 0.8) {
  const r = await apiCall('/chat/completions', {
    model: MODEL_TXT,
    messages: [
      { role: 'system', content: san(system) },
      { role: 'user', content: san(user) }
    ],
    temperature: temp,
    max_tokens: maxTokens,
    chat_template_kwargs: { enable_thinking: false }
  });
  const data = await r.json();
  const txt = data?.choices?.[0]?.message?.content;
  if (!txt) throw new Error('Réponse texte vide');
  return txt;
}

async function callImage(prompt, options = {}) {
  const { size = SIZE_PORTRAIT, refs = [], label = '' } = options;
  
  // Rate limit : 6s entre images
  const now = Date.now();
  const wait = Math.max(0, 6000 - (now - state.lastImageCall));
  if (wait > 0) await sleep(wait);
  state.lastImageCall = Date.now();
  
  const buildBody = (withRefs) => {
    const body = {
      model: MODEL_IMG,
      prompt: san(prompt),
      n: 1,
      size: size,
      response_format: 'url'
    };
    if (withRefs && refs.length) {
      body.extra_body = { image: refs.slice(0, 4) };
    }
    return body;
  };
  
  log('in', '🎨 Image ' + (label ? '(' + label + ') ' : '') + 'size=' + size + (refs.length ? ' +' + refs.length + ' ref' : ''));
  
  let r;
  try {
    r = await apiCall('/images/generations', buildBody(refs.length > 0));
  } catch (e) {
    if (refs.length > 0) {
      log('wr', 'Échec avec références → tentative sans');
      r = await apiCall('/images/generations', buildBody(false));
    } else {
      throw e;
    }
  }
  
  const data = await r.json();
  const item = data?.data?.[0];
  if (!item) throw new Error('Réponse sans image');
  const url = item.url || (item.b64_json ? 'data:image/png;base64,' + item.b64_json : null);
  if (!url) throw new Error('Format image inconnu');
  log('ok', '✓ Image générée');
  return { u: url, d: url.startsWith('data:') ? url : null };
}

async function toDataURI(url) {
  if (!url) return null;
  if (url.startsWith('data:')) return url;
  try {
    const r = await fetch(url);
    const blob = await r.blob();
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
  } catch (e) {
    log('wr', 'Conversion dataURI échouée');
    return null;
  }
}

   ═══════════════════════════════════════════════════════════════ */
function storageKey(mode, genreId) {
  return PROJECT_PREFIX + mode + '_' + genreId;
}
function saveProject() {
  if (!state.project) return;
  state.project.updated = Date.now();
  try {
    localStorage.setItem(storageKey(state.project.mode, state.project.genreId), JSON.stringify(state.project));
  } catch (e) { log('er', 'Sauvegarde : ' + e.message); }
}
function loadProject(mode, genreId) {
  try {
    const raw = localStorage.getItem(storageKey(mode, genreId));
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (p.version !== PROJECT_VERSION) return null;
    return p;
  } catch (e) { return null; }
}
function newProject(mode, genreId) {
  return {
    version: PROJECT_VERSION,
    mode: mode,
    genreId: genreId,
    idea: '',
    title: '',
    logline: '',
    universe: '',
    protagonists: [],
    chapters: [],
    createdAt: Date.now(),
    updated: Date.now()
  };
}
function listProjects() {
  const out = [];
  ['roman', 'bd'].forEach(mode => {
    const genres = mode === 'bd' ? GENRES_BD : GENRES_ROMAN;
    genres.forEach(g => {
      const p = loadProject(mode, g.id);
      if (p) out.push(p);
    });
  });
  return out.sort((a, b) => b.updated - a.updated);
}
function deleteProject(mode, genreId) {
  try { localStorage.removeItem(storageKey(mode, genreId)); } catch (e) {}
}
function genreOf(p) {
  const list = p.mode === 'bd' ? GENRES_BD : GENRES_ROMAN;
  return list.find(g => g.id === p.genreId) || list[0];
}

async function generatePlan() {
  const p = state.project;
  if (!p.idea || p.idea.trim().length < 10) throw new Error('Idée trop courte');
  const genre = genreOf(p);
  log('in', '📋 Plan…');
  toast('Plan en cours…');
  const raw = await callChat(
    'Tu es scénariste. Réponds UNIQUEMENT en JSON valide strict.',
    buildPlanPrompt(p.idea, genre, p.mode),
    6000, 0.8
  );
  const plan = parseJSON(raw);
  if (!plan || !plan.protagonists || !plan.protagonists.length) {
    log('er', 'JSON plan invalide (aperçu) : ' + raw.slice(0, 300));
    throw new Error('Plan invalide');
  }
  p.title = plan.title || 'Sans titre';
  p.logline = plan.logline || '';
  p.universe = plan.universe || '';
  p.protagonists = plan.protagonists.slice(0, 4).map(pt => ({
    id: pt.id || uid(),
    name: pt.name || '?',
    role: pt.role || 'protagoniste',
    personality: pt.personality || '',
    appearance: pt.appearance || { face:'', hair:'', eyes:'', build:'', outfit:'', accessories:'', signature_colors:[] },
    sheet: null,
    sheetStatus: 'pending'
  }));
  p.chapters = (plan.chapters || []).slice(0, 4).map((c, i) => ({
    id: uid(),
    number: c.number || (i + 1),
    title: c.title || '',
    summary: c.summary || '',
    key_emotional_beat: c.key_emotional_beat || '',
    narrative: '',
    dialogue: [],
    illustrations: [],
    cases: [],
    status: 'pending'
  }));
  saveProject();
  log('ok', '✦ Plan prêt : ' + p.title + ' · ' + p.protagonists.length + ' persos · ' + p.chapters.length + ' chapitres');
}

async function generateCharacterSheets() {
  const p = state.project;
  const genre = genreOf(p);
  for (let i = 0; i < p.protagonists.length; i++) {
    if (state.stop) break;
    const pr = p.protagonists[i];
    if (pr.sheet && pr.sheet.u) continue;
    pr.sheetStatus = 'generating';
    renderMain();
    try {
      log('in', '🎭 Character sheet ' + pr.name + '…');
      const img = await callImage(buildSheetPrompt(pr, genre, p.mode), {
        size: SIZE_LANDSCAPE,
        label: 'sheet ' + pr.name
      });
      pr.sheet = img;
      pr.sheetStatus = 'done';
      log('ok', '✓ Sheet ' + pr.name);
    } catch (e) {
      if (e.message === 'stop') break;
      pr.sheetStatus = 'error';
      log('er', 'Sheet ' + pr.name + ' : ' + e.message);
    }
    saveProject();
    renderMain();
  }
}

  const p = state.project;
  const genre = genreOf(p);
  const listKey = p.mode === 'bd' ? 'cases' : 'illustrations';
  for (let ci = 0; ci < p.chapters.length; ci++) {
    if (state.stop) break;
    const ch = p.chapters[ci];
    if (ch.status === 'done' && (ch[listKey] || []).length) continue;
    ch.status = 'writing';
    renderMain();
    try {
      log('in', (p.mode === 'bd' ? '📄 Planche ' : '📖 Chapitre ') + (ci + 1) + '…');
      const raw = await callChat(
        'Tu es scénariste. Réponds UNIQUEMENT en JSON valide strict.',
        buildChapterPrompt(p, ch, ci + 1, p.chapters.slice(0, ci), genre),
        4000, 0.8
      );
      const data = parseJSON(raw);
      if (!data) throw new Error('JSON invalide');
      if (p.mode === 'bd') {
        if (!Array.isArray(data.cases)) throw new Error('Pas de cases');
        ch.cases = data.cases.slice(0, 4).map((c, ii) => ({
          id: uid(),
          index: c.index || (ii + 1),
          framing: c.framing || 'medium',
          action: c.action || '',
          characters_present: Array.isArray(c.characters_present) ? c.characters_present : [],
          dialogue: Array.isArray(c.dialogue) ? c.dialogue : [],
          prompt: c.prompt || '',
          image: null,
          status: 'pending'
        }));
      } else {
        if (!data.narrative) throw new Error('Pas de narrative');
        ch.narrative = data.narrative;
        ch.dialogue = Array.isArray(data.dialogue) ? data.dialogue : [];
        ch.illustrations = (data.illustrations || []).slice(0, 3).map((ill, ii) => ({
          id: uid(),
          index: ii,
          prompt: ill.prompt || '',
          characters_present: Array.isArray(ill.characters_present) ? ill.characters_present : [],
          image: null,
          status: 'pending'
        }));
      }
      ch.status = 'done';
      log('ok', '✓ ' + (p.mode === 'bd' ? 'Planche' : 'Chapitre') + ' ' + (ci + 1));
    } catch (e) {
      if (e.message === 'stop') break;
      ch.status = 'error';
      log('er', 'Chapitre ' + (ci + 1) + ' : ' + e.message);
    }
    saveProject();
    renderMain();
  }
}

async function generateIllustrations() {
  const p = state.project;
  const genre = genreOf(p);
  const listKey = p.mode === 'bd' ? 'cases' : 'illustrations';
  
  // Convertit les sheets en dataURI (une fois)
  const refs = {};
  for (const pr of p.protagonists) {
    if (pr.sheet && pr.sheet.u) {
      refs[pr.id] = pr.sheet.d || await toDataURI(pr.sheet.u);
    }
  }
  
  for (const ch of p.chapters) {
    const items = ch[listKey] || [];
    for (const item of items) {
      if (state.stop) return;
      if (item.image && item.image.u) continue;
      item.status = 'loading';
      renderMain();
      try {
        const itemRefs = [];
        (item.characters_present || []).forEach(id => {
          if (refs[id]) itemRefs.push(refs[id]);
        });
        const prompt = buildIllustrationPrompt(item, ch, p, genre);
        const size = p.mode === 'bd' ? SIZE_SQUARE : SIZE_PORTRAIT;
        log('in', '🎨 ' + (p.mode === 'bd' ? 'Case' : 'Illustration') + ' ' + ch.number + '.' + (item.index + 1) + '…');
        const img = await callImage(prompt, { size, refs: itemRefs, label: ch.number + '.' + (item.index + 1) });
        item.image = img;
        item.status = 'done';
        log('ok', '✓ Image ' + ch.number + '.' + (item.index + 1));
      } catch (e) {
        if (e.message === 'stop') return;
        item.status = 'error';
        item.error = e.message;
        log('er', 'Image ' + ch.number + '.' + (item.index + 1) + ' : ' + e.message);
      }
      saveProject();
      renderMain();
    }
  }
}

async function runPipeline() {
  if (state.busy) return;
  if (!state.apiKey) { toast('Ajoutez votre clé API'); return; }
  const p = state.project;
  if (!p || !p.idea || p.idea.trim().length < 10) {
    toast('Décrivez votre idée (10 caractères min)');
    return;
  }
  
  state.busy = true;
  state.stop = false;
  renderMain();
  
  try {
    log('in', '════════ Démarrage ════════');
    
    if (!p.protagonists.length) await generatePlan();
    else log('in', 'Plan déjà existant, on continue');
    
    await generateCharacterSheets();
    await generateChapters();
    await generateIllustrations();
    
    log('ok', '✦ Génération terminée ✦');
    toast('✦ Terminé !');
  } catch (e) {
    if (e.message === 'stop') { log('wr', 'Arrêté'); toast('Arrêté'); }
    else { log('er', 'Erreur : ' + e.message); toast('Erreur : ' + e.message.slice(0, 60)); }
  }
  
  state.busy = false;
  state.stop = false;
  saveProject();
  renderMain();
}

/* ═══════════════════════════════════════════════════════════════
   PLAYER
   ═══════════════════════════════════════════════════════════════ */
function speak(text) {
  if (!state.voiceOn || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function stopSpeech() {
  try { speechSynthesis.cancel(); } catch (e) {}
}

async function playProject() {
  const p = state.project;
  if (!p || !p.chapters.length) return;
  const listKey = p.mode === 'bd' ? 'cases' : 'illustrations';
  const ready = p.chapters.filter(c => c.status === 'done' && (c[listKey] || []).some(x => x.image));
  if (!ready.length) { toast('Aucune image prête'); return; }
  
  state.playing = true;
  $('#player').classList.add('on');
  const img = $('#player-img');
  const cap = $('#player-cap');
  
  for (const ch of ready) {
    if (!state.playing) break;
    const items = (ch[listKey] || []).filter(x => x.image && x.image.u);
    
    if (p.mode === 'roman') {
      const text = (ch.narrative || '') + ' ' + (ch.dialogue || []).map(d => d.line).join('. ');
      speak(text);
      for (const ill of items) {
        if (!state.playing) break;
        img.src = ill.image.u;
        cap.innerHTML = '<b>Chapitre ' + ch.number + '</b> — ' + esc(ch.title) +
          '<small>' + esc((ch.narrative || '').slice(0, 140)) + '…</small>';
        const wordCount = (ch.narrative || '').split(/\s+/).length;
        await sleep(Math.max(4000, Math.min(9000, (wordCount * 80) / Math.max(1, items.length))));
      }
    } else {
      for (const c of items) {
        if (!state.playing) break;
        img.src = c.image.u;
        const dialogue = (c.dialogue || []).map(d => d.speaker + ' dit : ' + d.line).join('. ');
        if (dialogue) speak(dialogue);
        cap.innerHTML = '<b>Planche ' + ch.number + '</b> — Case ' + c.index +
          (dialogue ? '<small>' + esc(dialogue) + '</small>' : '');
        await sleep(Math.max(3500, dialogue.length * 60 + 2000));
      }
    }
  }
  stopPlay();
}
function stopPlay() {
  state.playing = false;
  stopSpeech();
  $('#player').classList.remove('on');
  renderMain();
}

/* ═══════════════════════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a;
  
  if (a === 'console') { $('#console').classList.toggle('on'); return; }
  if (a === 'clear-log') { $('#log').innerHTML = ''; return; }
  if (a === 'modal') { showModal(); return; }
  if (a === 'close-modal') { $('#modal').classList.remove('on'); return; }
  if (a === 'stop-play') { stopPlay(); return; }
  
  if (a === 'save-key') {
    const v = $('#api-input').value.trim();
    if (!v) { toast('Collez une clé'); return; }
    if (!v.startsWith('sk-') && !confirm('La clé ne commence pas par "sk-". Continuer ?')) return;
    state.apiKey = v;
    try { localStorage.setItem(KEY_STORAGE, v); } catch (e) {}
    toast('✓ Clé enregistrée');
    log('ok', 'Clé enregistrée');
    renderMain();
    return;
  }
  
  if (a === 'test-key') {
    if (!state.apiKey) { toast('Pas de clé'); return; }
    toast('Test en cours…');
    try {
      log('in', '🧪 Test de la clé…');
      const img = await callImage('A single red apple on a wooden table, studio lighting, minimal composition, photorealistic', {
        size: SIZE_SQUARE,
        label: 'test'
      });
      log('ok', '✓ Clé fonctionne');
      toast('✓ Clé valide !');
      $('#player-img').src = img.u;
      $('#player-cap').innerHTML = '<b>✓ Test réussi</b><small>La clé API fonctionne correctement. Vous pouvez lancer une génération.</small>';
      $('#player').classList.add('on');
      setTimeout(() => {
        if (!state.playing) $('#player').classList.remove('on');
      }, 4000);
    } catch (e) {
      log('er', 'Test échoué : ' + e.message);
      toast('✕ ' + e.message.slice(0, 60));
    }
    return;
  }
  
  if (a === 'open-drawer') {
    const mode = b.dataset.mode;
    const genreId = b.dataset.genre;
    let p = loadProject(mode, genreId);
    if (!p) {
      p = newProject(mode, genreId);
      log('in', 'Nouveau projet ' + mode + ' / ' + genreId);
    } else {
      log('in', 'Projet chargé : ' + (p.title || genreId));
    }
    state.project = p;
    renderMain();
    return;
  }
  
  if (a === 'use-chip') {
    const text = b.dataset.text;
    if (state.project) {
      state.project.idea = text;
      saveProject();
      renderMain();
    }
    return;
  }
  
  if (a === 'run') { runPipeline(); return; }
  if (a === 'stop') { state.stop = true; toast('Arrêt en cours…'); return; }
  if (a === 'play') { playProject(); return; }
  
  if (a === 'delete-drawer') {
    if (!confirm('Vider complètement ce tiroir ? Tout sera perdu.')) return;
    deleteProject(b.dataset.mode, b.dataset.genre);
    if (state.project && state.project.genreId === b.dataset.genre && state.project.mode === b.dataset.mode) {
      state.project = null;
    }
    toast('Tiroir vidé');
    renderMain();
    return;
  }
  
  if (a === 'load-project') {
    const mode = b.dataset.mode;
    const genreId = b.dataset.genre;
    const p = loadProject(mode, genreId);
    if (p) {
      state.project = p;
      $('#modal').classList.remove('on');
      renderMain();
      log('in', 'Projet rechargé : ' + (p.title || genreId));
    }
    return;
  }
  
  if (a === 'delete-from-modal') {
    if (!confirm('Supprimer ce projet ?')) return;
    deleteProject(b.dataset.mode, b.dataset.genre);
    if (state.project && state.project.genreId === b.dataset.genre && state.project.mode === b.dataset.mode) {
      state.project = null;
    }
    showModal();
    renderMain();
    return;
  }
});

    html += '<p class="sub">Aucun projet pour l\'instant. Cliquez sur un tiroir pour commencer.</p>';

      const g = genreOf(p);
      const listKey = p.mode === 'bd' ? 'cases' : 'illustrations';
      const total = (p.chapters || []).reduce((a, c) => a + ((c[listKey] || []).filter(i => i.image).length), 0);
      const doneCount = (p.chapters || []).filter(c => c.status === 'done').length;
      html += '<div class="card" style="margin-bottom:.7rem">';
      html += '<div class="card-body">';
      html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;flex-wrap:wrap">';
      html += '<div style="flex:1;min-width:200px">';
      html += '<div style="font-family:var(--serif);font-size:1.15rem;color:var(--ink);font-weight:600">' + g.emoji + ' ' + esc(p.title || g.name) + '</div>';
      html += '<div class="label" style="margin-top:5px">' + (p.mode === 'bd' ? 'BD' : 'Roman') + ' · ' + new Date(p.updated).toLocaleString('fr-FR') + '</div>';
      html += '<div style="font-size:12.5px;color:var(--dim);margin-top:5px">' + (p.protagonists?.length || 0) + ' persos · ' + doneCount + ' ' + (p.mode === 'bd' ? 'planches' : 'chap') + ' · ' + total + ' images</div>';
      html += '</div>';
      html += '<div style="display:flex;gap:.4rem;flex-wrap:wrap">';
      html += '<button class="btn-sm" data-a="load-project" data-mode="' + p.mode + '" data-genre="' + p.genreId + '">Ouvrir</button>';
      html += '<button class="btn-sm btn-danger" data-a="delete-from-modal" data-mode="' + p.mode + '" data-genre="' + p.genreId + '">🗑</button>';
      html += '</div></div>';
      html += '</div></div>';
    });
  }
  
  $('#modal-inner').innerHTML = html;
  $('#modal').classList.add('on');
}

   INIT
   ═══════════════════════════════════════════════════════════════ */
(function init() {
  try {
    const k = localStorage.getItem(KEY_STORAGE);
    if (k) state.apiKey = k;
  } catch (e) {}
  
  renderMain();
  log('ok', 'Roman Studio V3 prêt');
  log('in', state.apiKey ? 'Clé API chargée' : 'Aucune clé API — collez-en une');
  log('in', '6 genres Roman + 6 genres BD disponibles');
  log('in', 'Character sheets 4 vues + signature features');
})();
</script>
