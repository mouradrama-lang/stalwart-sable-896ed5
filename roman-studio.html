<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roman Studio V2 · Romans illustrés & BD animées</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb;--p:#fff;--ink:#0b1a2b;--dim:#6b7c93;--ln:#d5deea;
  --a:#0a84ff;--b:#ff5a1f;--ok:#12b76a;--er:#e5383b;--gold:#c9a227;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:Rajdhani,system-ui,sans-serif;
  --mono:'Share Tech Mono',ui-monospace,monospace;
  --orb:'Orbitron',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;padding-bottom:70px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/40px 40px;opacity:.5}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ink);padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.logo{font:800 20px var(--orb);letter-spacing:.1em}
.logo b{color:var(--a)}
.logo i{display:block;font:10px var(--mono);letter-spacing:.3em;color:var(--dim);font-style:normal}
.hb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
main{max-width:1180px;margin:0 auto;padding:22px 16px}

.hero{background:var(--p);border:1px solid var(--ln);padding:22px;margin-bottom:16px;position:relative}
.hero::before,.hero::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--a)}
.hero::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.hero::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.lab{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h2{font:600 26px var(--orb);letter-spacing:.04em;margin:6px 0 8px}
h2 b{color:var(--a)}
h3{font:600 15px var(--orb);letter-spacing:.06em;margin:16px 0 4px}
p.sub{color:var(--dim);margin-bottom:12px;max-width:780px}

.guide{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--a);background:#eef6ff;padding:12px 14px;margin:10px 0 16px;font-size:14px}
.guide.go{border-color:var(--ok);background:#effaf4}
.guide.er{border-color:var(--er);background:#fff1f1}
.guide.wt{border-color:var(--b);background:#fff6f0}
.guide b{color:var(--ink)}

textarea,input[type=text],input[type=password],select{width:100%;font:13px var(--mono);padding:9px;border:1px solid var(--ln);background:#f9fbfd;color:var(--ink);outline:0}
textarea:focus,input:focus,select:focus{border-color:var(--a);background:#fff}
textarea{resize:vertical;min-height:70px;margin:4px 0;font-family:var(--serif);font-size:15px}
label.f{display:block;margin:6px 0}
label.f span{display:block}
button,.btn{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;display:inline-block;font-family:var(--mono)}
button:hover:not(:disabled),.btn:hover{background:var(--ink);color:#fff}
button:disabled{opacity:.35;cursor:not-allowed}
.big{background:var(--a);border-color:var(--a);color:#fff;padding:14px 26px;font-size:14px;letter-spacing:.16em}
.big:hover:not(:disabled){background:#0066cc;border-color:#0066cc}
.sm{padding:5px 9px;font-size:10px}
.ft{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}

/* Tiroirs */
.drawers{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:720px){.drawers{grid-template-columns:1fr}}
.drawer-group{background:var(--p);border:1px solid var(--ln);padding:14px}
.drawer-group h3{margin-top:0;color:var(--a);font-family:var(--orb)}
.dg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.dg-item{padding:10px;border:1px solid var(--ln);background:#fbfdff;cursor:pointer;transition:.15s;position:relative}
.dg-item:hover{border-color:var(--a);background:#eef6ff}
.dg-item.active{border-color:var(--a);background:#eef6ff;box-shadow:inset 0 0 0 2px var(--a)}
.dg-item .emoji{font-size:1.5rem;display:block;margin-bottom:4px}
.dg-item .nm{font:600 13px var(--sans);color:var(--ink);line-height:1.2}
.dg-item .stt{font:10px var(--mono);color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chip{font:11px var(--mono);padding:2px 8px;border:1px solid var(--ok);color:var(--ok)}
.chip.off{border-color:var(--er);color:var(--er)}
.chip.cd{border-color:var(--b);color:var(--b)}

/* Cartes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cd{border:1px solid var(--ln);background:#fff;padding:10px;position:relative}
.cd.pk{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.im{position:relative;background:#e8eef6;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:6px;font:11px var(--mono);color:var(--dim)}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sp{position:absolute;width:26px;height:26px;border:2px solid var(--a);border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite;z-index:2}
@keyframes r{to{transform:rotate(360deg)}}
.ip{background:#f6f9fc;border:1px solid var(--ln);padding:8px;margin:6px 0}
.rw{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}
.up{border:1px solid var(--ink);cursor:pointer}
.bar{height:6px;background:var(--ln);margin:12px 0}
.bar i{display:block;height:100%;background:var(--a);width:0;transition:width .4s}

/* Feed */
.feed{margin:10px 0}
.fi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ln);font-size:15px}
.fi.ok{color:var(--ok)}
.fi.er{color:var(--er)}
.fi em{margin-left:auto;font:11px var(--mono);color:var(--dim);font-style:normal}
.fi .ic{width:18px;text-align:center;flex:none}
.sp2{display:inline-block;width:14px;height:14px;border:2px solid var(--a);border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite;flex:none}

/* Log */
#con{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:50;background:#0b1a2b;color:#bfe3ff;transform:translateY(100%);transition:transform .25s;display:flex;flex-direction:column}
#con.on{transform:none}
#lb{flex:1;overflow:auto;padding:8px 12px;font:12px/1.5 var(--mono)}
.lg.er{color:#ff8a8a}
.lg.wr{color:#ffc477}
.lg.ok{color:#7dffb5}

/* Modal */
#md{position:fixed;inset:0;background:rgba(11,26,43,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
#md.on{display:flex}
#md>div{background:#fff;max-width:720px;width:100%;max-height:85vh;overflow:auto;padding:20px;border:1px solid var(--ink)}

/* Toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:var(--ink);color:#fff;font:12px var(--mono);padding:8px 14px}

/* Player */
#pl{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column}
#pl.on{display:flex}
#pv{max-width:100vw;max-height:100vh;display:none}
#pi{max-width:100vw;max-height:100vh;display:none}
#sub{position:absolute;left:5%;right:5%;bottom:7%;text-align:center;color:#fff;font:600 22px/1.3 var(--sans);text-shadow:0 2px 8px #000}
#pl button{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);color:#000}

/* Case BD avec bulles superposées */
.page{background:#fff;border:1px solid var(--ln);padding:16px;margin-bottom:18px}
.case-wrap{position:relative;margin-bottom:10px;border:2px solid var(--ink);background:#000;overflow:hidden}
.case-wrap img{display:block;width:100%;height:auto}
.bubble{position:absolute;background:#fff;border:2px solid #000;padding:6px 10px;font:600 13px var(--sans);color:#000;max-width:45%;box-shadow:3px 3px 0 rgba(0,0,0,.85);z-index:3;line-height:1.25}
.bubble .sp{position:static;display:block;width:auto;height:auto;border:none;animation:none;font:600 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--a);margin-bottom:2px}
.bubble::after{content:'';position:absolute;bottom:-9px;left:14px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:9px solid #000}
.bubble.br::after{left:auto;right:14px}
.case-meta{padding:6px 10px;background:#f6f9fc;border-top:1px solid var(--ln);font:11px var(--mono);color:var(--dim)}
.case-meta b{color:var(--ink)}

/* Lecteur BD */
#pl .bd-frame{max-width:min(92vw,680px);max-height:88vh;position:relative;background:#000;border:3px solid #fff}
#pl .bd-frame img{display:block;width:100%;height:auto}

/* Toggle Roman/BD */
.mode-toggle{display:flex;gap:0;margin:10px 0;border:2px solid var(--ink);width:fit-content}
.mode-toggle button{border:none;border-right:1px solid var(--ink);background:#fff;color:var(--ink);padding:10px 22px;font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.mode-toggle button:last-child{border-right:none}
.mode-toggle button.on{background:var(--ink);color:#fff}
</style>
</head>
<body>

<header>
  <div class="logo">ROMAN<b>·STUDIO</b><i>ROMANS ILLUSTRÉS · BD ANIMÉES</i></div>
  <div class="hb">
    <span class="chip" id="keychip" style="display:none"></span>
    <button class="sm" data-a="sess">Mes projets</button>
    <button class="sm" data-a="con">Journal</button>
  </div>
</header>

<main id="main"></main>

<div id="con">
  <div style="display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #26405c;font:12px var(--mono)">
    <span>JOURNAL TECHNIQUE</span>
    <button class="sm" data-a="con" style="color:#bfe3ff;border-color:#4a6a8a">✕</button>
  </div>
  <div id="lb"></div>
</div>

<div id="md"><div id="mdc"></div></div>
<div id="toast"></div>

<div id="pl">
  <img id="pi" alt="">
  <div id="sub"></div>
  <button data-a="stopplay">✕ Quitter</button>
</div>

<script>
/* ═════════════════════════════════════════════════════════════════════
   CONFIG
   ═════════════════════════════════════════════════════════════════════ */
const API='https://apihub.agnes-ai.com/v1';
const TXT=['agnes-3.0-flash','agnes-2.5-flash'];
const IMG='agnes-image-2.5-flash';
const RPM={img:10,txt:10};
const API_KEY_STORAGE='romanstudio2_keys';
const ROMAN_STORAGE='romanstudio2_roman_';
const BD_STORAGE='romanstudio2_bd_';

/* ═════════════════════════════════════════════════════════════════════
   GENRES — 6 romans + 6 BD
   ═════════════════════════════════════════════════════════════════════ */
const GENRES_ROMAN=[
  {id:'roman-fantasy',emoji:'🐉',name:'Fantasy',style:'cinematic high fantasy, painterly oil-painting aesthetic, golden light, epic scale',palette:'deep emerald, gold, aged parchment, stormy sky'},
  {id:'roman-sf',emoji:'🚀',name:'Science-Fiction',style:'cinematic sci-fi, photorealistic concept art, vast futuristic scale, cold clean light',palette:'electric blue, chrome silver, deep space black, cyan'},
  {id:'roman-polar',emoji:'🔍',name:'Polar',style:'noir crime photography, dramatic chiaroscuro, rain-soaked streets, moody atmosphere',palette:'charcoal grey, blood red, sodium amber, cold blue'},
  {id:'roman-romance',emoji:'🌹',name:'Romance',style:'soft cinematic photography, warm bokeh, golden hour light, tender tones',palette:'dusty rose, warm cream, lavender, pale gold'},
  {id:'roman-historique',emoji:'📜',name:'Historique',style:'period drama cinematography, authentic costumes, candlelight, painterly realism',palette:'sepia, faded gold, oxblood leather, aged ivory'},
  {id:'roman-aventure',emoji:'🗺️',name:'Aventure',style:'pulp adventure cinema, exotic locales, saturated colors, dramatic vistas',palette:'jungle green, saffron orange, sun-bleached bone, turquoise'}
];

const GENRES_BD=[
  {id:'bd-shonen',emoji:'⚔️',name:'Shonen',style:'japanese shonen manga, dynamic lines, cel shading, ink outlines, energetic action poses',palette:'bright saturated colors, ink black outlines'},
  {id:'bd-shojo',emoji:'🌸',name:'Shojo',style:'japanese shojo manga, delicate line art, soft watercolor washes, expressive large eyes, sparkling details',palette:'pastel pink, lavender, mint, cream'},
  {id:'bd-seinen',emoji:'🗡️',name:'Seinen',style:'japanese seinen manga, realistic anatomies, detailed backgrounds, mature dark tone, precise ink work',palette:'muted earth tones, deep blacks, desaturated'},
  {id:'bd-comics',emoji:'🦸',name:'Comics US',style:'american superhero comics, bold ink outlines, flat saturated colors, dynamic angles, halftone dots',palette:'primary red/blue/yellow, ink black'},
  {id:'bd-francobelge',emoji:'📔',name:'Franco-belge',style:'franco-belgian bande dessinée, ligne claire, clean uniform lines, flat vivid colors',palette:'flat primaries, warm secondaries'},
  {id:'bd-webtoon',emoji:'📱',name:'Webtoon / Manhwa',style:'korean webtoon / manhwa, clean digital line art, soft cel shading, vertical scrolling composition',palette:'pastel gradients, glossy highlights, muted jewel tones'}
];

/* ═════════════════════════════════════════════════════════════════════
   UTILS
   ═════════════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const san=t=>String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[\u00a0\u202f]/g,' ');
const escRe=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* ═════════════════════════════════════════════════════════════════════
   STATE
   ═════════════════════════════════════════════════════════════════════ */
const state={
  apiKeys:[],activeKey:0,
  activeProject:null,   // {mode:'roman'|'bd', genreId, data:{...}}
  isRunning:false,stopRequested:false,
  isPlaying:false,
  voiceEnabled:true
};

/* ═════════════════════════════════════════════════════════════════════
   LOG / TOAST
   ═════════════════════════════════════════════════════════════════════ */
function log(l,m){
  const d=document.createElement('div');
  d.className='lg '+l;
  d.textContent=new Date().toLocaleTimeString('fr-FR')+'  '+m;
  const b=$('#lb');
  if(!b)return;
  b.appendChild(d);
  while(b.children.length>400)b.firstChild.remove();
  b.scrollTop=b.scrollHeight;
}
function toast(m){
  const d=document.createElement('div');
  d.textContent=m;
  $('#toast').appendChild(d);
  setTimeout(()=>d.remove(),4200);
}

/* ═════════════════════════════════════════════════════════════════════
   MULTI-CLÉS API
   ═════════════════════════════════════════════════════════════════════ */
function loadKeys(){
  try{
    const raw=localStorage.getItem(API_KEY_STORAGE);
    if(raw){
      const arr=JSON.parse(raw);
      if(Array.isArray(arr))state.apiKeys=arr;
    }
  }catch(e){}
  if(!state.apiKeys.length)state.apiKeys=[];
  state.apiKeys=state.apiKeys.map(k=>typeof k==='string'?{k:k,img:0,txt:0,cool:0,off:false}:k);
}
function saveKeys(){
  try{localStorage.setItem(API_KEY_STORAGE,JSON.stringify(state.apiKeys))}catch(e){}
}
function liveKeys(){return state.apiKeys.filter(k=>!k.off)}
function hasKey(){return liveKeys().length>0}

async function slot(kind){
  for(;;){
    if(state.stopRequested)throw new Error('stop');
    const live=liveKeys();
    if(!live.length)throw new Error('Aucune clé API active');
    const iv=60000/RPM[kind]*1.15, now=Date.now();
    let best=null,bt=1e18;
    for(const o of live){
      const t=Math.max(o[kind]||0,o.cool||0,now);
      if(t<bt){bt=t;best=o}
    }
    if(bt>now){await sleep(Math.min(bt-now,400));continue}
    if(best.cool>Date.now())continue;
    best[kind]=now+iv;
    return best;
  }
}

async function call(kind,url,body,tries){
  let err;
  for(let a=0;a<tries;a++){
    if(state.stopRequested)throw new Error('stop');
    const o=await slot(kind);
    try{
      const r=await fetch(url,{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+o.k},
        body:JSON.stringify(body)
      });
      if(r.ok){o.off=o.off;return r}
      const t=(await r.text()).slice(0,200);
      log('er',kind+' HTTP '+r.status+' '+t.slice(0,80));
      if(r.status===429){
        o.cool=Date.now()+(parseInt(r.headers.get('Retry-After'))||25)*1000;
        err=new Error('429');
        continue;
      }
      if([401,402,403].includes(r.status)){
        o.off=true;
        log('wr','clé …'+o.k.slice(-4)+' désactivée');
        err=new Error('HTTP '+r.status);
        continue;
      }
      if(r.status>=500||r.status===408){
        err=new Error('HTTP '+r.status);
        await sleep(2000*(a+1));
        continue;
      }
      throw Object.assign(new Error('HTTP '+r.status+' '+t),{fatal:true});
    }catch(e){
      if(e.fatal||e.message==='stop')throw e;
      err=e;
      await sleep(1500*(a+1));
    }
  }
  throw err||new Error('échec');
}

/* ═════════════════════════════════════════════════════════════════════
   JSON PARSER ROBUSTE
   ═════════════════════════════════════════════════════════════════════ */
function J(t){
  if(!t)return null;
  let c=String(t).replace(/```json|```/g,'');
  const a=c.indexOf('{'),b=c.lastIndexOf('}');
  if(a<0||b<0)return null;
  c=c.slice(a,b+1);
  try{return JSON.parse(c)}catch(e){}
  // Fix quotes + newlines
  let o='',s=false,x=false;
  for(let i=0;i<c.length;i++){
    const ch=c[i];
    if(x){o+=ch;x=false;continue}
    if(ch==='\\'){o+=ch;x=true;continue}
    if(ch==='"'){s=!s;o+=ch;continue}
    if(s&&ch==='\n'){o+='\\n';continue}
    if(s&&ch==='\r'){continue}
    if(s&&ch.charCodeAt(0)<32){o+=' ';continue}
    o+=ch;
  }
  try{return JSON.parse(o.replace(/,\s*([}\]])/g,'$1'))}catch(e){return null}
}

/* ═════════════════════════════════════════════════════════════════════
   IA — TEXTE
   ═════════════════════════════════════════════════════════════════════ */
async function chat(sys,user,max,temp){
  for(let i=0;i<TXT.length;i++){
    try{
      const r=await call('txt',API+'/chat/completions',{
        model:TXT[i],
        messages:[{role:'system',content:san(sys)},{role:'user',content:san(user)}],
        temperature:temp||0.8,
        max_tokens:max||6000,
        chat_template_kwargs:{enable_thinking:false}
      },3);
      const d=await r.json();
      const t=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      if(t)return t;
    }catch(e){
      if(e.message==='stop'||e.fatal)throw e;
      log('wr','texte '+TXT[i]+' : '+e.message);
    }
  }
  throw new Error('IA texte indisponible');
}
async function llmJSON(sys,user,max,temp){
  for(let a=0;a<2;a++){
    const j=J(await chat(sys+' Réponds UNIQUEMENT par un objet JSON valide, sans texte autour.',user,max,temp));
    if(j)return j;
  }
  throw new Error('Réponse IA illisible');
}

/* ═════════════════════════════════════════════════════════════════════
   IMAGES — DATA URI NON-BLOQUANT
   ═════════════════════════════════════════════════════════════════════ */
function toData(u){
  return new Promise(resolve=>{
    if(!u)return resolve(null);
    if(u.indexOf('data:')===0)return resolve(u);
    fetch(u).then(r=>r.blob()).then(b=>{
      const o=URL.createObjectURL(b),im=new Image();
      im.onload=()=>{
        try{
          const s=Math.min(1,1024/Math.max(im.width,im.height));
          const c=document.createElement('canvas');
          c.width=Math.round(im.width*s);
          c.height=Math.round(im.height*s);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          URL.revokeObjectURL(o);
          resolve(c.toDataURL('image/jpeg',0.86));
        }catch(e){URL.revokeObjectURL(o);resolve(null)}
      };
      im.onerror=()=>{URL.revokeObjectURL(o);resolve(null)};
      im.src=o;
    }).catch(()=>resolve(null));
  });
}

function mkImg(prompt,refUris,ratio){
  const body={
    model:IMG,
    prompt:san(prompt),
    n:1,
    size:'1K',
    ratio:ratio||'3:4',
    extra_body:{response_format:'url'}
  };
  if(refUris&&refUris.length)body.extra_body.image=refUris.filter(Boolean).slice(0,4);
  return call('img',API+'/images/generations',body,3).then(r=>r.json()).then(d=>{
    const it=d.data&&d.data[0];
    const u=it&&(it.url||(it.b64_json&&'data:image/png;base64,'+it.b64_json));
    if(!u)throw new Error('pas d\'image reçue');
    const img={u:u,d:u.indexOf('data:')===0?u:null};
    if(!img.d){
      img._conv=toData(u).then(dd=>{img.d=dd||u;return img.d}).catch(()=>{img.d=img.u;return img.d});
    }
    return img;
  });
}
function ensureRef(img){
  if(!img)return Promise.resolve(null);
  if(img.d)return Promise.resolve(img.d);
  if(img._conv)return img._conv;
  img._conv=toData(img.u).then(dd=>{img.d=dd||img.u;return img.d}).catch(()=>{img.d=img.u;return img.d});
  return img._conv;
}
function readFile(f,maxSide){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const s=Math.min(1,maxSide/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*s);
        c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const d=c.toDataURL('image/jpeg',0.88);
        res({u:d,d:d});
      };
      im.onerror=()=>res(null);
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
}

  const p=state.activeProject;
  if(!p||!p.genreId)return;

function loadProject(mode,genreId){
  try{
    const raw=localStorage.getItem((mode==='bd'?BD_STORAGE:ROMAN_STORAGE)+genreId);
    if(!raw)return null;

    return parsed;
  }catch(e){return null}

function listProjects(){
  const out=[];
  const all=[['roman',GENRES_ROMAN,ROMAN_STORAGE],['bd',GENRES_BD,BD_STORAGE]];
  all.forEach(([mode,genres,prefix])=>{
    genres.forEach(g=>{
      try{
        const raw=localStorage.getItem(prefix+g.id);
        if(raw){
          const p=JSON.parse(raw);
          out.push(p);
        }
      }catch(e){}
    });
  });
  return out.sort((a,b)=>b.updated-a.updated);
}

  const key=state.activeProject.mode==='bd'?'pages':'chapters';
  return state.activeProject[key].find(c=>c.id===id);
}
function findCase(caseId){
  const chapters=state.activeProject.mode==='bd'?state.activeProject.pages:state.activeProject.chapters;
  for(const ch of chapters){
    const arr=state.activeProject.mode==='bd'?ch.cases:ch.illustrations;

    if(found)return {case:found,chapter:ch};
  }

}

  const list=project.mode==='bd'?GENRES_BD:GENRES_ROMAN;

/* ═════════════════════════════════════════════════════════════════════
   PIPELINE — PLAN
   ═════════════════════════════════════════════════════════════════════ */
async function generatePlan(){
  const p=state.activeProject;
  if(!p.idea||p.idea.trim().length<10)throw new Error('Idée trop courte (10 caractères min)');
  const genre=genreOf(p);
  const prompt=buildPlanPrompt(p.idea,genre,p.mode);
  const raw=await chat(
    'Tu es scénariste. Tu réponds UNIQUEMENT en JSON valide strict.',
    prompt,6000,0.8
  );
  const plan=J(raw);
  if(!plan||!plan.protagonists||!Array.isArray(plan.protagonists))throw new Error('Plan invalide');
  // Normalise
  p.title=plan.title||'Sans titre';
  p.logline=plan.logline||'';
  p.universe=plan.universe||'';
  p.protagonists=plan.protagonists.slice(0,4).map(pt=>({
    id:pt.id||uid(),
    name:pt.name||'?',
    role:pt.role||'protagoniste',
    personality:pt.personality||'',
    appearance:pt.appearance||{
      face:'',hair:'',eyes:'',build:'',outfit:'',accessories:'',
      signature_colors:[]
    },
    sheet:null,sheetStatus:'pending'
  }));
  const chapterKey=p.mode==='bd'?'pages':'chapters';
  const rawList=p.mode==='bd'?plan.pages:plan.chapters;
  if(!rawList||!rawList.length)throw new Error('Structure de chapitres/planches manquante');
  p[chapterKey]=rawList.slice(0,4).map(c=>({
    id:uid(),
    number:c.number||1,
    title:c.title||'',
    summary:c.summary||'',
    key_emotional_beat:c.key_emotional_beat||'',
    narrative:p.mode==='bd'?'':(c.narrative||''),
    dialogue:[],
    [p.mode==='bd'?'cases':'illustrations']:[],
    status:'pending'
  }));
  saveProject();
  log('ok','Plan généré : « '+p.title+' » · '+p.protagonists.length+' protag. · '+p[chapterKey].length+(p.mode==='bd'?' planches':' chapitres'));
}

/* ═════════════════════════════════════════════════════════════════════
   PIPELINE — CHARACTER SHEETS
   ═════════════════════════════════════════════════════════════════════ */
async function generateCharacterSheets(){
  const p=state.activeProject;
  const genre=genreOf(p);
  for(let i=0;i<p.protagonists.length;i++){
    if(state.stopRequested)break;
    const pr=p.protagonists[i];
    if(pr.sheet&&pr.sheet.u)continue;
    pr.sheetStatus='generating';
    renderAll();
    try{
      const prompt=buildCharacterSheetPrompt(pr,genre,p.mode);
      const img=await mkImg(prompt,[],p.mode==='bd'?'4:3':'3:4');
      pr.sheet=img;
      pr.sheetStatus='done';
      log('ok','Character sheet '+pr.name+' prêt');
    }catch(e){
      if(e.message==='stop')break;
      pr.sheetStatus='error';
      log('er','Character sheet '+pr.name+' : '+e.message);
    }
    saveProject();
    renderAll();
    if(i<p.protagonists.length-1)await sleep(1500);
  }
}

/* ═════════════════════════════════════════════════════════════════════
   PIPELINE — CHAPITRES / PLANCHES
   ═════════════════════════════════════════════════════════════════════ */
async function generateChapters(){
  const p=state.activeProject;
  const genre=genreOf(p);
  const key=p.mode==='bd'?'pages':'chapters';
  const chapters=p[key];
  const planSnapshot={
    title:p.title,
    universe:p.universe,
    protagonists:p.protagonists.map(pr=>({
      id:pr.id,name:pr.name,role:pr.role,personality:pr.personality,appearance:pr.appearance
    }))
  };
  for(let ci=0;ci<chapters.length;ci++){
    if(state.stopRequested)break;
    const ch=chapters[ci];
    if(ch.status==='done')continue;
    ch.status='writing';
    renderAll();
    try{
      if(p.mode==='roman'){
        const prev=chapters.slice(0,ci);
        const prompt=buildRomanChapterPrompt(planSnapshot,ch,ci+1,prev,genre);
        const raw=await chat('Tu es romancier. Tu réponds UNIQUEMENT en JSON valide strict.',prompt,3500,0.8);
        const data=J(raw);
        if(!data||!data.narrative)throw new Error('JSON chapitre invalide');
        ch.narrative=data.narrative;
        ch.dialogue=Array.isArray(data.dialogue)?data.dialogue:[];
        ch.illustrations=(data.illustrations||[]).slice(0,3).map((ill,ii)=>({
          id:uid(),
          index:ii,
          prompt:ill.prompt||'',
          characters_present:Array.isArray(ill.characters_present)?ill.characters_present:[],
          image:null,status:'pending'
        }));
      } else {
        const prev=chapters.slice(0,ci);
        const prompt=buildBDPagePrompt(planSnapshot,ch,ci+1,prev,genre);
        const raw=await chat('Tu es scénariste BD. Tu réponds UNIQUEMENT en JSON valide strict.',prompt,3500,0.8);
        const data=J(raw);
        if(!data||!Array.isArray(data.cases))throw new Error('JSON planche invalide');
        ch.cases=data.cases.slice(0,4).map((c,ci2)=>({
          id:uid(),
          index:c.index||(ci2+1),
          framing:c.framing||'medium',
          action:c.action||'',
          characters_present:Array.isArray(c.characters_present)?c.characters_present:[],
          dialogue:Array.isArray(c.dialogue)?c.dialogue:[],
          prompt:c.prompt||'',
          image:null,status:'pending'
        }));
      }
      ch.status='done';
      saveProject();
      log('ok',(p.mode==='bd'?'Planche ':'Chapitre ')+(ci+1)+' prêt(e)');
    }catch(e){
      if(e.message==='stop')break;
      ch.status='error';
      log('er','Chapitre '+(ci+1)+' : '+e.message);
    }
    renderAll();
    if(ci<chapters.length-1)await sleep(1500);
  }
}

/* ═════════════════════════════════════════════════════════════════════
   PIPELINE — ILLUSTRATIONS / CASES
   ═════════════════════════════════════════════════════════════════════ */
async function generateIllustrations(){
  const p=state.activeProject;
  const genre=genreOf(p);
  const key=p.mode==='bd'?'pages':'chapters';
  const listKey=p.mode==='bd'?'cases':'illustrations';
  const planSnapshot={
    title:p.title,universe:p.universe,
    protagonists:p.protagonists.map(pr=>({id:pr.id,name:pr.name,appearance:pr.appearance}))
  };
  // Étape 1 : récupérer les refs des persos (data URI)
  const protagRefs={};
  for(const pr of p.protagonists){
    if(pr.sheet){
      protagRefs[pr.id]=await ensureRef(pr.sheet);
    }
  }
  // Étape 2 : générer chaque item
  for(let ci=0;ci<p[key].length;ci++){
    const ch=p[key][ci];
    const items=ch[listKey]||[];
    for(let ii=0;ii<items.length;ii++){
      if(state.stopRequested)break;
      const it=items[ii];
      if(it.image&&it.image.u)continue;
      it.status='loading';
      renderAll();
      try{
        let prompt;
        let ratio;
        if(p.mode==='roman'){
          prompt=buildIllustrationPrompt(it,ch,planSnapshot,genre);
          ratio='9:16';
        } else {
          prompt=buildBDPanelPrompt(it,ch,planSnapshot,genre);
          ratio='4:3';
        }
        // Refs : personnages présents (dans l'ordre), scène en dernier
        const refUris=[];
        (it.characters_present||[]).forEach(id=>{
          if(protagRefs[id])refUris.push(protagRefs[id]);
        });
        const img=await mkImg(prompt,refUris,ratio);
        it.image=img;
        it.status='done';
        log('ok',(p.mode==='bd'?'Case':'Illustration')+' '+ch.number+'.'+it.index+' ✓ ('+refUris.length+' refs)');
      }catch(e){
        if(e.message==='stop')break;
        it.status='error';
        log('er','Image '+ch.number+'.'+it.index+' : '+e.message);
      }
      saveProject();
      renderAll();
      if(ii<items.length-1)await sleep(1500);
    }
  }
}

/* ═════════════════════════════════════════════════════════════════════
   LANCER LE PIPELINE COMPLET
   ═════════════════════════════════════════════════════════════════════ */
async function runFullPipeline(){
  if(state.isRunning)return;
  if(!hasKey()){toast('Ajoutez au moins une clé API');return}
  const p=state.activeProject;
  if(!p||!p.genreId){toast('Choisissez un tiroir');return}
  state.isRunning=true;
  state.stopRequested=false;
  updateButtons();
  try{
    log('in','────── Génération '+(p.mode==='bd'?'BD':'roman')+' ──────');
    toast('Plan…');
    await generatePlan();
    toast('Character sheets…');
    await generateCharacterSheets();
    toast(p.mode==='bd'?'Planches…':'Chapitres…');
    await generateChapters();
    toast('Illustrations…');
    await generateIllustrations();
    toast('✦ Terminé ✦');
    log('ok','Génération complète terminée');
  }catch(e){
    if(e.message==='stop'){log('wr','Arrêt demandé');toast('Arrêté')}
    else{log('er',e.message);toast('Erreur : '+e.message.slice(0,60))}
  }
  state.isRunning=false;
  state.stopRequested=false;
  saveProject();
  renderAll();
  updateButtons();
}

/* ═════════════════════════════════════════════════════════════════════
   PLAYER
   ═════════════════════════════════════════════════════════════════════ */
function speak(text){
  if(!state.voiceEnabled)return;
  if(!('speechSynthesis' in window))return;
  if(!text)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='fr-FR';
    u.rate=0.97;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeech(){try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}

async function playNovel(){
  const p=state.activeProject;
  if(p.mode!=='roman')return;
  const chapters=p.chapters.filter(c=>c.status==='done');
  if(!chapters.length){toast('Aucun chapitre prêt');return}
  state.isPlaying=true;
  $('#pl').classList.add('on');
  const img=$('#pi');
  const sub=$('#sub');
  img.style.display='block';
  for(let ci=0;ci<chapters.length;ci++){
    if(!state.isPlaying)break;
    const ch=chapters[ci];
    const illList=(ch.illustrations||[]).filter(i=>i.status==='done');
    const fullText=(ch.narrative||'')+' '+((ch.dialogue||[]).map(d=>d.line).join('. '));
    speak(fullText);
    for(let ii=0;ii<illList.length;ii++){
      if(!state.isPlaying)break;
      const ill=illList[ii];
      img.src=ill.image.u;
      sub.innerHTML='<b>Chapitre '+ch.number+'</b> — '+esc(ch.title)+'<br><small>'+esc(ch.narrative.slice(0,120))+'…</small>';
      const w=(ch.narrative||'').split(/\s+/).length;
      const dur=Math.max(3000,Math.min(8000,(w*80)/Math.max(1,illList.length)));
      await sleep(dur);
    }
  }
  stopPlay();
}
async function playBD(){
  const p=state.activeProject;
  if(p.mode!=='bd')return;
  const pages=p.pages.filter(pg=>pg.status==='done');
  if(!pages.length){toast('Aucune planche prête');return}
  state.isPlaying=true;
  $('#pl').classList.add('on');
  const img=$('#pi');
  const sub=$('#sub');
  img.style.display='block';
  for(let pi=0;pi<pages.length;pi++){
    if(!state.isPlaying)break;
    const pg=pages[pi];
    const cases=(pg.cases||[]).filter(c=>c.status==='done');
    for(let ci=0;ci<cases.length;ci++){
      if(!state.isPlaying)break;
      const c=cases[ci];
      img.src=c.image.u;
      const dialogueText=(c.dialogue||[]).map(d=>d.speaker+' dit : '+d.line).join('. ');
      if(dialogueText)speak(dialogueText);
      sub.innerHTML='<b>Planche '+pg.number+'</b> — Case '+(ci+1)+'/'+cases.length
        +(dialogueText?'<br><small>'+esc(dialogueText)+'</small>':'');
      await sleep(Math.max(3500,Math.min(7000,(c.dialogue||[]).reduce((a,d)=>a+d.line.length,0)*60+2000)));
    }
  }
  stopPlay();
}
function stopPlay(){
  state.isPlaying=false;
  stopSpeech();
  $('#pl').classList.remove('on');
  if(state.activeProject)renderAll();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  const a=b.dataset.a;
  if(a==='con'){$('#con').classList.toggle('on');return}
  if(a==='sess'){showSessions();return}
  if(a==='savekeys'){
    const raw=$('#keys').value||'';
    const keys=raw.split(/\r?\n/).map(s=>s.trim()).filter(s=>s.length>=8);
    state.apiKeys=keys.map(k=>({k:k,img:0,txt:0,cool:0,off:false}));
    saveKeys();
    toast(keys.length+' clé(s) enregistrée(s)');
    log('ok',keys.length+' clé(s) chargée(s)');
    renderApp();
    return;
  }
  if(a==='open-drawer'){
    const mode=b.dataset.mode;
    const genreId=b.dataset.genre;
    let project=loadProject(mode,genreId);
    if(!project){
      project=mode==='bd'?newBD():newRoman();
      project.genreId=genreId;
    }
    state.activeProject=project;
    renderApp();
    return;
  }
  if(a==='delete-drawer'){
    if(!confirm('Vider complètement ce tiroir ?'))return;
    deleteProject(b.dataset.mode,b.dataset.genre);
    if(state.activeProject&&state.activeProject.genreId===b.dataset.genre){
      state.activeProject=null;
    }
    renderApp();
    return;
  }
  if(a==='run'){runFullPipeline();return}
  if(a==='stop'){state.stopRequested=true;toast('Arrêt en cours…');return}
  if(a==='play'){
    if(state.activeProject.mode==='bd')playBD();
    else playNovel();
    return;
  }
  if(a==='stopplay'){stopPlay();return}
  if(a==='regen-sheet'){
    const id=b.dataset.id;
    const pr=findProtagonist(id);
    if(pr){pr.sheet=null;pr.sheetStatus='pending';renderApp();toast('Sheet réinitialisé — relancez la génération')}
    return;
  }
  if(a==='regen-item'){
    const id=b.dataset.id;
    const found=findCase(id);
    if(found){found.case.image=null;found.case.status='pending';renderApp();toast('Image réinitialisée — relancez la génération')}
    return;
  }
});
