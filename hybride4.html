<script>
const FAL_PROXY = 'https://fal-proxy-bwph.onrender.com';
const REPLICATE_PROXY = 'https://replicate-proxy-6eab.onrender.com';
const AGNES_API = 'https://apihub.agnes-ai.com/v1';
const AGNES_POLL = 'https://apihub.agnes-ai.com/agnesapi';
const AGNES_MODEL = 'agnes-video-v2.0';
const FAL_MODEL = 'fal-ai/minimax/video-01';
const REPLICATE_MODEL = 'minimax/video-01';
const API_KEY_STORE = 'agnes_api_key';

const POLL_INTERVAL = 2;
const MAX_POLL = 70;

const AGNES_TIMEOUT = 600;
const FAL_TIMEOUT = 360;
const REPLICATE_TIMEOUT = 360;

const state = { mode:'txt', image:null, running:false, stop:false, strategy:'fal' };

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalizeStatus = v => String(v ?? 'unknown').toLowerCase();
const progressFrom = d => {
  const val = Number(d?.progress ?? d?.percent ?? d?.percentage ?? d?.internal_progress ?? d?.completion ?? 0);
  if (!Number.isFinite(val)) return 0;
  return Math.max(0, Math.min(100, val));
};

let toastT;
function toast(msg, type='success') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast';
  void t.offsetWidth;
  t.classList.add(type, 'visible');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('visible'), 3000);
}
function setStatus(text) {
  const s = $('status'), st = $('status-text');
  if (text) { s.classList.add('visible'); st.textContent = text; }
  else s.classList.remove('visible');
}

const logLines = [];
function logTime() {
  const d = new Date();
  return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
}
function addLog(msg, type='info') {
  logLines.push({ time: logTime(), msg, type });
  if (logLines.length > 300) logLines.shift();
  renderLogs();
}
function renderLogs() {
  const el = $('console-log');
  if (!el) return;
  if (logLines.length === 0) {
    el.innerHTML = '<div class="console-empty">En attente…</div>';
    return;
  }
  el.innerHTML = logLines.map(l =>
    '<div class="log-line"><span class="log-time">[' + l.time + ']</span><span class="log-msg log-' + l.type + '">' + esc(l.msg) + '</span></div>'
  ).join('');
  el.scrollTop = el.scrollHeight;
}
function clearLogs() {
  logLines.length = 0;
  renderLogs();
  updateProgress(0);
  addLog('Console effacée', 'dim');
}
function updateProgress(p) {
  const el = $('progress-fill');
  if (el) el.style.width = Math.max(0, Math.min(100, p)) + '%';
}
function updateConsoleState(t, live=false) {
  $('console-state').textContent = t;
  $('live-dot').style.display = live ? 'inline-block' : 'none';
}

async function wakeLock() {
  try {
    if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
  } catch(e) {}
}

function getKey() {
  try { return (localStorage.getItem(API_KEY_STORE) || '').trim(); } catch(e) { return ''; }
}
function saveKey() {
  const input = $('agnes-key');
  let k = String(input.value || '').trim()
    .replace(/^["']|["']$/g, '')
    .replace(/^Bearer\s+/i, '')
    .replace(/\s+/g, '');

  if (!k) {
    try { localStorage.removeItem(API_KEY_STORE); } catch(e) {}
    refreshKeyUI();
    toast('Clé supprimée', 'error');
    return;
  }

  try {
    localStorage.setItem(API_KEY_STORE, k);
    input.value = k;
    refreshKeyUI();
    toast('Clé Agnes ✓');
    addLog('Clé Agnes enregistrée', 'success');
  } catch(e) {
    toast('Erreur', 'error');
  }
}

function refreshKeyUI() {
  const k = getKey();
  const panel = $('panel-agnes');
  if (panel) {
    if (k) panel.classList.add('complete');
    else panel.classList.remove('complete');
  }

  if (k) {
    $('agnes-badge').textContent = '✓ Prêt';
    $('agnes-badge').className = 'panel-badge badge-green';
    $('agnes-key').value = k;
    $('agnes-status').className = 'key-status ok';
    $('agnes-status').innerHTML = '<span class="dot"></span><span>✓ ' + k.slice(0,10) + '…' + k.slice(-4) + '</span>';
  } else {
    $('agnes-badge').textContent = 'Optionnel';
    $('agnes-badge').className = 'panel-badge badge-gray';
    $('agnes-key').value = '';
    $('agnes-status').className = 'key-status';
    $('agnes-status').innerHTML = '<span class="dot"></span><span>Aucune clé (fallback désactivé)</span>';
  }
  updateGo();
}

function fileToDataUri(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

async function handleImageFile(file) {
  if (!file.type.startsWith('image/')) return;
  try {
    state.image = { dataUri: await fileToDataUri(file) };
    renderImagePreview();
    updateGo();
    addLog('Image chargée (' + Math.round(file.size/1024) + ' Ko)', 'success');
  } catch(e) {
    addLog('Erreur image', 'error');
  }
}

function renderImagePreview() {
  const c = $('image-preview-container');
  if (!state.image) { c.innerHTML = ''; return; }

  c.innerHTML = '<div class="image-preview"><img src="' + state.image.dataUri + '"><button class="remove-btn" id="remove-img">✕</button></div>';
  $('remove-img').onclick = () => {
    state.image = null;
    renderImagePreview();
    updateGo();
  };
}

async function generateWithFal(prompt, aspect, duration) {
  addLog('⚡ [fal.ai] Envoi via proxy Render…', 'gold');

  const body = { model: FAL_MODEL, prompt, aspect_ratio: aspect, duration };

  const r = await fetch(FAL_PROXY + '/v1/videos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!r.ok) {
    const err = await r.text();
    throw new Error('fal HTTP ' + r.status + ' : ' + err.slice(0,150));
  }

  const d = await r.json();
  const requestId = d.request_id;
  if (!requestId) throw new Error('Pas de request_id fal');

  addLog('⚡ [fal.ai] Tâche : ' + String(requestId).slice(0,14) + '…', 'success');

  const start = Date.now();
  for (let i = 0; i < MAX_POLL; i++) {
    if (state.stop) throw new Error('stop');

    const elapsed = Math.floor((Date.now()-start)/1000);
    if (elapsed > FAL_TIMEOUT) throw new Error('Timeout fal.ai (' + FAL_TIMEOUT + 's)');

    await sleep(POLL_INTERVAL * 1000);

    const sr = await fetch(FAL_PROXY + '/v1/videos/' + encodeURIComponent(requestId));
    const sd = await sr.json();
    const status = normalizeStatus(sd.status || sd.request_status || sd.state || sd.state_name || 'unknown');
    const progress = progressFrom(sd);

    addLog('⚡ [fal.ai] ' + status + ' · ' + progress + '% · ' + elapsed + 's', 'dim');
    updateProgress(progress);

    if (status === 'completed' || status === 'succeeded' || status === 'ok') {
      const videoUrl = (sd.video && sd.video.url) || sd.video_url || (sd.response && sd.response.video && sd.response.video.url);
      if (!videoUrl) throw new Error('Pas d\'URL fal');
      addLog('⚡ [fal.ai] ✅ Vidéo prête !', 'success');
      return videoUrl;
    }

    if (status === 'failed' || status === 'error' || status === 'cancelled' || status === 'canceled') {
      throw new Error('fal.ai a échoué');
    }
  }

  throw new Error('fal.ai timeout');
}

async function generateWithReplicate(prompt, aspect, duration) {
  addLog('🔥 [Replicate] Envoi via proxy Render…', 'gold');

  const numFrames = duration * 24;
  const body = {
    model: REPLICATE_MODEL,
    prompt,
    aspect_ratio: aspect,
    num_frames: numFrames,
    fps: 24
  };

  const r = await fetch(REPLICATE_PROXY + '/v1/videos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!r.ok) {
    const err = await r.text();
    throw new Error('Proxy HTTP ' + r.status + ' : ' + err.slice(0,150));
  }

  const d = await r.json();
  const id = d.id;
  if (!id) throw new Error('Pas d\'ID Replicate');

  addLog('🔥 [Replicate] Tâche : ' + String(id).slice(0,14) + '…', 'success');

  const start = Date.now();
  for (let i = 0; i < MAX_POLL; i++) {
    if (state.stop) throw new Error('stop');

    const elapsed = Math.floor((Date.now()-start)/1000);
    if (elapsed > REPLICATE_TIMEOUT) throw new Error('Timeout Replicate (' + REPLICATE_TIMEOUT + 's)');

    await sleep(POLL_INTERVAL * 1000);

    const sr = await fetch(REPLICATE_PROXY + '/v1/videos/' + encodeURIComponent(id));
    const sd = await sr.json();

    const status = normalizeStatus(sd.status || sd.state || sd.state_name || 'unknown');
    const progress = progressFrom(sd);

    addLog('🔥 [Replicate] ' + status + ' · ' + progress + '% · ' + elapsed + 's', 'dim');
    updateProgress(progress);

    if (status === 'succeeded' || status === 'completed' || status === 'done') {
      const url = sd.video_url || sd.output_url || sd.output?.url;
      if (!url) throw new Error('Pas d\'URL Replicate');
      addLog('🔥 [Replicate] ✅ Vidéo prête !', 'success');
      return url;
    }

    if (status === 'failed' || status === 'canceled' || status === 'cancelled') {
      throw new Error('Replicate ' + status);
    }
  }

  throw new Error('Replicate timeout');
}

async function generateWithAgnes(prompt, aspect, duration) {
  const key = getKey();
  if (!key) throw new Error('Pas de clé Agnes');

  addLog('💜 [Agnes] Envoi direct…', 'gold');

  const frames = duration === 5 ? 121 : (duration === 10 ? 241 : 153);
  const body = {
    model: AGNES_MODEL,
    prompt,
    num_frames: frames,
    frame_rate: 24,
    ratio: aspect,
    resolution: '480p'
  };

  const r = await fetch(AGNES_API + '/videos', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + key,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  if (!r.ok) {
    const err = await r.text();
    throw new Error('Agnes HTTP ' + r.status + ' : ' + err.slice(0,150));
  }

  const d = await r.json();
  const id = d.video_id || d.id || d.task_id || d.data?.video_id || d.data?.id || d.task?.id;
  if (!id) throw new Error('Pas de video_id Agnes');

  addLog('💜 [Agnes] Tâche : ' + String(id).slice(0,14) + '…', 'success');

  const start = Date.now();
  for (let i = 0; i < MAX_POLL; i++) {
    if (state.stop) throw new Error('stop');

    const elapsed = Math.floor((Date.now()-start)/1000);
    if (elapsed > AGNES_TIMEOUT) throw new Error('Timeout Agnes (' + AGNES_TIMEOUT + 's)');

    await sleep(POLL_INTERVAL * 1000);

    const url = AGNES_POLL + '?video_id=' + encodeURIComponent(id) + '&model_name=' + encodeURIComponent(AGNES_MODEL);
    const sr = await fetch(url, { headers: { 'Authorization': 'Bearer ' + key } });
    const sd = await sr.json();

    console.log('[Agnes status]', sd);

    const status = normalizeStatus(sd.status || sd.state || sd.state_name || sd.job_status || 'unknown');
    const progress = progressFrom(sd);

    addLog('💜 [Agnes] ' + status + ' · ' + progress + '% · ' + elapsed + 's', 'dim');
    updateProgress(progress);

    if (status === 'completed' || status === 'succeeded' || status === 'done' || status === 'success') {
      const videoUrl = (sd.metadata && sd.metadata.url) || sd.url || (sd.output && sd.output.url) || sd.result?.url || sd.data?.url;
      if (!videoUrl) throw new Error('Pas d\'URL Agnes');
      addLog('💜 [Agnes] ✅ Vidéo prête !', 'success');
      return videoUrl;
    }

    if (status === 'failed' || status === 'error' || status === 'cancelled' || status === 'canceled') {
      throw new Error('Agnes ' + status);
    }
  }

  throw new Error('Agnes timeout');
}

async function generateVideo(prompt, aspect, duration) {
  const providers = [];

  if (state.strategy === 'auto' || state.strategy === 'fal') {
    providers.push({ name: 'fal.ai', emoji: '⚡', fn: generateWithFal });
  }
  if (state.strategy === 'auto' || state.strategy === 'replicate') {
    providers.push({ name: 'Replicate', emoji: '🔥', fn: generateWithReplicate });
  }
  if ((state.strategy === 'auto' || state.strategy === 'agnes') && getKey()) {
    providers.push({ name: 'Agnes', emoji: '💜', fn: generateWithAgnes });
  }

  if (providers.length === 0) throw new Error('Aucun provider disponible');

  addLog('📋 Providers : ' + providers.map(p => p.emoji + ' ' + p.name).join(' → '), 'dim');

  for (const p of providers) {
    if (state.stop) throw new Error('stop');

    try {
      addLog('▶️ Tentative : ' + p.emoji + ' ' + p.name, 'gold');
      updateConsoleState('Génération via ' + p.name + '…', true);

      const url = await p.fn(prompt, aspect, duration);
      return { url, provider: p.name, emoji: p.emoji };
    } catch(e) {
      if (e.message === 'stop') throw e;

      addLog('❌ ' + p.name + ' échoué : ' + e.message, 'error');
      addLog('→ Bascule vers le provider suivant…', 'warn');
      updateProgress(0);
      await sleep(1500);
    }
  }

  throw new Error('Tous les providers ont échoué');
}

function updateGo() {
  const b = $('go-btn');
  const isTxt = state.mode === 'txt';
  const hasPrompt = isTxt
    ? $('prompt-input').value.trim().length > 0
    : ($('img-prompt-input').value.trim().length > 0 && state.image);

  b.disabled = !hasPrompt || state.running;

  if (state.running) b.textContent = '🎬 Génération en cours…';
  else if (!hasPrompt) b.textContent = isTxt ? 'Décrivez votre vidéo' : 'Chargez une image et décrivez le mouvement';
  else b.textContent = '🎬 Générer la vidéo';
}

function switchMode(mode) {
  state.mode = mode;
  $('tab-txt').classList.toggle('active', mode === 'txt');
  $('tab-img').classList.toggle('active', mode === 'img');
  $('panel-txt').style.display = (mode === 'txt') ? 'block' : 'none';
  $('panel-img').style.display = (mode === 'img') ? 'block' : 'none';
  updateGo();
}

function showResult(url, provider, emoji) {
  $('result-box').classList.add('visible');
  $('result-provider').textContent = emoji + ' ' + provider.toUpperCase();
  $('result-video').src = url;
  $('result-download').href = url;
  $('result-open').href = url;
}

const DEMO_TXT = "Un chat marchant dans un jardin ensoleillé avec des fleurs, cinématographique, qualité 4K";
const DEMO_IMG = "Anime doucement cette image, mouvement subtil, la lumière devient dorée";

async function start() {
  if (state.running) return;

  const isTxt = state.mode === 'txt';
  const prompt = isTxt ? $('prompt-input').value.trim() : $('img-prompt-input').value.trim();

  if (!prompt) {
    toast('Écrivez une description', 'error');
    return;
  }

  if (!isTxt && !state.image) {
    toast('Chargez une image', 'error');
    return;
  }

  const aspect = $('aspect-select').value;
  const duration = parseInt($('duration-select').value, 10);

  state.running = true;
  state.stop = false;

  updateProgress(0);
  updateConsoleState('Travail…', true);

  addLog('═══════════════════════════', 'gold');
  addLog('🚀 Nouvelle génération', 'gold');
  addLog('Mode : ' + (isTxt ? 'Texte → Vidéo' : 'Image → Vidéo') + ' · ' + aspect + ' · ' + duration + 's', 'info');
  addLog('═══════════════════════════', 'gold');

  $('result-box').classList.remove('visible');
  $('btn-stop').classList.add('visible');
  $('go-btn').disabled = true;
  await wakeLock();

  try {
    const r = await generateVideo(prompt, aspect, duration);
    showResult(r.url, r.provider, r.emoji);

    updateConsoleState('✅ Terminé via ' + r.provider, false);
    addLog('🎉 Succès via ' + r.emoji + ' ' + r.provider, 'success');
    toast('Vidéo générée ✓');
  } catch(e) {
    if (e.message !== 'stop') {
      addLog('❌ Échec total : ' + e.message, 'error');
      toast('Échec : ' + e.message, 'error');
      updateConsoleState('Échec', false);
    } else {
      addLog('⏹ Arrêté', 'warn');
      updateConsoleState('Arrêté', false);
    }
  }

  setStatus(null);
  state.running = false;
  state.stop = false;
  $('btn-stop').classList.remove('visible');
  updateGo();
}

function stopAll() {
  if (!state.running) return;
  state.stop = true;
  addLog('⏹ Arrêt…', 'warn');
  setStatus('Arrêt…');
}

(function init() {
  $('agnes-save').addEventListener('click', saveKey);
  $('agnes-key').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      saveKey();
    }
  });

  document.querySelectorAll('[data-toggle]').forEach(h =>
    h.addEventListener('click', () => $(h.dataset.toggle).classList.toggle('open'))
  );

  $('strategy-select').addEventListener('change', e => {
    state.strategy = e.target.value;
    const labels = { auto:'Auto', fal:'Fal', replicate:'Replicate', agnes:'Agnes' };
    $('strategy-badge').textContent = labels[state.strategy];
    addLog('Stratégie : ' + labels[state.strategy], 'dim');
  });

  $('strategy-select').value = state.strategy;
  $('strategy-badge').textContent = 'Fal';

  $('tab-txt').addEventListener('click', () => switchMode('txt'));
  $('tab-img').addEventListener('click', () => switchMode('img'));

  $('demo-btn').addEventListener('click', () => {
    $('prompt-input').value = DEMO_TXT;
    updateGo();
  });

  $('img-demo-btn').addEventListener('click', () => {
    $('img-prompt-input').value = DEMO_IMG;
    updateGo();
  });

  $('prompt-input').addEventListener('input', updateGo);
  $('img-prompt-input').addEventListener('input', updateGo);

  const uz = $('upload-zone'), fi = $('file-input');
  uz.addEventListener('click', () => fi.click());
  fi.addEventListener('change', e => {
    if (e.target.files[0]) handleImageFile(e.target.files[0]);
    fi.value = '';
  });

  $('go-btn').addEventListener('click', start);
  $('btn-stop').addEventListener('click', stopAll);
  $('console-clear').addEventListener('click', clearLogs);

  refreshKeyUI();
  renderLogs();
  updateGo();

  addLog('🎬 Studio Hybride 4.0 initialisé', 'success');
  addLog('⚡ fal.ai : ' + FAL_PROXY, 'dim');
  addLog('🔥 Replicate : ' + REPLICATE_PROXY, 'dim');
  addLog('💜 Agnes : ' + (getKey() ? '✓ configuré' : '✗ non configuré'), getKey() ? 'success' : 'dim');
  updateConsoleState('Prêt', false);
})();
</script>
