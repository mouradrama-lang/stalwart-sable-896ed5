<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Vidéo Simple</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a10;
      color: white;
      padding: 24px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: #14141d;
      border: 1px solid #2a2a36;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 8px;
      color: #b7b7c8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input, textarea, select, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2a2a36;
      background: #1b1b25;
      color: white;
      font-size: 14px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      background: linear-gradient(135deg, #d4a853, #f0d078);
      color: #111;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #1a1a22;
      border: 1px solid #2a2a36;
      font-size: 13px;
      color: #d9d9ea;
    }

    .result {
      display: none;
      margin-top: 16px;
      background: #12121a;
      border: 1px solid #d4a853;
      border-radius: 12px;
      padding: 12px;
    }

    .result.visible {
      display: block;
    }

    video {
      width: 100%;
      border-radius: 10px;
      margin-top: 12px;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <label for="strategy">Stratégie</label>
      <select id="strategy">
        <option value="fal" selected>fal.ai</option>
        <option value="agnes">Agnes</option>
      </select>
    </div>

    <div class="card">
      <label for="key">Clé Agnes</label>
      <input id="key" type="password" placeholder="sk-..." />
    </div>

    <div class="card">
      <label for="prompt">Description</label>
      <textarea id="prompt" placeholder="Ex: Un chat marchant dans un jardin ensoleillé, cinématographique"></textarea>
    </div>

    <div class="card">
      <label for="duration">Durée</label>
      <select id="duration">
        <option value="5" selected>5 secondes</option>
        <option value="6">6 secondes</option>
        <option value="10">10 secondes</option>
      </select>
    </div>

    <button id="generateBtn">Générer la vidéo</button>

    <div id="status" class="status">Prêt</div>

    <div id="result" class="result">
      <strong>Vidéo générée</strong>
      <video id="video" controls playsinline></video>
    </div>
  </div>

  <script>
    const FAL_PROXY = 'https://fal-proxy-bwph.onrender.com';
    const AGNES_API = 'https://apihub.agnes-ai.com/v1';
    const AGNES_POLL = 'https://apihub.agnes-ai.com/agnesapi';
    const AGNES_MODEL = 'agnes-video-v2.0';
    const FAL_MODEL = 'fal-ai/minimax/video-01';

    const keyInput = document.getElementById('key');
    const promptInput = document.getElementById('prompt');
    const durationInput = document.getElementById('duration');
    const strategyInput = document.getElementById('strategy');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const videoEl = document.getElementById('video');
    const btn = document.getElementById('generateBtn');

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    async function generateWithFal(prompt, duration) {
      setStatus('Fal.ai : envoi…');

      const body = {
        model: FAL_MODEL,
        prompt,
        duration,
        aspect_ratio: '9:16'
      };

      const res = await fetch(FAL_PROXY + '/v1/videos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      const requestId = data.request_id;
      if (!requestId) throw new Error('Pas de request_id fal');

      for (let i = 0; i < 40; i++) {
        await new Promise(r => setTimeout(r, 2000));
        const statusRes = await fetch(FAL_PROXY + '/v1/videos/' + encodeURIComponent(requestId));
        const statusData = await statusRes.json();

        setStatus('Fal.ai : ' + (statusData.status || 'en cours'));

        if (statusData.status === 'COMPLETED' || statusData.status === 'completed') {
          const url = statusData.video?.url || statusData.video_url;
          if (!url) throw new Error('URL fal introuvable');
          return url;
        }

        if (statusData.status === 'FAILED' || statusData.status === 'failed') {
          throw new Error('Fal.ai a échoué');
        }
      }

      throw new Error('Timeout fal.ai');
    }

    async function generateWithAgnes(prompt, duration) {
      const key = keyInput.value.trim();
      if (!key) throw new Error('Clé Agnes manquante');

      setStatus('Agnes : envoi…');

      const frames = duration === 5 ? 121 : (duration === 10 ? 241 : 153);
      const body = {
        model: AGNES_MODEL,
        prompt,
        num_frames: frames,
        frame_rate: 24,
        ratio: '9:16',
        resolution: '480p'
      };

      const res = await fetch(AGNES_API + '/videos', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + key,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error('Agnes HTTP ' + res.status + ' : ' + errText.slice(0, 150));
      }

      const data = await res.json();
      const id = data.video_id || data.id || data.task_id;
      if (!id) throw new Error('Pas d\'ID Agnes');

      for (let i = 0; i < 40; i++) {
        await new Promise(r => setTimeout(r, 2000));

        const pollUrl = AGNES_POLL + '?video_id=' + encodeURIComponent(id) + '&model_name=' + encodeURIComponent(AGNES_MODEL);
        const pollRes = await fetch(pollUrl, {
          headers: { 'Authorization': 'Bearer ' + key }
        });

        const pollData = await pollRes.json();
        const status = (pollData.status || pollData.state || 'unknown').toLowerCase();

        setStatus('Agnes : ' + status);

        if (status === 'completed' || status === 'succeeded' || status === 'done' || status === 'success') {
          const url = pollData.metadata?.url || pollData.url || pollData.output?.url || pollData.result?.url;
          if (!url) throw new Error('URL Agnes introuvable');
          return url;
        }

        if (status === 'failed' || status === 'error') {
          throw new Error('Agnes a échoué');
        }
      }

      throw new Error('Timeout Agnes');
    }

    btn.addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        setStatus('Écrivez une description');
        return;
      }

      const duration = Number(durationInput.value);
      const strategy = strategyInput.value;

      btn.disabled = true;
      setStatus('Début…');

      try {
        let url;

        if (strategy === 'fal') {
          url = await generateWithFal(prompt, duration);
        } else {
          url = await generateWithAgnes(prompt, duration);
        }

        videoEl.src = url;
        resultEl.classList.add('visible');
        setStatus('Vidéo prête');

      } catch (err) {
        console.error(err);
        setStatus(err.message || 'Erreur');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
