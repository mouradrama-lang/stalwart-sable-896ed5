<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agnes Video Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #090b12;
      color: white;
      padding: 24px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: #121722;
      border: 1px solid #2b3347;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b5bfd3;
      margin-bottom: 8px;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2d374d;
      background: #1a2233;
      color: white;
      font-size: 14px;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
    }
    button {
      background: linear-gradient(135deg, #d9af63, #f2d68a);
      color: #111;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #121722;
      border: 1px solid #2c384d;
      font-size: 14px;
      color: #dfe6f7;
    }
    .result {
      display: none;
      margin-top: 16px;
      background: #0f1420;
      border: 1px solid #d9af63;
      border-radius: 12px;
      padding: 12px;
    }
    .result.visible {
      display: block;
    }
    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <label for="key">Clé API Agnes</label>
      <input id="key" type="password" placeholder="sk-..." />
    </div>

    <div class="card">
      <label for="prompt">Description de la vidéo</label>
      <textarea id="prompt" placeholder="Ex: Un chat dans un jardin, lumière dorée, cinématographique"></textarea>
    </div>

    <div class="card">
      <label for="duration">Durée</label>
      <select id="duration">
        <option value="5" selected>5 secondes</option>
        <option value="6">6 secondes</option>
        <option value="10">10 secondes</option>
      </select>
    </div>

    <button id="generateBtn">Générer la vidéo</button>
    <div id="status" class="status">Prêt</div>

    <div class="result" id="resultBox">
      <strong>Vidéo générée</strong>
      <video id="video" controls playsinline></video>
    </div>
  </div>

  <script>
    const AGNES_API = 'https://apihub.agnes-ai.com/v1';
    const AGNES_POLL = 'https://apihub.agnes-ai.com/agnesapi';
    const AGNES_MODEL = 'agnes-video-v2.0';
    const KEY_STORAGE = 'agnes_key';

    const keyInput = document.getElementById('key');
    const promptInput = document.getElementById('prompt');
    const durationInput = document.getElementById('duration');
    const generateBtn = document.getElementById('generateBtn');
    const statusEl = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const videoEl = document.getElementById('video');

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function loadKey() {
      const key = localStorage.getItem(KEY_STORAGE) || '';
      keyInput.value = key;
    }

    function saveKey() {
      const key = keyInput.value.trim();
      if (key) {
        localStorage.setItem(KEY_STORAGE, key);
      }
    }

    function getKey() {
      return keyInput.value.trim();
    }

    async function generateWithAgnes(prompt, duration) {
      const key = getKey();
      if (!key) throw new Error('Clé Agnes manquante');

      saveKey();

      const frames = duration === 5 ? 121 : (duration === 10 ? 241 : 153);
      const body = {
        model: AGNES_MODEL,
        prompt,
        num_frames: frames,
        frame_rate: 24,
        ratio: '9:16',
        resolution: '480p'
      };

      setStatus('Agnes : envoi…');

      const res = await fetch(AGNES_API + '/videos', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + key,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error('Agnes HTTP ' + res.status + ' : ' + text.slice(0, 200));
      }

      const data = await res.json();
      const id = data.video_id || data.id || data.task_id || data.data?.video_id || data.data?.id || data.task?.id;

      if (!id) {
        throw new Error('Aucune video_id reçue de Agnes');
      }

      setStatus('Agnes : en attente de génération…');

      for (let i = 0; i < 40; i++) {
        await new Promise(r => setTimeout(r, 2000));

        const pollUrl = AGNES_POLL + '?video_id=' + encodeURIComponent(id) + '&model_name=' + encodeURIComponent(AGNES_MODEL);

        const pollRes = await fetch(pollUrl, {
          headers: {
            'Authorization': 'Bearer ' + key
          }
        });

        const pollData = await pollRes.json();

        const state = (pollData.status || pollData.state || pollData.job_status || 'unknown').toLowerCase();
        setStatus('Agnes : ' + state);

        const url =
          pollData.metadata?.url ||
          pollData.url ||
          pollData.output?.url ||
          pollData.result?.url ||
          pollData.data?.url;

        if (state === 'completed' || state === 'succeeded' || state === 'done' || state === 'success') {
          if (!url) throw new Error('URL vidéo introuvable dans la réponse Agnes');
          return url;
        }

        if (state === 'failed' || state === 'error' || state === 'cancelled' || state === 'canceled') {
          throw new Error('Agnes a échoué : ' + state);
        }
      }

      throw new Error('Timeout Agnes');
    }

    generateBtn.addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        setStatus('Écrire une description');
        return;
      }

      const duration = Number(durationInput.value);

      generateBtn.disabled = true;

      try {
        const url = await generateWithAgnes(prompt, duration);
        videoEl.src = url;
        resultBox.classList.add('visible');
        setStatus('Vidéo prête');
      } catch (err) {
        console.error(err);
        setStatus(err.message || 'Erreur');
      } finally {
        generateBtn.disabled = false;
      }
    });

    loadKey();
  </script>
</body>
</html>
