<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CinéForge v4.0 — Sauvegarde auto</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#08080c;--panel:#111118;--panel-2:#181822;--panel-3:#1e1e2c;--border:#252535;--ink:#f0f0f5;--ink-dim:#8888a0;--ink-faint:#555565;--gold:#d4a853;--gold-2:#f0d078;--green:#4ec97a;--red:#ff5a5a;--orange:#ff9d3d;--cyan:#00d9ff}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:0 0 6rem;font-size:14px;line-height:1.5;max-width:680px;margin:0 auto;background-image:radial-gradient(ellipse at 15% 0%,rgba(212,168,83,0.06) 0%,transparent 50%),radial-gradient(ellipse at 85% 100%,rgba(168,85,247,0.05) 0%,transparent 50%);background-attachment:fixed}
header{text-align:center;padding:1.5rem 1rem 1rem;border-bottom:1px solid var(--border)}
.badge{display:inline-flex;align-items:center;gap:0.4rem;padding:0.25rem 0.7rem;border-radius:20px;background:rgba(212,168,83,0.12);border:1px solid #8b7535;font-size:0.6rem;font-weight:800;color:var(--gold);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.7rem}
.badge .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
h1{font-size:1.7rem;font-weight:900;letter-spacing:-0.04em;background:linear-gradient(135deg,#fff 0%,var(--gold) 40%,var(--gold-2) 70%,#fff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.25rem}
.subtitle{font-size:0.72rem;color:var(--ink-dim)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:1rem;margin:0.7rem 0.8rem}
.panel-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;margin-bottom:0.7rem}
.panel-header.no-toggle{cursor:default}
.panel-title{display:flex;align-items:center;gap:0.55rem;font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em}
.panel-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:0.95rem;background:linear-gradient(135deg,#6b35ff,#b47cff)}
.panel-icon.gold{background:linear-gradient(135deg,var(--gold),var(--gold-2))}
.panel-icon.cyan{background:linear-gradient(135deg,#0099cc,var(--cyan))}
.panel-icon.green{background:linear-gradient(135deg,#2d8a4e,var(--green))}
.panel-badge{font-size:0.58rem;padding:0.15rem 0.5rem;border-radius:10px;font-weight:800}
.badge-gray{background:var(--ink-faint);color:#fff}
.badge-green{background:var(--green);color:#0a0a0f}
.badge-gold{background:var(--gold);color:#0a0a0f}
.panel-chevron{font-size:0.65rem;color:var(--ink-faint);transition:transform 0.25s}
.panel.open .panel-chevron{transform:rotate(180deg)}
.panel-body{max-height:0;overflow:hidden;transition:max-height 0.4s ease}
.panel.open .panel-body{max-height:10000px}
.field{margin-bottom:0.8rem}.field:last-child{margin-bottom:0}
.field-label{display:block;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-dim);font-weight:700;margin-bottom:0.4rem}
.field-hint{font-size:0.65rem;color:var(--ink-faint);margin-top:0.3rem;line-height:1.4;font-style:italic}
input,textarea,select{width:100%;padding:0.7rem 0.85rem;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--ink);font-family:inherit;font-size:0.82rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,168,83,0.12)}
textarea{min-height:80px;resize:vertical;line-height:1.45}
select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23d4a853' d='M6 8L0 0h12z'/></svg>");background-repeat:no-repeat;background-position:right 0.9rem center;background-size:11px;padding-right:2.4rem}
.genre-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem}
.genre-card{position:relative;padding:0.7rem 0.5rem;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);cursor:pointer;text-align:center;transition:all 0.2s}
.genre-card.selected{border-color:var(--gold);background:linear-gradient(135deg,rgba(212,168,83,0.12),rgba(212,168,83,0.04))}
.genre-card.selected::after{content:'✓';position:absolute;top:4px;right:6px;font-size:0.6rem;color:var(--gold);font-weight:900}
.genre-emoji{font-size:1.3rem;display:block;margin-bottom:0.2rem}
.genre-name{font-size:0.65rem;font-weight:700}
.preset-row{display:flex;gap:0.4rem;overflow-x:auto;padding-bottom:0.3rem;scrollbar-width:none}
.preset-row::-webkit-scrollbar{display:none}
.preset-chip{flex-shrink:0;padding:0.5rem 0.8rem;border-radius:20px;border:1px solid var(--border);background:var(--panel-2);font-size:0.68rem;font-weight:700;color:var(--ink-dim);cursor:pointer;white-space:nowrap}
.preset-chip.selected{border-color:var(--gold);background:rgba(212,168,83,0.12);color:var(--gold)}
.scene-card{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:0.8rem;margin-bottom:0.6rem;position:relative}
.scene-card-header{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem}
.scene-number{width:24px;height:24px;border-radius:6px;background:var(--gold);color:#0a0a0f;font-size:0.65rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scene-title-input{flex:1;background:transparent;border:none;color:var(--ink);font-size:0.78rem;font-weight:700;font-family:inherit;padding:0.2rem 0}
.scene-title-input:focus{outline:none;border-bottom:1px solid var(--gold)}
.scene-remove{background:transparent;border:none;color:var(--ink-faint);font-size:0.85rem;cursor:pointer;padding:0.2rem}
.scene-textarea{width:100%;min-height:60px;padding:0.6rem;border-radius:8px;border:1px solid var(--border);background:var(--panel-3);color:var(--ink);font-family:inherit;font-size:0.75rem;line-height:1.45;resize:vertical}
.scene-textarea:focus{outline:none;border-color:var(--gold)}
.scene-meta{display:flex;gap:0.4rem;margin-top:0.5rem;flex-wrap:wrap}
.scene-meta select{padding:0.35rem 0.6rem;font-size:0.65rem;border-radius:6px;flex:1;min-width:0}
.btn-go{display:flex;align-items:center;justify-content:center;gap:0.5rem;width:calc(100% - 1.6rem);margin:0.8rem auto;padding:1.1rem;border-radius:14px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-2),var(--gold));background-size:200% 200%;color:#0a0a0f;font-size:0.95rem;font-weight:900;font-family:inherit;cursor:pointer;box-shadow:0 8px 30px rgba(212,168,83,0.3)}
.btn-go:disabled{opacity:0.3;cursor:not-allowed}
.btn-reset{width:calc(100% - 1.6rem);margin:0 auto 1rem;padding:0.65rem;border-radius:12px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:0.78rem;font-weight:700;font-family:inherit;cursor:pointer;display:block}
.console-panel{background:#050508;border:1px solid var(--border);border-radius:10px;padding:0.75rem;margin-top:0.5rem;font-family:ui-monospace,monospace;font-size:0.64rem;line-height:1.5;max-height:250px;overflow-y:auto}
.console-empty{color:var(--ink-faint);font-style:italic;text-align:center;padding:0.7rem;font-size:0.68rem}
.log-line{display:flex;gap:0.35rem;padding:0.08rem 0}
.log-time{color:var(--ink-faint);flex-shrink:0;font-size:0.6rem}
.log-msg{flex:1;word-break:break-word}
.log-info{color:var(--cyan)}.log-warn{color:var(--orange)}.log-success{color:var(--green)}.log-error{color:var(--red)}.log-dim{color:var(--ink-dim)}.log-gold{color:var(--gold)}
.console-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.35rem;padding-bottom:0.3rem;border-bottom:1px solid var(--border)}
.console-title{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold);font-weight:800}
.console-clear{background:transparent;border:1px solid var(--border);color:var(--ink-dim);padding:0.12rem 0.4rem;border-radius:6px;font-size:0.55rem;cursor:pointer;font-weight:700}
.result-box{display:none;padding:0.9rem;border-radius:14px;background:var(--panel);border:1px solid var(--gold);margin:0.7rem 0.8rem}
.result-box.visible{display:block}
.result-box video{width:100%;border-radius:10px;aspect-ratio:9/16;object-fit:cover;background:#000;max-height:50vh}
.save-info{font-size:0.65rem;color:var(--green);text-align:center;padding:0.5rem;font-style:italic}
</style>
</head>
<body>

<header>
<div class="badge"><span class="dot"></span> CinéForge v4.0</div>
<h1>🎬 CinéForge Studio</h1>
<p class="subtitle">Sauvegarde automatique ✨</p>
<div class="save-info" id="save-info">✓ Prêt</div>
</header>

<!-- CLÉ API -->
<div class="panel open">
<div class="panel-header" data-toggle="p1">
<div class="panel-title"><div class="panel-icon">💜</div>Clé API Agnes</div>
<div class="panel-badge badge-gray" id="api-badge">Non configuré</div>
<div class="panel-chevron">▼</div>
</div>
<div class="panel-body" id="p1">
<div class="field">
<input type="password" id="api-key" placeholder="sk-...">
<button style="width:100%;padding:0.7rem;margin-top:0.5rem;border-radius:10px;border:none;background:var(--gold);color:#0a0a0f;font-weight:800;cursor:pointer" id="api-save">💾 Enregistrer</button>
</div>
</div>
</div>

<!-- TITRE -->
<div class="panel open">
<div class="panel-header no-toggle">
<div class="panel-title"><div class="panel-icon gold">🎬</div>Film</div>
</div>
<div class="panel-body" style="max-height:none">
<div class="field">
<label class="field-label">Titre du film</label>
<input type="text" id="film-title" placeholder="Ex: L'Amour Peint">
</div>
<div class="field">
<label class="field-label">Genre</label>
<div class="genre-grid" id="genre-grid"></div>
</div>
<div class="field">
<label class="field-label">Sous-genre / Thème</label>
<input type="text" id="subgenre" placeholder="Ex: Amour perdu, peinture, mémoire...">
</div>
</div>
</div>

<!-- STYLE -->
<div class="panel open">
<div class="panel-header" data-toggle="p2">
<div class="panel-title"><div class="panel-icon cyan">🎨</div>Style visuel</div>
<div class="panel-chevron">▼</div>
</div>
<div class="panel-body" id="p2">
<div class="field">
<label class="field-label">Esthétique</label>
<div class="preset-row" id="aesthetic-row"></div>
</div>
<div class="field">
<label class="field-label">Éclairage</label>
<div class="preset-row" id="lighting-row"></div>
</div>
<div class="field">
<label class="field-label">Palette</label>
<div class="preset-row" id="palette-row"></div>
</div>
</div>
</div>

<!-- SCÈNES -->
<div class="panel open">
<div class="panel-header no-toggle">
<div class="panel-title"><div class="panel-icon gold">📋</div>Scènes</div>
<button class="console-clear" id="add-scene-btn" style="border-color:var(--gold);color:var(--gold)">＋ Ajouter</button>
</div>
<div class="panel-body" style="max-height:none">
<div id="scenes-list"></div>
</div>
</div>

<button class="btn-go" id="go-btn" disabled>🎬 Produire le Film</button>
<button class="btn-reset" id="reset-btn">🗑️ Effacer tout et recommencer</button>

<!-- CONSOLE -->
<div class="panel open">
<div class="panel-header" data-toggle="p3">
<div class="panel-title"><div class="panel-icon green">📡</div>Suivi</div>
<div class="panel-chevron">▼</div>
</div>
<div class="panel-body" id="p3">
<div class="console-header">
<div class="console-title" id="console-state">Prêt</div>
<button class="console-clear" id="console-clear">🗑️ Effacer</button>
</div>
<div class="console-panel" id="console-log"><div class="console-empty">En attente…</div></div>
</div>
</div>

<div class="result-box" id="result-box">
<div style="font-size:0.75rem;color:var(--gold);font-weight:800;margin-bottom:0.6rem">🎬 VIDÉOS GÉNÉRÉES</div>
<div id="result-videos"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const AGNES_API = 'https://apihub.agnes-ai.com/v1';
const AGNES_POLL = 'https://apihub.agnes-ai.com/agnesapi';
const AGNES_MODEL = 'agnes-video-v2.0';
const KEY_STORE = 'agnes_api_key';
const SAVE_KEY = 'cineforge_v4_save';

// ═══════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════
const GENRES = [
{ id:'drama', emoji:'🎭', name:'Drame' },
{ id:'action', emoji:'💥', name:'Action' },
{ id:'scifi', emoji:'🚀', name:'Sci-Fi' },
{ id:'thriller', emoji:'🔪', name:'Thriller' },
{ id:'horror', emoji:'👻', name:'Horreur' },
{ id:'comedy', emoji:'😂', name:'Comédie' },
{ id:'romance', emoji:'💕', name:'Romance' },
{ id:'noir', emoji:'🕵️', name:'Film Noir' },
{ id:'western', emoji:'🤠', name:'Western' },
{ id:'fantasy', emoji:'🧙', name:'Fantasy' },
{ id:'documentary', emoji:'📹', name:'Docu' },
{ id:'musical', emoji:'🎵', name:'Musical' },
{ id:'war', emoji:'⚔️', name:'Guerre' },
{ id:'animation', emoji:'🎨', name:'Animation' },
{ id:'experimental', emoji:'🌀', name:'Expérimental' },
];

const AESTHETICS = [
{ id:'cinematic', label:'🎬 Cinématique' },
{ id:'vintage', label:'📼 Vintage' },
{ id:'neon', label:'💡 Néon' },
{ id:'minimalist', label:'◻️ Minimaliste' },
{ id:'gritty', label:'🔥 Gritty' },
{ id:'dreamy', label:'✨ Onirique' },
{ id:'anime', label:'🌸 Anime' },
{ id:'3d-render', label:'🧊 3D' },
];

const LIGHTING = [
{ id:'natural', label:'☀️ Naturel' },
{ id:'golden-hour', label:'🌅 Golden Hour' },
{ id:'blue-hour', label:'🌆 Blue Hour' },
{ id:'low-key', label:'🌑 Low-Key' },
{ id:'high-key', label:'💡 High-Key' },
{ id:'neon', label:'🔮 Néon' },
{ id:'candlelight', label:'🕯️ Bougie' },
{ id:'chiaroscuro', label:'🎭 Clair-obscur' },
];

const PALETTES = [
{ id:'warm', label:'🟠 Chaud' },
{ id:'cool', label:'🔵 Froid' },
{ id:'monochrome', label:'⬛ Monochrome' },
{ id:'sepia', label:'🟤 Sépia' },
{ id:'pastel', label:'🩷 Pastel' },
{ id:'vivid', label:'🌈 Vif' },
{ id:'teal-orange', label:'🎬 Teal & Orange' },
];

const SHOTS = [
{ id:'ecu', label:'Gros plan' },
{ id:'close', label:'Rapproché' },
{ id:'medium', label:'Moyen' },
{ id:'wide', label:'Large' },
{ id:'extreme-wide', label:'Général' },
{ id:'over-shoulder', label:'Épaule' },
{ id:'pov', label:'POV' },
{ id:'aerial', label:'Aérien' },
];

const MOVES = [
{ id:'static', label:'Statique' },
{ id:'pan', label:'Panoramique' },
{ id:'tilt', label:'Tilt' },
{ id:'dolly', label:'Travelling' },
{ id:'zoom', label:'Zoom' },
{ id:'crane', label:'Grue' },
{ id:'handheld', label:'Épaule' },
{ id:'steadicam', label:'Steadicam' },
];

// ═══════════════════════════════════════════════════════════
// STATE + AUTO-SAVE
// ═══════════════════════════════════════════════════════════
let state = {
title: '', subgenre: '', genre: null,
aesthetic: 'cinematic', lighting: 'natural', palette: 'warm',
scenes: [], sceneCounter: 0
};

let saveTimeout = null;
function autoSave() {
clearTimeout(saveTimeout);
$('save-info').textContent = '💾 Sauvegarde…';
saveTimeout = setTimeout(() => {
try {
localStorage.setItem(SAVE_KEY, JSON.stringify(state));
$('save-info').textContent = '✓ Sauvegardé';
setTimeout(() => $('save-info').textContent = '✓ Prêt', 1500);
} catch(e) { $('save-info').textContent = '⚠ Erreur sauvegarde'; }
}, 500);
}

function loadSave() {
try {
const saved = localStorage.getItem(SAVE_KEY);
if (saved) {
const data = JSON.parse(saved);
Object.assign(state, data);
return true;
}
} catch(e) {}
return false;
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ═══════════════════════════════════════════════════════════
// LOGGER
// ═══════════════════════════════════════════════════════════
const logLines = [];
function logTime() { const d = new Date(); return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':'); }
function addLog(msg, type='info') {
logLines.push({ time: logTime(), msg, type });
if (logLines.length > 200) logLines.shift();
const el = $('console-log');
el.innerHTML = logLines.map(l => '<div class="log-line"><span class="log-time">['+l.time+']</span><span class="log-msg log-'+l.type+'">'+esc(l.msg)+'</span></div>').join('');
el.scrollTop = el.scrollHeight;
}

// ═══════════════════════════════════════════════════════════
// API KEY
// ═══════════════════════════════════════════════════════════
function getKey() { try { return (localStorage.getItem(KEY_STORE) || '').trim(); } catch(e) { return ''; } }
function saveKey() {
const k = $('api-key').value.trim();
if (!k) return;
try { localStorage.setItem(KEY_STORE, k); refreshKeyUI(); addLog('Clé API enregistrée', 'success'); } catch(e) {}
}
function refreshKeyUI() {
const k = getKey();
if (k) {
$('api-badge').textContent = '✓ Prêt';
$('api-badge').className = 'panel-badge badge-green';
$('api-key').value = k;
} else {
$('api-badge').textContent = 'Non configuré';
$('api-badge').className = 'panel-badge badge-gray';
}
updateGo();
}

// ═══════════════════════════════════════════════════════════
// BUILD UI
// ═══════════════════════════════════════════════════════════
function buildGenreGrid() {
const g = $('genre-grid');
g.innerHTML = GENRES.map(gr => '<div class="genre-card'+(state.genre===gr.id?' selected':'')+'" data-genre="'+gr.id+'"><span class="genre-emoji">'+gr.emoji+'</span><span class="genre-name">'+gr.name+'</span></div>').join('');
g.querySelectorAll('.genre-card').forEach(card => {
card.onclick = () => {
state.genre = card.dataset.genre;
buildGenreGrid();
autoSave();
};
});
}

function buildPresetRow(cid, items, key) {
const row = $(cid);
row.innerHTML = items.map(it => '<div class="preset-chip'+(state[key]===it.id?' selected':'')+'" data-id="'+it.id+'">'+it.label+'</div>').join('');
row.querySelectorAll('.preset-chip').forEach(chip => {
chip.onclick = () => {
state[key] = chip.dataset.id;
buildPresetRow(cid, items, key);
autoSave();
};
});
}

function addScene(data = {}) {
state.sceneCounter = (state.sceneCounter || 0) + 1;
state.scenes.push({
id: state.sceneCounter,
title: data.title || 'Scène ' + (state.scenes.length + 1),
description: data.description || '',
shot: data.shot || 'medium',
move: data.move || 'static',
duration: data.duration || '10'
});
renderScenes();
autoSave();
}

function removeScene(id) {
state.scenes = state.scenes.filter(s => s.id !== id);
renderScenes();
autoSave();
}

function renderScenes() {
const list = $('scenes-list');
if (state.scenes.length === 0) {
list.innerHTML = '<div style="text-align:center;padding:1rem;color:var(--ink-faint);font-size:0.75rem;font-style:italic">Aucune scène. Clique sur "＋ Ajouter".</div>';
updateGo();
return;
}
list.innerHTML = state.scenes.map((sc, idx) =>
'<div class="scene-card">' +
'<div class="scene-card-header">' +
'<div class="scene-number">'+(idx+1)+'</div>' +
'<input class="scene-title-input" type="text" value="'+esc(sc.title)+'" data-field="title" data-id="'+sc.id+'" placeholder="Titre de la scène">' +
'<button class="scene-remove" data-remove="'+sc.id+'">✕</button>' +
'</div>' +
'<textarea class="scene-textarea" data-field="description" data-id="'+sc.id+'" placeholder="Description détaillée...">'+esc(sc.description)+'</textarea>' +
'<div class="scene-meta">' +
'<select data-field="shot" data-id="'+sc.id+'">'+SHOTS.map(s => '<option value="'+s.id+'"'+(sc.shot===s.id?' selected':'')+'>'+s.label+'</option>').join('')+'</select>' +
'<select data-field="move" data-id="'+sc.id+'">'+MOVES.map(m => '<option value="'+m.id+'"'+(sc.move===m.id?' selected':'')+'>'+m.label+'</option>').join('')+'</select>' +
'<select data-field="duration" data-id="'+sc.id+'">'+['5','8','10'].map(d => '<option value="'+d+'"'+(sc.duration===d?' selected':'')+'>'+d+'s</option>').join('')+'</select>' +
'</div>' +
'</div>'
).join('');

list.querySelectorAll('input, textarea, select').forEach(el => {
el.oninput = el.onchange = () => {
const sc = state.scenes.find(s => s.id === parseInt(el.dataset.id));
if (sc) { sc[el.dataset.field] = el.value; autoSave(); }
};
});
list.querySelectorAll('[data-remove]').forEach(btn => {
btn.onclick = () => removeScene(parseInt(btn.dataset.remove));
});
updateGo();
}

function updateGo() {
const b = $('go-btn');
const hasKey = !!getKey();
const hasScenes = state.scenes.length > 0;
b.disabled = !hasKey || !hasScenes;
if (!hasKey) b.textContent = '💜 Configure ta clé API';
else if (!hasScenes) b.textContent = '📋 Ajoute au moins 1 scène';
else b.textContent = '🎬 Produire — ' + state.scenes.length + ' scène' + (state.scenes.length>1?'s':'');
}

// ═══════════════════════════════════════════════════════════
// BUILD PROMPT
// ═══════════════════════════════════════════════════════════
function buildPrompt(scene) {
const parts = [];
if (state.title) parts.push('Scene from "' + state.title + '"');
if (state.genre) { const g = GENRES.find(x => x.id === state.genre); if (g) parts.push(g.name + ' film'); }
if (state.subgenre) parts.push(state.subgenre);
const aes = AESTHETICS.find(a => a.id === state.aesthetic); if (aes) parts.push(aes.label.replace(/^[^\s]+\s/, '') + ' aesthetic');
const lit = LIGHTING.find(l => l.id === state.lighting); if (lit) parts.push(lit.label.replace(/^[^\s]+\s/, '') + ' lighting');
const pal = PALETTES.find(p => p.id === state.palette); if (pal) parts.push(pal.label.replace(/^[^\s]+\s/, '') + ' color palette');
const shot = SHOTS.find(s => s.id === scene.shot); if (shot) parts.push(shot.label + ' shot');
const move = MOVES.find(m => m.id === scene.move); if (move) parts.push(move.label + ' camera movement');
if (scene.description) parts.push(scene.description);
parts.push('cinematic composition, film grain, professional color grading, 4K, no text, no watermark');
return parts.filter(Boolean).join('. ');
}

// ═══════════════════════════════════════════════════════════
// GENERATE
// ═══════════════════════════════════════════════════════════
async function generateOne(prompt, duration, onProgress) {
const key = getKey();
const frames = duration === 5 ? 121 : (duration === 10 ? 241 : 193);

const createRes = await fetch(AGNES_API + '/videos', {
method: 'POST',
headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
body: JSON.stringify({ model: AGNES_MODEL, prompt, num_frames: frames, frame_rate: 24, ratio: '9:16', resolution: '480p' })
});
if (!createRes.ok) throw new Error('HTTP ' + createRes.status);
const createData = await createRes.json();
const id = createData.video_id || createData.id || createData.task_id;
if (!id) throw new Error('Pas d\'ID');

const start = Date.now();
for (let i = 0; i < 200; i++) {
if (Date.now() - start > 900000) throw new Error('Timeout 15 min');
await sleep(6000);
const pollUrl = AGNES_POLL + '?video_id=' + encodeURIComponent(id) + '&model_name=' + encodeURIComponent(AGNES_MODEL);
const pollRes = await fetch(pollUrl, { headers: { 'Authorization': 'Bearer ' + key } });
const d = await pollRes.json();
const status = String(d.status || 'unknown').toLowerCase();
const progress = d.progress || d.internal_progress || 0;
const internal = d.internal_status || '';
onProgress(status, progress, internal, Math.floor((Date.now()-start)/1000));
if (status === 'completed' || status === 'succeeded' || status === 'done') {
const url = (d.metadata && d.metadata.url) || d.url || (d.output && d.output.url);
if (!url) throw new Error('Pas d\'URL');
return url;
}
if (status === 'failed' || status === 'error' || status === 'cancelled') throw new Error(status);
}
throw new Error('Timeout');
}

async function start() {
if (!getKey()) { addLog('Clé API manquante', 'error'); return; }
if (state.scenes.length === 0) { addLog('Aucune scène', 'error'); return; }

$('go-btn').disabled = true;
$('result-box').classList.remove('visible');
$('result-videos').innerHTML = '';
addLog('═══════════════════════', 'gold');
addLog('🎬 Production : ' + state.scenes.length + ' scènes', 'gold');

try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e) {}

const results = [];
for (let i = 0; i < state.scenes.length; i++) {
const sc = state.scenes[i];
addLog('───────────────', 'gold');
addLog('🎬 Scène ' + (i+1) + '/' + state.scenes.length + ' : ' + sc.title, 'gold');
try {
const prompt = buildPrompt(sc);
const duration = parseInt(sc.duration, 10);
const url = await generateOne(prompt, duration, (status, progress, internal, elapsed) => {
addLog('  ' + status + ' · ' + (internal||'-') + ' · ' + progress + '% · ' + elapsed + 's', 'dim');
});
results.push({ url, title: sc.title });
addLog('✅ Scène ' + (i+1) + ' OK', 'success');
} catch(e) {
addLog('❌ Scène ' + (i+1) + ' échouée : ' + e.message, 'error');
results.push({ url: null, title: sc.title, error: e.message });
}
}

const $result = $('result-box');
$result.classList.add('visible');
$('result-videos').innerHTML = results.map((r, i) => {
if (r.url) return '<div style="margin-bottom:0.7rem"><div style="font-size:0.7rem;color:var(--gold);font-weight:700;margin-bottom:0.3rem">Scène '+(i+1)+' : '+esc(r.title)+'</div><video controls playsinline src="'+r.url+'" style="width:100%;border-radius:8px;aspect-ratio:9/16;background:#000"></video><a href="'+r.url+'" download="scene-'+(i+1)+'.mp4" style="display:block;text-align:center;padding:0.5rem;margin-top:0.3rem;background:var(--panel-2);color:var(--gold);border-radius:6px;text-decoration:none;font-size:0.7rem">⬇ Télécharger</a></div>';
return '<div style="margin-bottom:0.7rem;padding:0.5rem;background:rgba(255,90,90,0.1);border:1px solid var(--red);border-radius:8px"><div style="font-size:0.7rem;color:var(--red)">Scène '+(i+1)+' : '+esc(r.title)+' — Échec</div></div>';
}).join('');

const ok = results.filter(r => r.url).length;
addLog('🎉 Terminé : ' + ok + '/' + results.length, 'success');
$('go-btn').disabled = false;
updateGo();
}

// ═══════════════════════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════════════════════
function resetAll() {
if (!confirm('Effacer TOUT le projet ? (Le titre, le genre, les scènes...)')) return;
state = { title:'', subgenre:'', genre:null, aesthetic:'cinematic', lighting:'natural', palette:'warm', scenes:[], sceneCounter:0 };
try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
$('film-title').value = '';
$('subgenre').value = '';
buildGenreGrid();
buildPresetRow('aesthetic-row', AESTHETICS, 'aesthetic');
buildPresetRow('lighting-row', LIGHTING, 'lighting');
buildPresetRow('palette-row', PALETTES, 'palette');
renderScenes();
addLog('🗑️ Projet effacé', 'warn');
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
(function init() {
document.querySelectorAll('[data-toggle]').forEach(h => {
h.onclick = () => $(h.dataset.toggle).classList.toggle('open');
});

buildGenreGrid();
buildPresetRow('aesthetic-row', AESTHETICS, 'aesthetic');
buildPresetRow('lighting-row', LIGHTING, 'lighting');
buildPresetRow('palette-row', PALETTES, 'palette');

$('film-title').oninput = e => { state.title = e.target.value; autoSave(); };
$('subgenre').oninput = e => { state.subgenre = e.target.value; autoSave(); };
$('add-scene-btn').onclick = () => addScene();
$('go-btn').onclick = start;
$('reset-btn').onclick = resetAll;
$('api-save').onclick = saveKey;
$('api-key').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); saveKey(); } };
$('console-clear').onclick = () => { logLines.length = 0; $('console-log').innerHTML = '<div class="console-empty">En attente…</div>'; };

// RESTAURER LA SAUVEGARDE
const restored = loadSave();
if (restored) {
$('film-title').value = state.title || '';
$('subgenre').value = state.subgenre || '';
buildGenreGrid();
buildPresetRow('aesthetic-row', AESTHETICS, 'aesthetic');
buildPresetRow('lighting-row', LIGHTING, 'lighting');
buildPresetRow('palette-row', PALETTES, 'palette');
addLog('✨ Projet restauré (' + state.scenes.length + ' scènes)', 'success');
$('save-info').textContent = '✓ Restauré';
} else {
addLog('✨ CinéForge v4.0 prêt — sauvegarde auto activée', 'success');
}

// Clé API
if (getKey()) $('api-key').value = getKey();
refreshKeyUI();
renderScenes();
})();
</script>
